name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install javascript-obfuscator
        run: npm install -g javascript-obfuscator

      - name: Build obfuscated dist/
        run: python3 build.py

      - name: Verify build output
        run: |
          echo "=== dist/ contents ==="
          ls -lh dist/
          echo "=== index.html size ==="
          wc -c dist/index.html

      # Το deploy γίνεται με σκέτο git, χωρίς εξωτερικό action.
      # Το peaceiris/actions-gh-pages κατεβαίνει από το codeload.github.com, που
      # επέστρεφε επίμονα 429 (Too Many Requests) και κολλούσε το deploy στο
      # «Set up job» — πριν τρέξει καθόλου το build.
      - name: Deploy to gh-pages
        run: |
          touch dist/.nojekyll          # αντικαθιστά το enable_jekyll: false
          cd dist
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA:0:7}"
          # --force σε φρέσκο repo = force_orphan: true (μονή commit στο gh-pages)
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
