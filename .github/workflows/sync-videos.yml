name: Sync → fooddaily/videos

# Καθρεφτίζει τον φάκελο των βίντεο και τα δεδομένα των συνταγών στο ιδιωτικό
# fooddaily/videos, ώστε να τα βλέπουν οι αυτοματοποιημένες διαδικασίες.
#
# ΑΠΑΙΤΕΙ το secret VIDEOS_REPO_TOKEN: personal access token με δικαίωμα
# εγγραφής ΜΟΝΟ στο fooddaily/videos. Settings → Secrets and variables →
# Actions → New repository secret.
#
# Τρέχει μόνο όταν αλλάζει κάτι σχετικό — όχι σε κάθε commit.

on:
  push:
    branches: [main]
    paths:
      - 'ads/**'
      - 'index.html'
      - '_prepared/macros.json'
      - '_prepared/macros_build.py'
      - 'lang/de.json'
      - '.github/workflows/sync-videos.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Εξαγωγή δεδομένων συνταγών
        run: |
          mkdir -p out/data
          node .github/scripts/export-recipes.js out/data/recipes.json

      - name: Συγκέντρωση αρχείων
        run: |
          mkdir -p out/ads
          # μόνο ό,τι παρακολουθεί το git — τα παραγόμενα mp4 μένουν εκτός
          git ls-files ads -z | xargs -0 -I{} cp --parents {} out/
          cp _prepared/macros.json      out/data/ 2>/dev/null || true
          cp _prepared/macros_build.py  out/data/ 2>/dev/null || true
          cp lang/de.json               out/data/ 2>/dev/null || true
          cp .github/mirror-README.md   out/README.md

      - name: Ώθηση στο fooddaily/videos
        env:
          TOKEN: ${{ secrets.VIDEOS_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Λείπει το secret VIDEOS_REPO_TOKEN — ο συγχρονισμός παραλείπεται."
            exit 1
          fi
          cd out
          git init -q
          git config user.name  "FoodDaily sync"
          git config user.email "fooddaily.app@gmail.com"
          git add -A
          git commit -q -m "Συγχρονισμός από georgebokos.github.io@${GITHUB_SHA::7}

          ${{ github.event.head_commit.message }}"
          git branch -M main
          git remote add origin "https://x-access-token:${TOKEN}@github.com/fooddaily/videos.git"
          # Ο καθρέφτης γράφεται πάντα από την αρχή: η πηγή είναι το άλλο repo
          git push --force origin main
          echo "✓ Συγχρονίστηκε"
