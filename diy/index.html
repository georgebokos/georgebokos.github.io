function flowDiagram(x){
  const rows = x.steps.map((s, i) => `
    <div class="fl-row">
      <div class="fl-col"><div class="fl-n">${i+1}</div>${i < x.steps.length-1 ? '<div class="fl-line"></div>' : ''}</div>
      <div class="fl-txt">${esc(L(s,'t'))}</div>
    </div>`).join('');
  return `<div class="blk"><h4>${esc(t('flowTitle'))}</h4><div class="flow">${rows}</div></div>`;
}

/* =====================================================================
   ΛΕΠΤΟΜΕΡΕΙΕΣ ΕΡΓΑΣΙΑΣ
   ===================================================================== */
const TABS = [
  {id:'over',  k:'tabOver'},
  {id:'kit',   k:'tabKit'},
  {id:'steps', k:'tabSteps'},
  {id:'diag',  k:'tabDiag'},
  {id:'tips',  k:'tabTips'}
];

function openTask(id, keepTab){
  const x = TASKS.find(y => y.id === id);
  if (!x) return;
  S.open = id;
  if (!keepTab) S.tab = 'over';
  $('#shIco').textContent = x.ico;
  $('#shName').textContent = L(x,'n');
  $('#shCat').textContent = catOf(x.cat).ico + ' ' + L(catOf(x.cat),'n') + ' · ' + diffLabel(x.diff);
  $('#tabs').innerHTML = TABS.map(tb =>
    `<button class="tab${S.tab===tb.id?' active':''}" data-tab="${tb.id}">${esc(t(tb.k))}</button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b =>
    b.addEventListener('click', () => { S.tab = b.dataset.tab; openTask(id, true); $('#shBody').scrollTop = 0; }));
  $('#shBody').innerHTML = tabBody(x);
  wireBody(x);
  $('#backdrop').classList.add('open');
  $('#sheet').classList.add('open');
  document.body.style.overflow = 'hidden';
  if (location.hash !== '#'+id) history.replaceState(null, '', '#'+id);
}

function closeTask(){
  S.open = null;
  $('#backdrop').classList.remove('open');
  $('#sheet').classList.remove('open');
  document.body.style.overflow = '';
  history.replaceState(null, '', location.pathname + location.search);
  renderGrid();
}
$('#shX').addEventListener('click', closeTask);
$('#backdrop').addEventListener('click', closeTask);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.open) closeTask(); });

function ul(items, cls){
  if (!items || !items.length || (items.length===1 && items[0]==='—')) return '';
  return `<ul class="klist ${cls}">${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`;
}

function tabBody(x){
  if (S.tab === 'over') return bodyOver(x);
  if (S.tab === 'kit')  return bodyKit(x);
  if (S.tab === 'steps')return bodySteps(x);
  if (S.tab === 'diag') return bodyDiag(x);
  return bodyTips(x);
}

function bodyOver(x){
  let h = `<div class="blk"><p class="lead">${esc(L(x,'d'))}</p></div>`;
  h += `<div class="blk"><h4>${esc(curLang==='en'?'At a glance':'Με μια ματιά')}</h4><div class="mgrid">
      <div class="mit"><label>${esc(t('time'))}</label><span>${esc(L(x,'time'))}</span></div>
      <div class="mit"><label>${esc(t('cost'))}</label><span>${esc(L(x,'cost'))}</span></div>
      <div class="mit"><label>${esc(t('diff'))}</label><span>${esc(diffLabel(x.diff))}</span></div>
      <div class="mit"><label>${esc(t('people'))}</label><span>${esc(L(x,'ppl'))}</span></div>
    </div></div>`;
  const saf = L(x,'safety');
  if (saf && saf.length)
    h += `<div class="warn"><h4>${esc(t('safety'))}</h4><ul>${saf.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>`;
  if (x.pro)
    h += `<div class="pro"><h4>${esc(t('proTitle'))}</h4><p>${esc(L(x,'pro'))}</p></div>`;
  h += videoBlock(x);
  return h;
}

function bodyKit(x){
  let h = '';
  h += `<div class="blk"><h4>${esc(t('tools'))}</h4>${ul(L(x,'tools'),'tool')}</div>`;
  const m = L(x,'mats');
  if (m && m.length && !(m.length===1 && m[0]==='—'))
    h += `<div class="blk"><h4>${esc(t('materials'))}</h4>${ul(m,'mat')}</div>`;
  h += `<div class="blk"><h4>${esc(t('cost'))}</h4><p class="lead">${esc(L(x,'cost'))}</p></div>`;
  return h;
}

function bodySteps(x){
  const done = getProg(x.id), tot = x.steps.length;
  const pct = tot ? Math.round(done.length*100/tot) : 0;
  let h = `<div class="pbar"><div class="pb-t">
      <div class="pb-n">${esc(t('progress',{D:done.length,T:tot}))}</div>
      <div class="pb-l"><i style="width:${pct}%"></i></div>
    </div><button id="resetProg">${esc(t('reset'))}</button></div>`;
  h += x.steps.map((s, i) => {
    const isDone = done.indexOf(i) !== -1;
    let inner = `<div class="step-n">${esc(curLang==='en'?'Step':'Βήμα')} ${i+1} / ${tot}</div>
      <div class="step-t">${esc(L(s,'t'))}</div>
      <div class="step-d">${esc(L(s,'d'))}</div>`;
    if (s.tip)  inner += `<div class="step-tip"><b>${esc(curLang==='en'?'Tip:':'Συμβουλή:')}</b> ${esc(L(s,'tip'))}</div>`;
    if (s.warn) inner += `<div class="step-w"><b>${esc(curLang==='en'?'Warning:':'Προσοχή:')}</b> ${esc(L(s,'warn'))}</div>`;
    inner += `<button class="stuck-btn" data-stuck="${i}">📷 ${esc(t('stuck'))}</button>`;
    return `<div class="step${isDone?' done':''}" data-i="${i}">
      <button class="step-chk" data-chk="${i}" aria-label="done">✓</button>
      <div>${inner}</div></div>`;
  }).join('');
  h += `<p class="note">${esc(t('savedTip'))}</p>`;
  return h;
}

function svgL(svg){

}

function bodyDiag(x){

    </div>`;

  h += videoBlock(x);

}

function bodyTips(x){
  let h = '';
  const tp = L(x,'tips'), er = L(x,'errs');
  if (tp && tp.length) h += `<div class="blk"><h4>${esc(t('tipsT'))}</h4>${ul(tp,'tip')}</div>`;
  if (er && er.length) h += `<div class="blk"><h4>${esc(t('errT'))}</h4>${ul(er,'err')}</div>`;

    h += `<div class="blk" style="background:transparent;border:none;padding:0"><h4 style="padding:0 4px 8px">${esc(t('faqT'))}</h4>`;
    h += x.faq.map(f => `<details class="faq"><summary>${esc(L(f,'q'))}</summary><p>${esc(L(f,'a'))}</p></details>`).join('');
    h += `</div>`;

function videoBlock(x){

function wireBody(x){

/* =====================================================================
   ΒΟΗΘΕΙΑ ΜΕ ΦΩΤΟΓΡΑΦΙΑ
   Ο χρήστης κολλάει σε ένα βήμα, τραβά φωτογραφία, και η εικόνα μαζί με το
   περιβάλλον του βήματος πηγαίνει σε υπηρεσία ανάλυσης που επιστρέφει οδηγία.

   Το κλειδί του API ΔΕΝ βρίσκεται ποτέ εδώ — η σελίδα είναι δημόσια και θα το
   διάβαζε ο καθένας. Μιλάμε με έναν δικό μας μικρό worker (δες worker/), που
   κρατά το κλειδί, βάζει όρια χρήσης και προωθεί το αίτημα.
   ===================================================================== */

// Συμπλήρωσε εδώ τη διεύθυνση του worker μετά το deploy, π.χ.
// const HELP_ENDPOINT = 'https://diy-help.<λογαριασμός>.workers.dev';
const HELP_ENDPOINT = '';

// Public SDK key του RevenueCat (Android). Σχεδιασμένο να ενσωματώνεται σε
// πελάτη — ΔΕΝ είναι μυστικό. Το μυστικό κλειδί ζει μόνο στον worker.
const RC_PUBLIC_KEY  = '';
const ENTITLEMENT_ID = 'DIY Pro';
// Διεύθυνση της εφαρμογής στο Google Play, για όσους ανοίγουν τη σελίδα σε
// browser ή iPhone: εκεί δεν υπάρχει τρόπος αγοράς.
const PLAY_URL = '';

const MAX_IMG_DIM = 1024;      // μεγαλύτερη πλευρά — κρατά χαμηλά κόστος και χρόνο
const MAX_IMG_BYTES = 3500000; // ασφαλιστική δικλείδα πριν το ανέβασμα

function helpEndpoint(){
  try { return localStorage.getItem('diy_help_url') || HELP_ENDPOINT; }
  catch(e){ return HELP_ENDPOINT; }
}
/* Το public key μπορεί να δοθεί και από τη συσκευή (?rc=…), ώστε να δοκιμάζεται
   η ροή αγοράς χωρίς νέο build της εφαρμογής. */
function rcKey(){
  try { return localStorage.getItem('diy_rc_key') || RC_PUBLIC_KEY; }
  catch(e){ return RC_PUBLIC_KEY; }
}

/* =====================================================================
   PREMIUM
   Οι οδηγοί είναι δωρεάν. Μόνο η ανάλυση φωτογραφίας είναι Premium, γιατί
   κάθε φωτογραφία έχει πραγματικό κόστος.

   ΠΡΟΣΟΧΗ: ό,τι βλέπεις εδώ είναι ΜΟΝΟ για τη διεπαφή. Η πραγματική
   επαλήθευση της συνδρομής γίνεται στον worker, που ρωτά το RevenueCat με
   μυστικό κλειδί. Μια μεταβλητή στη σελίδα την αλλάζει οποιοσδήποτε από τα
   εργαλεία του browser — γι' αυτό δεν την εμπιστευόμαστε ποτέ.
   ===================================================================== */
const P = { ready:false, native:false, store:false, active:false,
            plan:null, quota:null, credits:0, userId:null, offers:null, busy:false };

function cap(){ return window.Capacitor; }
function isNativeApp(){
  const c = cap();
  try { return !!(c && typeof c.isNativePlatform === 'function' && c.isNativePlatform()); }
  catch(e){ return false; }
}
function rcPlugin(){
  const c = cap();
  return (c && c.Plugins && c.Plugins.Purchases) || null;
}
/* Αγορά μόνο μέσα στην εφαρμογή Android. Σε browser και iPhone δεν υπάρχει
   Google Play Billing, οπότε δείχνουμε ενημερωτικό μήνυμα αντί για paywall
   που δεν ολοκληρώνεται ποτέ. */
function hasStore(){ return isNativeApp() && !!rcPlugin(); }

async function initPremium(){
  P.native = isNativeApp();
  P.store  = hasStore();
  if (P.store && rcKey()){
    try {
      await rcPlugin().configure({ apiKey: rcKey() });
      const r = await rcPlugin().getAppUserID();
      P.userId = r && r.appUserID || null;
      await readCustomerInfo();
    } catch(e){}
  }
  await syncQuota();
  P.ready = true;
}

async function readCustomerInfo(){
  try {
    const r = await rcPlugin().getCustomerInfo();
    const ci = r && r.customerInfo;
    const act = ci && ci.entitlements && ci.entitlements.active || {};
    P.active = !!(act[ENTITLEMENT_ID] && act[ENTITLEMENT_ID].isActive);
  } catch(e){ P.active = false; }
}

/* Ρωτά τον worker τι ισχύει πραγματικά για αυτόν τον χρήστη. Ο worker είναι
   η μοναδική πηγή αλήθειας για συνδρομή και υπόλοιπο. */
async function syncQuota(){
  const url = helpEndpoint();
  if (!url || !P.userId) return;
  try {
    const res = await fetch(url.replace(/\/$/, '') + '/status', {
      headers: { 'X-App-User-Id': P.userId }
    });
    if (!res.ok) return;
    const d = await res.json();
    P.active  = !!d.active;
    P.plan    = d.plan || null;
    P.quota   = (typeof d.quotaLeft === 'number') ? d.quotaLeft : null;
    P.credits = d.credits || 0;
  } catch(e){}
}

function canAsk(){
  if (P.credits > 0) return true;          // πακέτο φωτογραφιών
  if (!P.active) return false;             // καμία συνδρομή
  // Συνδρομητής: μόνο αν του απομένουν φωτογραφίες. Όταν το υπόλοιπο είναι
  // ακόμη άγνωστο (null), αφήνουμε τον worker να αποφασίσει.
  return P.quota === null || P.quota > 0;
}
function photosLeft(){
  if (P.credits > 0 && !P.active) return P.credits;
  if (P.active && typeof P.quota === 'number') return P.quota;
  return null;
}

async function loadOffers(){
  if (!P.store) return null;
  try {
    const o = await rcPlugin().getOfferings();
    const cur = o && o.current;
    if (!cur || !cur.availablePackages || !cur.availablePackages.length) return null;
    P.offers = cur.availablePackages;
    return P.offers;
  } catch(e){ return null; }
}

async function buyPackage(pkg){
  if (P.busy) return;
  P.busy = true;
  renderHelpBody();
  try {
    await rcPlugin().purchasePackage({ aPackage: pkg });
    await readCustomerInfo();
    await syncQuota();
    toast(t('buyOk'));
  } catch(e){
    // Ο χρήστης που ακυρώνει δεν είναι σφάλμα — δεν του πετάμε μήνυμα λάθους.
    const cancelled = e && (e.code === '1' || e.userCancelled ||
                      /cancel/i.test(String(e && (e.message || e.code) || '')));
    toast(cancelled ? t('buyCancel') : t('buyErr'));
  }
  P.busy = false;
  renderHelpBody();
}

async function restorePurchases(){
  if (P.busy || !P.store) return;
  P.busy = true; renderHelpBody();
  try {
    await rcPlugin().restorePurchases();
    await readCustomerInfo();
    await syncQuota();
    toast(canAsk() ? t('restoreOk') : t('restoreNo'));
  } catch(e){ toast(t('restoreNo')); }
  P.busy = false;
  renderHelpBody();
}

const H = { task:null, step:0, img:null, busy:false };

function openHelp(taskId, stepIdx){
  const x = TASKS.find(y => y.id === taskId);
  if (!x) return;
  H.task = x; H.step = stepIdx; H.img = null; H.busy = false;
  const st = x.steps[stepIdx];
  $('#hCtx').textContent = L(x,'n') + ' · ' + t('ctxStep', {N: stepIdx+1, T: L(st,'t')});
  renderHelpBody();

  $('#hSheet').classList.add('open');
  // Οι τιμές έρχονται από το κατάστημα, οπότε φορτώνονται ασύγχρονα.
  if (!canAsk() && P.store && !P.offers) loadOffers().then(() => { if (H.task) renderHelpBody(); });
  if (P.userId) syncQuota().then(() => { if (H.task) renderHelpBody(); });

function closeHelp(){
  H.task = null; H.img = null; H.busy = false;

/* Τι βλέπει ο χρήστης όταν πατά «Κόλλησα»:
   1. η υπηρεσία δεν έχει ρυθμιστεί  → ενημερωτικό μήνυμα
   2. δεν έχει Premium               → paywall
   3. έχει                           → η φόρμα φωτογραφίας */
function renderHelpBody(err){

             <div class="o-s">${esc(sub ? t('buySub') : t('buyPack'))}</div></div>
        <div class="o-p"><b>${esc(pr.priceString || '')}</b>${sub ? `<span>${esc(t('perMonth'))}</span>` : ''}</div>
      </button>`;

  $('#hBody').querySelectorAll('[data-buy]').forEach(b =>

function renderHelpForm(err){
  const note = $('#hNote') ? $('#hNote').value : '';
  const left = photosLeft();
  $('#hBody').innerHTML = `
    ${left !== null ? `<div class="quota${left <= 5 ? ' low' : ''}">📷 ${esc(
        P.active ? t('quotaLeft',{N:left}) : t('creditsLeft',{N:left}))}</div>` : ''}
    <p class="h-lead">${esc(t('stuckSub'))}</p>
    ${err ? `<div class="h-err">${esc(err)}</div>` : ''}
    ${H.img
      ? `<div class="shot"><img src="${H.img.dataUrl}" alt=""><button id="hRetake">${esc(t('retake'))}</button></div>`
      : `<button class="drop" id="hPick">${esc(t('takePhoto'))}</button>`}

function wireHelpForm(){
  const file = $('#hFile');
  const pick = () => file && file.click();
  const p = $('#hPick'); if (p) p.addEventListener('click', pick);
  const r = $('#hRetake'); if (r) r.addEventListener('click', pick);
  if (file) file.addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    try {
      H.img = await shrinkImage(f, MAX_IMG_DIM, 0.82);
      if (H.img.dataUrl.length > MAX_IMG_BYTES){ H.img = null; renderHelpBody(t('errBig')); return; }
      renderHelpBody();
    } catch(err){ renderHelpBody(t('errBig')); }
  });
  const send = $('#hSend'); if (send) send.addEventListener('click', submitHelp);
}

/* Σμίκρυνση στη συσκευή: λιγότερα δεδομένα στο δίκτυο, μικρότερο κόστος
   ανάλυσης, και η φωτογραφία δεν φεύγει ποτέ σε πρωτότυπο μέγεθος. */
function shrinkImage(fileObj, maxDim, quality){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(fileObj);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.naturalWidth, h = img.naturalHeight;
      if (!w || !h) return reject(new Error('empty'));
      const big = Math.max(w, h);
      if (big > maxDim){ const k = maxDim / big; w = Math.round(w*k); h = Math.round(h*k); }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const cx = c.getContext('2d');
      cx.drawImage(img, 0, 0, w, h);
      resolve({ dataUrl: c.toDataURL('image/jpeg', quality), w, h });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };
    img.src = url;
  });
}

async function submitHelp(){
  if (H.busy) return;
  if (!H.img){ renderHelpBody(t('errNoImg')); return; }
  const note = ($('#hNote') && $('#hNote').value || '').slice(0, 500);
  const x = H.task, st = x.steps[H.step];
  H.busy = true;
  $('#hBody').innerHTML = `<div class="h-wait"><span class="spin"></span><span>${esc(t('analysing'))}</span></div>`;

  const payload = {
    lang: curLang,
    image: H.img.dataUrl.split(',')[1],
    mime: 'image/jpeg',
    note: note,
    task: { id: x.id, name: L(x,'n'), summary: L(x,'d') },
    step: { n: H.step + 1, total: x.steps.length, title: L(st,'t'), detail: L(st,'d') },
    safety: (L(x,'safety') || []).slice(0, 4),
    pro: L(x,'pro') || ''
  };

  let res, data;
  try {
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 90000);
    res = await fetch(helpEndpoint().replace(/\/$/, '') + '/help', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        // Ο worker επαληθεύει ΑΥΤΟΝ τον χρήστη στο RevenueCat πριν απαντήσει.
        'X-App-User-Id': P.userId || ''
      },
      body: JSON.stringify(payload),
      signal: ctl.signal
    });
    clearTimeout(to);
    data = await res.json().catch(() => null);
  } catch(e){
    H.busy = false; renderHelpBody(t('errNet')); return;
  }
  H.busy = false;

  // 402: ο worker λέει ότι δεν υπάρχει δικαίωμα ή εξαντλήθηκαν οι φωτογραφίες.
  if (res.status === 402){
    P.active  = !!(data && data.active);
    P.quota   = (data && typeof data.quotaLeft === 'number') ? data.quotaLeft : 0;
    P.credits = (data && data.credits) || 0;
    renderHelpBody();
    return;
  }
  if (res.status === 401){ renderHelpBody(t('errAuth')); return; }
  if (!res.ok || !data || !data.answer){
    renderHelpBody(res && res.status === 429 ? t('errBusy') : t('errGen'));
    return;
  }
  // Ο worker επιστρέφει το υπόλοιπο μετά τη χρέωση.
  if (typeof data.quotaLeft === 'number') P.quota = data.quotaLeft;
  if (typeof data.credits === 'number') P.credits = data.credits;
  renderAnswer(data);
}

function renderAnswer(data){
  const paras = String(data.answer).split(/\n\s*\n/).filter(Boolean)
    .map(par => `<p>${esc(par).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>')}</p>`)
    .join('');
  $('#hBody').innerHTML = `
    <div class="ans"><h4>${esc(t('answerT'))}</h4>${paras}</div>
    ${data.callPro ? `<div class="ans-pro"><b>${esc(t('proTitle'))}</b>${esc(t('aiNote'))}</div>`
                   : `<p class="h-priv">${esc(t('aiNote'))}</p>`}
    <button class="h-send" id="hAgain">${esc(t('again'))}</button>`;
  const a = $('#hAgain');
  if (a) a.addEventListener('click', () => { H.img = null; renderHelpBody(); });
}

/* Δικός μας service worker, με εμβέλεια ΜΟΝΟ τον φάκελο της εφαρμογής.
   Η πιο συγκεκριμένη εμβέλεια υπερισχύει έναντι service worker στη ρίζα
   του domain, οπότε τη σελίδα την ελέγχει αποκλειστικά αυτός. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {

  });
}

.fl-col{display:flex;flex-direction:column;align-items:center;align-self:stretch}
.fl-n{width:26px;height:26px;border-radius:50%;background:var(--priS);color:var(--pri);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fl-line{flex:1;width:2px;background:var(--brd);min-height:14px;margin:3px 0}
.fl-txt{font-size:13.5px;color:var(--tx2);line-height:1.5;padding-bottom:14px;font-weight:600}
.fl-row:last-child .fl-txt{padding-bottom:0}

/* ---------- ΒΟΗΘΕΙΑ ΜΕ ΦΩΤΟΓΡΑΦΙΑ ---------- */
.stuck-btn{margin-top:11px;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:var(--rx);
  border:1.5px dashed var(--brd2);background:transparent;color:var(--tx2);font-size:12.5px;font-weight:700;cursor:pointer;
  transition:border-color .15s,color .15s,background .15s}
.stuck-btn:hover{border-color:var(--pri);color:var(--pri);background:var(--priS);border-style:solid}
.hsheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:760px;
  height:92dvh;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -8px 60px rgba(0,0,0,.34);z-index:120;
  display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.32,1.12,.6,1);overflow:hidden}
.hsheet.open{transform:translateX(-50%) translateY(0)}
.h-head{padding:10px 18px 14px;display:flex;gap:12px;align-items:flex-start;flex-shrink:0;border-bottom:1px solid var(--brd)}
.h-head h3{font-size:17px;font-weight:800;color:var(--tx);line-height:1.25}
.h-head p{font-size:12.5px;color:var(--tx3);margin-top:4px;line-height:1.45}
.h-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(40px + env(safe-area-inset-bottom));flex:1;overscroll-behavior:contain}
.h-lead{font-size:13.5px;color:var(--tx2);line-height:1.65;margin-bottom:14px}
.drop{width:100%;border:2px dashed var(--brd2);border-radius:var(--r);background:var(--card);padding:26px 18px;
  text-align:center;cursor:pointer;color:var(--tx2);font-size:14px;font-weight:700;transition:border-color .15s,background .15s}
.drop:hover{border-color:var(--pri);background:var(--priS);color:var(--pri)}
.shot{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--brd);background:var(--bg2);margin-bottom:12px}
.shot img{display:block;width:100%;height:auto;max-height:44dvh;object-fit:contain}
.shot button{position:absolute;top:9px;right:9px;padding:6px 11px;border-radius:100px;border:none;cursor:pointer;
  background:rgba(10,14,18,.72);color:#fff;font-size:11.5px;font-weight:700;backdrop-filter:blur(4px)}
.h-note{width:100%;padding:11px 13px;border-radius:var(--rs);border:1.5px solid var(--brd2);background:var(--card);
  color:var(--tx);font-size:14px;outline:none;resize:vertical;min-height:74px;margin-bottom:12px;line-height:1.5}
.h-note:focus{border-color:var(--pri)}
.h-send{width:100%;padding:14px;border-radius:var(--rs);border:none;background:var(--pri);color:#fff;font-size:15px;
  font-weight:750;cursor:pointer;transition:background .2s}
.h-send:hover:not(:disabled){background:var(--pri2)}
.h-send:disabled{opacity:.5;cursor:not-allowed}
.h-priv{font-size:11.5px;color:var(--tx3);line-height:1.6;margin-top:12px;padding:0 2px}
.h-wait{display:flex;align-items:center;gap:12px;padding:22px 16px;color:var(--tx2);font-size:14px;font-weight:650}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--brd);border-top-color:var(--pri);
  animation:sp .8s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
.ans{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:16px;margin-bottom:12px}
.ans h4{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--tx3);font-weight:750;margin-bottom:10px}
.ans p{font-size:14.5px;color:var(--tx2);line-height:1.75;margin-bottom:10px}
.ans p:last-child{margin-bottom:0}
.ans strong{color:var(--tx);font-weight:750}
.ans-pro{background:var(--dgrS);border:1.5px solid var(--dgr);border-radius:var(--r);padding:14px 15px;margin-bottom:12px;
  font-size:13.5px;color:var(--tx2);line-height:1.65}
.ans-pro b{color:var(--dgr);display:block;margin-bottom:5px}
.h-err{background:var(--dgrS);border:1px solid var(--dgr);border-radius:var(--r);padding:14px 15px;margin-bottom:12px;
  font-size:14px;color:var(--tx2);line-height:1.6}
.h-off{background:var(--accS);border:1.5px solid var(--acc);border-radius:var(--r);padding:16px}
.h-off b{display:block;color:var(--acc);font-size:14.5px;margin-bottom:7px}
.h-off p{font-size:13.5px;color:var(--tx2);line-height:1.7}

/* ---------- PREMIUM ---------- */
.pw-top{text-align:center;padding:6px 4px 18px}
.pw-ico{font-size:40px;line-height:1;margin-bottom:10px}
.pw-badge{display:inline-block;padding:4px 12px;border-radius:100px;background:linear-gradient(135deg,var(--acc),#C77A00);
  color:#fff;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;margin-bottom:10px}
.pw-top h3{font-size:20px;font-weight:800;color:var(--tx);line-height:1.25;margin-bottom:8px}
.pw-top p{font-size:13.5px;color:var(--tx2);line-height:1.65}
.pw-list{list-style:none;background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.pw-list li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--tx2);line-height:1.55;padding:7px 0}
.pw-list li::before{content:'✓';color:var(--ok);font-weight:800;flex-shrink:0}
.pw-opt{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1.5px solid var(--brd2);
  border-radius:var(--r);padding:14px 15px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,transform .12s}
.pw-opt:hover:not(:disabled){border-color:var(--pri);transform:translateY(-1px)}
.pw-opt:disabled{opacity:.55;cursor:not-allowed}
.pw-opt .o-t{font-size:14.5px;font-weight:750;color:var(--tx);line-height:1.3}
.pw-opt .o-s{font-size:12px;color:var(--tx3);margin-top:3px;line-height:1.4}
.pw-opt .o-p{margin-left:auto;text-align:right;flex-shrink:0}
.pw-opt .o-p b{display:block;font-size:16px;font-weight:800;color:var(--pri)}
.pw-opt .o-p span{font-size:11px;color:var(--tx3)}
.pw-opt.best{border-color:var(--acc);background:var(--accS)}
.pw-restore{width:100%;background:none;border:none;color:var(--pri);font-size:13px;font-weight:700;
  cursor:pointer;padding:12px;text-decoration:underline}
.pw-free{font-size:12px;color:var(--tx3);text-align:center;line-height:1.6;padding:6px 8px 0}
.quota{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--tx2);
  background:var(--okS);border:1px solid var(--ok);border-radius:100px;padding:7px 14px;margin-bottom:14px;width:fit-content}
.quota.low{background:var(--accS);border-color:var(--acc);color:var(--acc)}
</style>
</body>
</html>
