  {t:'Ρύθμισε τη βίδα H (υψηλή)', t_en:'Set the H (high) screw',
   d:'Η βίδα H ορίζει πόσο έξω πάει το ντεραγιέρ. Με την αλυσίδα στο μικρότερο γρανάζι, ρύθμισε ώστε το πάνω ραουλάκι να είναι ακριβώς κάτω από αυτό το γρανάζι — ούτε πιο έξω, ούτε πιο μέσα.',
   d_en:'The H screw sets how far out the derailleur travels. With the chain on the smallest sprocket, adjust so the upper jockey wheel sits directly under that sprocket — no further out, no further in.'},
  {t:'Σύνδεσε τη ντίζα τεντωμένη', t_en:'Reconnect the cable taut',
   d:'Τράβα τη ντίζα με πένσα ώστε να είναι τεντωμένη αλλά χωρίς να μετακινεί το ντεραγιέρ, και σφίξε τη βίδα σύσφιξης πάνω στην αυλάκωση.',
   d_en:'Pull the cable taut with pliers, tight but not moving the derailleur, and clamp the pinch bolt on the correct groove.'},
  {t:'Ρύθμισε τις ενδιάμεσες με το βαρελάκι', t_en:'Index the middle gears with the barrel',
   d:'Γύρνα το πετάλι και άλλαξε μία ταχύτητα προς τα μεγάλα γρανάζια. Αν η αλυσίδα διστάζει, ξεβίδωσε το βαρελάκι μισή στροφή (αυξάνει την τάση). Αν πηδά δύο γρανάζια, βίδωσέ το. Δούλευε με μισές στροφές.',
   d_en:'Turn the pedals and shift up one sprocket. If the chain hesitates, unscrew the barrel half a turn (more tension). If it jumps two sprockets, screw it in. Work in half turns.',
   tip:'Κανόνας: αργεί να ανέβει → ξεβίδωσε το βαρελάκι. Αργεί να κατέβει → βίδωσε το βαρελάκι.',
   tip_en:'Rule of thumb: slow to shift to a bigger sprocket → unscrew the barrel. Slow to come down → screw it in.'},
  {t:'Ρύθμισε τη βίδα L (χαμηλή)', t_en:'Set the L (low) screw',
   d:'Πέρνα στο μεγαλύτερο γρανάζι — προσεκτικά, με το χέρι σπρώχνοντας το ντεραγιέρ. Η βίδα L πρέπει να το σταματά ακριβώς κάτω από το μεγάλο γρανάζι, ώστε η αλυσίδα να μη μπορεί να πέσει ανάμεσα στο γρανάζι και τις ακτίνες.',
   d_en:'Shift to the largest sprocket — carefully, pushing the derailleur by hand. The L screw must stop it directly under the big sprocket, so the chain can never drop between the sprocket and the spokes.',
   warn:'Λάθος ρύθμιση L σημαίνει αλυσίδα μέσα στις ακτίνες: καταστρέφεται ο τροχός, το ντεραγιέρ και συχνά ο σκελετός.',
   warn_en:'A wrong L setting means the chain into the spokes: it destroys the wheel, the derailleur and often the frame.'},
  {t:'Ρύθμισε τη βίδα B (γωνία σώματος)', t_en:'Set the B screw (body angle)',
   d:'Με την αλυσίδα στο μεγαλύτερο γρανάζι, η απόσταση ανάμεσα στο πάνω ραουλάκι και το γρανάζι πρέπει να είναι 5–6 mm. Βίδωσε τη βίδα B για να την αυξήσεις.',
   d_en:'With the chain on the largest sprocket, the gap between the upper jockey wheel and the sprocket should be 5–6 mm. Turn the B screw in to increase it.'},
  {t:'Δοκίμασε όλες τις ταχύτητες', t_en:'Run through every gear',
   d:'Πέρνα όλο το φάσμα πάνω-κάτω, δύο φορές, γυρίζοντας το πετάλι. Κάθε αλλαγή πρέπει να γίνεται μέσα σε μία περιστροφή, χωρίς θόρυβο.',
   d_en:'Shift through the whole range up and down twice while pedalling. Each change should complete within one crank revolution, with no noise.'}],
 tips:['Οι νέες ντίζες «κάθονται» μετά τα πρώτα χιλιόμετρα και οι ταχύτητες χαλαρώνουν. Μια μισή στροφή στο βαρελάκι μετά τη δεύτερη βόλτα διορθώνει τα πάντα.',
       'Μην πηγαίνεις μεγάλο-μπροστά με μεγάλο-πίσω (ή μικρό με μικρό). Η αλυσίδα λοξεύει, τρίβει και φθείρεται γρήγορα.',
       'Αν χρειάζεται συνέχεια ρύθμιση, το πρόβλημα είναι η ντίζα, το σπιράλ ή το πατάκι — όχι το βαρελάκι.'],
 tips_en:['New cables bed in over the first few kilometres and the indexing goes loose. Half a turn of the barrel after the second ride fixes everything.',
          'Avoid big-big and small-small combinations. The chain runs at an angle, rubs and wears fast.',
          'If it needs adjusting constantly, the problem is the cable, the outer or the hanger — not the barrel.'],
 errs:['Ρύθμιση των H/L αντί για το βαρελάκι όταν το πρόβλημα είναι στις ενδιάμεσες.',
       'Παράβλεψη στραβού πατακιού.',
       'Πολύ χαλαρή L που ρίχνει την αλυσίδα στις ακτίνες.',
       'Ρύθμιση με βρώμικη ή φθαρμένη αλυσίδα.'],
 errs_en:['Fiddling with H/L when the problem is in the middle of the range and belongs to the barrel.',
          'Ignoring a bent hanger.',
          'Too loose an L limit, dropping the chain into the spokes.',
          'Adjusting with a dirty or worn chain.'],
 faq:[{q:'Έκανα τα πάντα και ακόμη πηδά. Τι μένει;', q_en:'I did everything and it still skips. What is left?',
       a:'Φθαρμένη αλυσίδα ή/και κασέτα. Μέτρησε τη φθορά της αλυσίδας με μετρητή (ή με χάρακα: 12 κρίκοι πρέπει να είναι 304,8 mm· πάνω από 306 mm σημαίνει αντικατάσταση). Αν άφησες την αλυσίδα να φθαρεί πολύ, θα χρειαστεί και νέα κασέτα.',
       a_en:'A worn chain and/or cassette. Measure chain wear with a gauge (or a ruler: 12 links should be 304.8 mm; over 306 mm means replace). If you let the chain wear far, the cassette will need replacing too.'}],
 vq:'ρύθμιση ταχυτήτων ποδηλάτου ντεραγιέρ', vq_en:'how to adjust rear derailleur indexing',

{
 id:'bike-chain', cat:'bike', ico:'🔗', diff:1, risk:false,
 n:'Καθαρισμός και λίπανση αλυσίδας', n_en:'Cleaning and lubricating the chain',
 d:'Δεκαπέντε λεπτά κάθε μήνα που τριπλασιάζουν τη ζωή της μετάδοσης και κάνουν το ποδήλατο αθόρυβο.',
 d_en:'Fifteen minutes a month that triples drivetrain life and makes the bike silent.',
 time:'20 λεπτά', time_en:'20 minutes', cost:'8–20 €', cost_en:'€8–20', ppl:'1', ppl_en:'1',
 safety:['Γάντια — τα λάδια αλυσίδας δεν φεύγουν εύκολα από το δέρμα.',
         'Κράτα τα δάχτυλα μακριά από το σημείο όπου η αλυσίδα μπαίνει στα γρανάζια.'],
 safety_en:['Gloves — chain lube does not wash off skin easily.',
            'Keep fingers clear of where the chain runs onto the sprockets.'],
 tools:['Βούρτσα αλυσίδας ή παλιά οδοντόβουρτσα','Πανιά χωρίς χνούδι','Βάση συνεργείου ή σχοινί','Μετρητής φθοράς αλυσίδας'],
 tools_en:['Chain brush or old toothbrush','Lint-free rags','Work stand or rope','Chain wear gauge'],
 mats:['Καθαριστικό αλυσίδας (ή πετρέλαιο/λευκό οινόπνευμα)','Λάδι αλυσίδας: υγρών ή ξηρών συνθηκών','Απορρυπαντικό πιάτων','Ζεστό νερό'],
 mats_en:['Chain degreaser (or paraffin/white spirit)','Chain lube: wet or dry conditions','Dish soap','Warm water'],
 steps:[
  {t:'Στήριξε το ποδήλατο', t_en:'Support the bike',
   d:'Σε βάση ή κρεμασμένο από τη σέλα, ώστε ο πίσω τροχός να γυρίζει ελεύθερα.',
   d_en:'On a stand or hung by the saddle so the rear wheel spins freely.'},
  {t:'Σκούπισε τη χοντρή βρωμιά', t_en:'Wipe the heavy dirt off',
   d:'Κράτα ένα πανί γύρω από την αλυσίδα και γύρνα το πετάλι ανάποδα 20–30 φορές. Θα φύγει το 60% της βρωμιάς πριν καν βάλεις καθαριστικό.',
   d_en:'Hold a rag around the chain and backpedal 20–30 times. That removes 60% of the dirt before any degreaser goes on.'},
  {t:'Βούρτσισε με καθαριστικό', t_en:'Brush with degreaser',
   d:'Ψέκασε ή βούτα τη βούρτσα σε καθαριστικό και δούλεψε την αλυσίδα από όλες τις πλευρές, γυρίζοντας συνεχώς το πετάλι. Καθάρισε και τα ραουλάκια του ντεραγιέρ — μαζεύουν μαύρη λάσπη.',
   d_en:'Spray or dip the brush in degreaser and work the chain from every side while backpedalling. Clean the derailleur jockey wheels too — they collect black sludge.',
   warn:'Μην ψεκάσεις καθαριστικό στα ρουλεμάν του κέντρου ή στα δισκόφρενα. Ψέκασε πάνω στη βούρτσα, όχι στο ποδήλατο.',
   warn_en:'Do not spray degreaser into hub bearings or onto disc brakes. Spray onto the brush, not onto the bike.'},
  {t:'Ξέπλυνε και στέγνωσε τελείως', t_en:'Rinse and dry completely',
   d:'Λίγο ζεστό νερό με απορρυπαντικό, ξέβγαλμα, και μετά σκούπισμα με στεγνό πανί. Άφησε 15–20 λεπτά. Λάδι πάνω σε νερό δεν κολλά και η αλυσίδα σκουριάζει από μέσα.',
   d_en:'A little warm soapy water, rinse, then wipe with a dry rag. Leave it 15–20 minutes. Lube on top of water does not stick and the chain rusts from inside.'},
  {t:'Λάδωσε έναν κρίκο τη φορά', t_en:'Lube one link at a time',
   d:'Μία σταγόνα σε κάθε κρίκο, στο σημείο όπου το ρολάκι συναντά την πλάκα. Γύρνα αργά το πετάλι και μέτρα τους κρίκους ώστε να κάνεις έναν πλήρη κύκλο.',
   d_en:'One drop per link, where the roller meets the plate. Backpedal slowly and count links so you complete exactly one full circuit.'},
  {t:'Άφησε 10 λεπτά και σκούπισε', t_en:'Wait 10 minutes and wipe',
   d:'Το λάδι πρέπει να μπει ΜΕΣΑ στους κρίκους, όχι να μείνει απ’ έξω. Μετά τα 10 λεπτά, σκούπισε καλά όλη την εξωτερική επιφάνεια με στεγνό πανί.',
   d_en:'The lube must get INSIDE the links, not sit on the outside. After 10 minutes wipe all the outer surfaces thoroughly with a dry rag.',
   tip:'Λιπαρή, γυαλιστερή αλυσίδα απ’ έξω = μαγνήτης σκόνης. Μια σωστά λαδωμένη αλυσίδα φαίνεται σχεδόν στεγνή.',
   tip_en:'A shiny, oily chain on the outside is a dust magnet. A properly lubed chain looks almost dry.'},
  {t:'Μέτρα τη φθορά', t_en:'Measure the wear',
   d:'Με μετρητή ή χάρακα: 12 κρίκοι = 304,8 mm σε καινούρια αλυσίδα. Στα 305,5 mm άλλαξε αλυσίδα. Πάνω από 306,5 mm θα χρειαστεί και κασέτα.',
   d_en:'With a gauge or a ruler: 12 links = 304.8 mm when new. At 305.5 mm replace the chain. Beyond 306.5 mm the cassette will need replacing too.'}],
 tips:['Λάδι υγρών συνθηκών: κολλάει καλά, αντέχει στη βροχή, μαζεύει σκόνη. Λάδι ξηρών: καθαρό, ιδανικό για καλοκαίρι και άσφαλτο, ξεπλένεται με τη βροχή.',
       'Καθάρισε μετά από κάθε βροχερή βόλτα ή κάθε 200–300 km σε στεγνό καιρό.',
       'ΠΟΤΕ WD-40 ως λάδι αλυσίδας. Είναι διεισδυτικό/καθαριστικό: αφαιρεί τη λίπανση αντί να τη δίνει. Ως καθαριστικό δουλεύει, αλλά μετά πρέπει να λαδώσεις κανονικά.',
       'Μια αλυσίδα των 20 € που αλλάζεις στην ώρα της γλιτώνει μια κασέτα των 50 € και έναν δισκόβραχο των 60 €.'],
 tips_en:['Wet lube: sticks well, survives rain, attracts dust. Dry lube: clean, ideal for summer tarmac, washes off in rain.',
          'Clean after every wet ride or every 200–300 km in dry weather.',
          'NEVER use WD-40 as chain lube. It is a penetrant/cleaner: it strips lubrication rather than providing it. It works as a cleaner, but you must lube properly afterwards.',
          'A €20 chain replaced on time saves a €50 cassette and a €60 chainring.'],
 errs:['Λάδωμα πάνω σε βρώμικη αλυσίδα — φτιάχνεις λειαντική πάστα που τρώει τα γρανάζια.',
       'Πολύ λάδι που δεν σκουπίζεται.',
       'WD-40 ως λιπαντικό.',
       'Καθαριστικό ψεκασμένο μέσα στα ρουλεμάν του κέντρου.'],
 errs_en:['Lubing over a dirty chain — you make a grinding paste that eats the sprockets.',
          'Too much lube left unwiped.',
          'WD-40 used as a lubricant.',
          'Degreaser sprayed into the hub bearings.'],
 faq:[{q:'Κάθε πότε λαδώνω;', q_en:'How often should I lube?',
       a:'Όταν η αλυσίδα αρχίζει να «τρίζει» ή δείχνει στεγνή. Πρακτικά: κάθε 150–300 km σε στεγνό καιρό, μετά από κάθε βροχή, και πάντα μετά από πλύσιμο του ποδηλάτου.',
       a_en:'When the chain starts to squeak or looks dry. In practice: every 150–300 km in dry weather, after every wet ride, and always after washing the bike.'}],
 vq:'καθαρισμός λίπανση αλυσίδας ποδηλάτου', vq_en:'how to clean and lube a bike chain properly'
},

{

 tools:['Γρύλος του αυτοκινήτου','Μπουλονόκλειδο (σταυρός ή κλειδί ρεζέρβας)','Τρίγωνο','Γιλέκο','Φακός','Γάντια','Μανόμετρο πίεσης'],
 tools_en:['The car’s jack','Wheel brace or cross wrench','Warning triangle','Hi-vis vest','Torch','Gloves','Tyre pressure gauge'],

   d:'Κάθε αυτοκίνητο έχει ενισχυμένα σημεία στο μαρσπιέ, συνήθως με εγκοπή ή σημάδι, λίγο πίσω από τον μπροστινό τροχό και λίγο μπροστά από τον πίσω. Δες το βιβλίο του αυτοκινήτου.',
   d_en:'Every car has reinforced jacking points on the sill, usually with a notch or mark, just behind the front wheel and just ahead of the rear. Check the owner’s manual.',
   warn:'Γρύλος σε λάθος σημείο στραβώνει το μαρσπιέ ή τρυπά το πάτωμα — και μπορεί να γλιστρήσει.',
   warn_en:'A jack in the wrong place bends the sill or punches through the floor — and can slip.'},
  {t:'Σήκωσε το αυτοκίνητο', t_en:'Raise the car',
   d:'Ανέβασε αργά μέχρι ο τροχός να ξεκολλήσει 3–5 cm από το έδαφος. Όχι ψηλότερα — όσο ψηλότερα, τόσο πιο ασταθές.',
   d_en:'Raise slowly until the wheel is 3–5 cm clear of the ground. No higher — the higher it goes, the less stable it is.'},
  {t:'Βγάλε τα μπουλόνια και τον τροχό', t_en:'Remove the nuts and the wheel',
   d:'Ξεβίδωσε τελείως, κρατώντας τα μπουλόνια μαζεμένα σε ένα σημείο (μέσα στο τάσι είναι ιδανικό). Τράβα τον τροχό ίσια προς τα σένα, με λυγισμένα γόνατα.',
   d_en:'Undo them fully, keeping all the nuts together in one place (inside the trim is ideal). Pull the wheel straight towards you, lifting with bent knees.'},
  {t:'Τοποθέτησε τη ρεζέρβα', t_en:'Fit the spare',
   d:'Σήκωσε τη ρεζέρβα και ευθυγράμμισε τις τρύπες. Βίδωσε τα μπουλόνια με το χέρι όσο πάνε, σταυρωτά. Ο τροχός πρέπει να κάθεται πρόσωπο στο μουαγιέ.',
   d_en:'Lift the spare and line up the holes. Thread all the nuts by hand as far as they go, in a star pattern. The wheel must seat flush against the hub.'},
  {t:'Κατέβασε και σφίξε σταυρωτά', t_en:'Lower and torque in a star pattern',
   d:'Κατέβασε μέχρι ο τροχός να ακουμπά ελαφρά, σφίξε σταυρωτά (1-3-5-2-4), κατέβασε τελείως και σφίξε ξανά σταυρωτά με δύναμη. Ποτέ κυκλικά, γιατί ο τροχός δεν κάθεται ίσια.',
   d_en:'Lower until the wheel just touches, tighten in a star pattern (1-3-5-2-4), lower fully and torque again in the same order. Never go round in a circle — the wheel will not seat square.'},
  {t:'Έλεγξε την πίεση', t_en:'Check the pressure',
   d:'Οι ρεζέρβες χάνουν αέρα στο πορτ-μπαγκάζ επί χρόνια. Οι μικρές ρεζέρβες θέλουν συχνά 4,2 bar. Πήγαινε στο πρώτο πρατήριο και έλεγξέ την.',
   d_en:'Spares lose pressure sitting in the boot for years. Space-saver spares often need 4.2 bar. Go to the first filling station and check it.'},
  {t:'Ξανασφίξε μετά από 50 km', t_en:'Re-torque after 50 km',
   d:'Ο τροχός «κάθεται» με τα πρώτα χιλιόμετρα. Σταμάτα και ξανασφίξε σταυρωτά. Πήγαινε το σκασμένο για επισκευή ή αντικατάσταση το συντομότερο.',
   d_en:'The wheel settles over the first kilometres. Stop and re-torque in the star pattern. Get the punctured tyre repaired or replaced as soon as you can.'}],
 tips:['Οι μικρές ρεζέρβες («ντόνατ») έχουν όριο 80 km/h και συνήθως 80 km συνολικά. Δεν είναι λάστιχο, είναι μεταφορικό μέσο μέχρι το συνεργείο.',
       'Έλεγξε την πίεση της ρεζέρβας μία φορά τον χρόνο, μαζί με τα υπόλοιπα λάστιχα.',
       'Αν έχεις αντικλεπτικά μπουλόνια, βεβαιώσου ότι το ειδικό κλειδί βρίσκεται μέσα στο αυτοκίνητο — όχι στο σπίτι.',
       'Ένα μικρό ζευγάρι γάντια και μια σανίδα για τον γρύλο σε μαλακό έδαφος πιάνουν ελάχιστο χώρο και σε σώζουν.'],
 tips_en:['Space-saver spares are limited to 80 km/h and usually about 80 km in total. It is not a tyre, it is a lift to the garage.',
          'Check the spare’s pressure once a year along with the other tyres.',
          'If you have locking wheel nuts, make sure the key lives in the car — not at home.',
          'A pair of gloves and a board to spread the jack on soft ground take almost no space and save the day.'],
 errs:['Χαλάρωμα μπουλονιών με τον τροχό στον αέρα.',
       'Γρύλος σε λάθος σημείο ή σε μαλακό έδαφος.',
       'Σφίξιμο κυκλικά αντί για σταυρωτά.',
       'Παραμονή επιβατών μέσα στο αυτοκίνητο ενώ είναι σηκωμένο.',
       'Οδήγηση με ρεζέρβα-ντόνατ σαν να είναι κανονικό λάστιχο.'],
 errs_en:['Loosening the nuts with the wheel off the ground.',
          'Jacking at the wrong point or on soft ground.',
          'Tightening in a circle instead of a star pattern.',
          'Leaving passengers in the car while it is jacked up.',
          'Driving on a space-saver as if it were a normal tyre.'],
 faq:[{q:'Δεν έχω ρεζέρβα, μόνο κιτ επισκευής. Τι κάνω;', q_en:'I have no spare, only a repair kit. What now?',
       a:'Το κιτ (αφρός + μίνι κομπρεσέρ) δουλεύει μόνο σε μικρές τρύπες στο πέλμα, όχι σε σκισμένο πλαϊνό ή σε λάστιχο που ξεζάντωσε. Βρες το καρφί, άφησέ το στη θέση του, ακολούθησε τις οδηγίες του κιτ και οδήγησε αργά ως το πλησιέστερο βουλκανιζατέρ. Ενημέρωσέ τους ότι έβαλες αφρό.',
       a_en:'The kit (sealant plus a mini compressor) only works on small tread punctures, not a torn sidewall or a tyre off the rim. Find the nail, leave it in place, follow the kit instructions and drive slowly to the nearest tyre shop. Tell them you used sealant.'}],

{

 steps:[

  {t:'Καθάρισε το τζάμι', t_en:'Clean the glass',

  {t:'Τοποθέτησε το νέο', t_en:'Fit the new blade',

 tips_en:['Replace them every 12 months, or as soon as they streak and chatter.',

 faq:[{q:'Οι νέοι υαλοκαθαριστήρες αφήνουν γραμμές. Γιατί;', q_en:'The new blades still streak. Why?',

       a_en:'It is almost always the glass, not the blades: a thin film of grease or car-wash wax. Clean it with a proper glass cleaner or a water-vinegar mix and, if needed, a clay bar.'}],

{
 id:'car-battery', cat:'car', ico:'🔋', diff:2, risk:true,
 n:'Αλλαγή μπαταρίας αυτοκινήτου', n_en:'Replacing a car battery',
 d:'Η σειρά αποσύνδεσης και σύνδεσης δεν είναι λεπτομέρεια — είναι το μόνο που σε χωρίζει από ένα βραχυκύκλωμα.',
 d_en:'The order of disconnection and connection is not a detail — it is the only thing between you and a short circuit.',
 time:'30 λεπτά', time_en:'30 minutes', cost:'70–180 €', cost_en:'€70–180', ppl:'1', ppl_en:'1',
 pro:'Πολλά σύγχρονα αυτοκίνητα (ειδικά με σύστημα start-stop και μπαταρίες AGM/EFB) απαιτούν «καταχώρηση» της νέας μπαταρίας στον εγκέφαλο με διαγνωστικό. Χωρίς αυτήν, ο φορτιστής φορτίζει λάθος και η νέα μπαταρία τελειώνει σε 1–2 χρόνια. Ρώτα πριν αγοράσεις.',
 pro_en:'Many modern cars (especially with start-stop and AGM/EFB batteries) require the new battery to be registered to the ECU with a diagnostic tool. Without it the charging profile is wrong and the new battery dies in 1–2 years. Ask before you buy.',
 safety:['Καμία φλόγα, κανένα τσιγάρο, κανένας σπινθήρας: οι μπαταρίες μολύβδου εκλύουν υδρογόνο που είναι εκρηκτικό.',
         'Γυαλιά και γάντια. Το ηλεκτρολυτικό υγρό είναι θειικό οξύ και καίει δέρμα, ρούχα και μάτια.',
         'Βγάλε δαχτυλίδια, ρολόι και μεταλλικά βραχιόλια. Ένα δαχτυλίδι που γεφυρώνει πόλο με αμάξωμα πυρακτώνεται μέσα σε δευτερόλεπτα.',
         'Ποτέ μην ακουμπήσεις κλειδί ή εργαλείο ταυτόχρονα στον θετικό πόλο και σε οτιδήποτε μεταλλικό του αμαξώματος.'],
 safety_en:['No flames, no cigarettes, no sparks: lead-acid batteries give off explosive hydrogen.',
            'Goggles and gloves. The electrolyte is sulphuric acid and burns skin, clothing and eyes.',
            'Remove rings, watch and metal bracelets. A ring bridging the positive post to the body glows red hot in seconds.',
            'Never let a tool touch the positive post and any metal bodywork at the same time.'],
 tools:['Γερμανικά κλειδιά 10 και 13 mm','Καστάνια με προέκταση','Συρματόβουρτσα πόλων','Γάντια και γυαλιά','Φακός'],
 tools_en:['10 and 13 mm spanners','Ratchet with an extension','Terminal wire brush','Gloves and goggles','Torch'],
 mats:['Νέα μπαταρία ίδιων προδιαγραφών (Ah, CCA, τύπος, θέση πόλων)','Σπρέι προστασίας πόλων ή βαζελίνη','Πανιά'],
 mats_en:['New battery to the same spec (Ah, CCA, type, terminal layout)','Terminal protection spray or petroleum jelly','Rags'],
 steps:[
  {t:'Αγόρασε τη σωστή μπαταρία', t_en:'Buy the right battery',
   d:'Σημείωσε από την παλιά: χωρητικότητα (Ah), ρεύμα εκκίνησης (CCA/A), διαστάσεις, τύπο (κοινή, EFB, AGM) και σε ποια πλευρά είναι ο θετικός πόλος. Ίδιο ή καλύτερο, ποτέ μικρότερο.',
   d_en:'Note from the old one: capacity (Ah), cold cranking amps (CCA/A), dimensions, type (standard, EFB, AGM) and which side the positive post is on. Same or better, never smaller.',
   warn:'Αν το αυτοκίνητο έχει start-stop, χρειάζεται AGM ή EFB. Κοινή μπαταρία θα καταστραφεί σε λίγους μήνες.',
   warn_en:'If the car has start-stop it needs AGM or EFB. A standard battery will be destroyed within months.'},
  {t:'Προετοιμάσου πριν κόψεις το ρεύμα', t_en:'Prepare before you cut power',
   d:'Σημείωσε τον κωδικό του ραδιοφώνου αν χρειάζεται, κατέβασε τα παράθυρα (σε κάποια μοντέλα δεν ανοίγουν χωρίς ρεύμα) και σβήσε τον κινητήρα και όλα τα φώτα. Κλείσε τις πόρτες.',
   d_en:'Note the radio code if needed, lower the windows (on some cars they will not open without power) and switch off the engine and all lights. Close the doors.'},
  {t:'ΑΠΟΣΥΝΔΕΣΗ: πρώτα ο ΑΡΝΗΤΙΚΟΣ', t_en:'DISCONNECT: NEGATIVE first',
   d:'Χαλάρωσε το παξιμάδι του αρνητικού πόλου (−, μαύρο) και τράβα το καλώδιο στην άκρη, εκεί που δεν μπορεί να ξαναακουμπήσει. Μόνο μετά πέρνα στον θετικό (+, κόκκινο).',
   d_en:'Loosen the negative terminal nut (−, black) and move the cable aside where it cannot spring back. Only then move to the positive (+, red).',
   tip:'Λογική: με τον αρνητικό αποσυνδεδεμένο, το αμάξωμα δεν έχει πια συνέχεια με την μπαταρία. Έτσι, αν το κλειδί σου ακουμπήσει τη λαμαρίνα ενώ δουλεύεις στον θετικό, δεν συμβαίνει τίποτα.',
   tip_en:'The logic: with the negative off, the bodywork is no longer connected to the battery. So if your spanner touches metal while you work on the positive, nothing happens.'},
  {t:'Λύσε τη στήριξη και βγάλε την μπαταρία', t_en:'Undo the clamp and lift it out',

   d_en:'Undo the hold-down clamp at the base or the top bar. Lift the battery out keeping it UPRIGHT — it weighs 15–25 kg, so lift with your knees.'},
  {t:'Καθάρισε τη βάση και τους ακροδέκτες', t_en:'Clean the tray and clamps',
   d:'Βούρτσισε τους ακροδέκτες μέχρι να γυαλίσουν και καθάρισε τη λευκή/πράσινη σκόνη οξείδωσης με νερό και μαγειρική σόδα. Στέγνωσε καλά.',
   d_en:'Brush the clamps until they are bright and clean off the white/green corrosion with water and baking soda. Dry thoroughly.'},
  {t:'Τοποθέτησε τη νέα με τους πόλους στη σωστή πλευρά', t_en:'Fit the new one with the posts on the right side',
   d:'Κάτσε την μπαταρία στη βάση με τον θετικό πόλο στην ίδια πλευρά με πριν, και σφίξε τη στήριξη. Πρέπει να είναι απόλυτα ακίνητη — οι κραδασμοί καταστρέφουν τις πλάκες.',
   d_en:'Seat it on the tray with the positive post on the same side as before and tighten the hold-down. It must not move at all — vibration destroys the plates.'},
  {t:'ΣΥΝΔΕΣΗ: πρώτα ο ΘΕΤΙΚΟΣ', t_en:'CONNECT: POSITIVE first',
   d:'Ακριβώς αντίστροφη σειρά: πρώτα ο θετικός (+), σφιχτά, μετά ο αρνητικός (−). Στην τελευταία σύνδεση θα δεις έναν μικρό σπινθήρα — είναι φυσιολογικό.',
   d_en:'Exactly the reverse: positive (+) first and tight, then negative (−). On the last connection you will see a small spark — that is normal.'},
  {t:'Προστάτεψε τους πόλους', t_en:'Protect the terminals',

   d_en:'Take it back to the shop — you usually get money back. It is hazardous waste and must not be thrown away anywhere else.'}],
 tips:['Μνημονικό: αποσύνδεση ΑΡΝΗΤΙΚΟΣ πρώτα, σύνδεση ΘΕΤΙΚΟΣ πρώτα. «Βγαίνει το μαύρο πρώτο, μπαίνει το κόκκινο πρώτο».',
       'Αν το αυτοκίνητο ξεκινά «βαριά» τα πρωινά του χειμώνα, η μπαταρία είναι συνήθως στο τέλος της. Μέση ζωή: 4–6 χρόνια.',
       'Οι σύντομες διαδρομές δεν φορτίζουν την μπαταρία. Αν κάνεις μόνο 5 χιλιόμετρα τη φορά, μια συντήρηση με φορτιστή κάθε μήνα τη σώζει.',
       'Πριν αγοράσεις νέα, έλεγξε πρώτα το δυναμό: αν φταίει αυτό, θα καταστρέψει και τη νέα μπαταρία.'],
 tips_en:['Mnemonic: disconnect NEGATIVE first, connect POSITIVE first. “Black off first, red on first.”',

 errs:['Αποσύνδεση του θετικού πρώτα — ένα κλειδί που ακουμπά τη λαμαρίνα προκαλεί βραχυκύκλωμα με τεράστιο ρεύμα.',

 faq:[{q:'Θα χάσω ρυθμίσεις του αυτοκινήτου;', q_en:'Will I lose the car’s settings?',

{

 steps:[

 errs_en:['Fitting it backwards (wrong arrow direction).',
          'Snapped clips from rushing in cold weather.',
          'Cleaning and refitting the old filter — it cannot be cleaned, only replaced.'],
 faq:[{q:'Το φίλτρο καμπίνας είναι το ίδιο με το φίλτρο αέρα κινητήρα;', q_en:'Is the cabin filter the same as the engine air filter?',

  {t:'Κατέβασε το εργαλείο της Microsoft', t_en:'Download the Microsoft tool',
   d:'Από τη σελίδα λήψης λογισμικού της Microsoft, κατέβασε το Media Creation Tool για την έκδοση που θέλεις. Χρησιμοποίησε πάντα την επίσημη πηγή — τα «ISO» από τυχαία sites περιέχουν συχνά κακόβουλο λογισμικό.',
   d_en:'From Microsoft’s official software download page, get the Media Creation Tool for the version you want. Always use the official source — “ISOs” from random sites often carry malware.'},
  {t:'Φτιάξε το USB εγκατάστασης', t_en:'Create the installation USB',
   d:'Τρέξε το εργαλείο, επίλεξε «Create installation media», γλώσσα και έκδοση, και μετά «USB flash drive». Θα κατεβάσει και θα γράψει τα αρχεία — 20–40 λεπτά. Το USB διαγράφεται εντελώς.',
   d_en:'Run the tool, choose “Create installation media”, pick language and edition, then “USB flash drive”. It downloads and writes the files — 20–40 minutes. The stick is completely erased.'},
  {t:'Κατέβασε τους οδηγούς εκ των προτέρων', t_en:'Download drivers in advance',
   d:'Από τον ιστότοπο του κατασκευαστή (Dell, HP, Lenovo, ASUS…) με βάση το ακριβές μοντέλο, κατέβασε τουλάχιστον: chipset, δίκτυο/Wi-Fi, κάρτα γραφικών, ήχο. Βάλ’ τους σε δεύτερο USB.',
   d_en:'From the manufacturer’s site (Dell, HP, Lenovo, ASUS…) for your exact model, download at least: chipset, network/Wi-Fi, graphics and audio drivers. Put them on a second USB stick.',
   tip:'Αν μετά την εγκατάσταση δεν υπάρχει Wi-Fi, ο οδηγός δικτύου λείπει — γι’ αυτό τον κατεβάζεις ΠΡΙΝ.',
   tip_en:'If there is no Wi-Fi after the install, the network driver is missing — that is why you download it BEFOREHAND.'},
  {t:'Μπες στο μενού εκκίνησης', t_en:'Enter the boot menu',
   d:'Βάλε το USB, επανεκκίνησε και πάτα επαναλαμβανόμενα το πλήκτρο boot menu μόλις ανάψει η οθόνη: συνήθως F12, F9, F10, Esc ή Del ανάλογα με τον κατασκευαστή. Επίλεξε το USB — προτίμησε την επιλογή που ξεκινά με «UEFI:».',
   d_en:'Insert the stick, restart and repeatedly press the boot menu key as the screen lights up: usually F12, F9, F10, Esc or Del depending on the maker. Choose the USB — prefer the entry starting with “UEFI:”.'},
  {t:'Ξεκίνα την εγκατάσταση', t_en:'Start the installer',
   d:'Γλώσσα, ώρα, πληκτρολόγιο → «Επόμενο» → «Εγκατάσταση τώρα». Στην ερώτηση για κλειδί, μπορείς να επιλέξεις «Δεν έχω κλειδί προϊόντος» αν ο υπολογιστής είχε ήδη ενεργοποιημένα Windows — η άδεια είναι δεμένη με το μηχάνημα.',
   d_en:'Language, time, keyboard → Next → Install now. At the key prompt you can choose “I don’t have a product key” if the PC already had activated Windows — the licence is tied to the machine.'},
  {t:'Διάλεξε «Προσαρμοσμένη» εγκατάσταση', t_en:'Choose “Custom” install',
   d:'«Custom: Install Windows only». Η επιλογή «Upgrade» κρατά τα παλιά αρχεία και δεν είναι καθαρή εγκατάσταση.',
   d_en:'“Custom: Install Windows only”. The “Upgrade” option keeps the old files and is not a clean install.'},
  {t:'Διάγραψε τα σωστά διαμερίσματα', t_en:'Delete the right partitions',
   d:'Θα δεις λίστα διαμερισμάτων. Στον δίσκο όπου θα μπουν τα Windows (συνήθως Drive 0), διάγραψε ΟΛΑ τα διαμερίσματα ώστε να μείνει ένας ενιαίος «Unallocated Space». Μετά επίλεξέ τον και πάτα «Next» — τα Windows φτιάχνουν μόνα τους ό,τι χρειάζεται.',
   d_en:'You will see a partition list. On the disk where Windows will go (usually Drive 0), delete ALL partitions so that a single “Unallocated Space” remains. Then select it and click Next — Windows creates what it needs itself.',
   warn:'Έλεγξε ΔΥΟ φορές τον αριθμό του δίσκου και τα μεγέθη. Αν έχεις δεύτερο δίσκο με αρχεία, μην τον αγγίξεις — ή καλύτερα, αποσύνδεσέ τον φυσικά πριν ξεκινήσεις.',
   warn_en:'Check the disk number and the sizes TWICE. If you have a second disk with files, do not touch it — better still, physically disconnect it before you start.'},
  {t:'Περίμενε την αντιγραφή και τις επανεκκινήσεις', t_en:'Wait through the copy and reboots',
   d:'15–40 λεπτά, με 2–3 αυτόματες επανεκκινήσεις. Μόλις γίνει η πρώτη επανεκκίνηση, βγάλε το USB για να μην ξαναξεκινήσει η εγκατάσταση από την αρχή.',
   d_en:'15–40 minutes with 2–3 automatic reboots. After the first reboot, remove the USB so the installer does not start over.'},
  {t:'Πέρνα τις αρχικές ρυθμίσεις', t_en:'Go through the initial setup',
   d:'Περιοχή, πληκτρολόγιο (πρόσθεσε και ελληνικό), δίκτυο, λογαριασμός. Διάβασε προσεκτικά τις επιλογές ιδιωτικότητας και απενεργοποίησε ό,τι δεν χρειάζεσαι — είναι πιο εύκολο τώρα παρά μετά.',
   d_en:'Region, keyboard (add Greek too), network, account. Read the privacy options carefully and turn off what you do not need — it is easier now than later.'},
  {t:'Εγκατάστησε οδηγούς και ενημερώσεις', t_en:'Install drivers and updates',
   d:'Πρώτα chipset, μετά τα υπόλοιπα από το USB των οδηγών. Μετά Windows Update, ξανά και ξανά μέχρι να μην υπάρχει τίποτα — συχνά χρειάζονται 3–4 γύροι με επανεκκινήσεις.',
   d_en:'Chipset first, then the rest from your driver stick. Then Windows Update, repeatedly until nothing is left — it often takes 3–4 rounds with reboots.'},
  {t:'Έλεγξε ενεργοποίηση και επανάφερε τα αρχεία', t_en:'Check activation and restore your files',
   d:'Ρυθμίσεις → Σύστημα → Ενεργοποίηση: πρέπει να γράφει ότι τα Windows είναι ενεργοποιημένα. Μετά σύνδεσε τον δίσκο του αντιγράφου και επανάφερε τα αρχεία σου, ένα φάκελο τη φορά.',
   d_en:'Settings → System → Activation: it must say Windows is activated. Then connect the backup drive and restore your files, one folder at a time.'}],
 tips:['Τα Windows 11 απαιτούν TPM 2.0, Secure Boot και συμβατό επεξεργαστή. Έλεγξε με το εργαλείο PC Health Check πριν ξεκινήσεις.',
       'Η υποστήριξη των Windows 10 έληξε τον Οκτώβριο 2025 — δεν λαμβάνουν πλέον ενημερώσεις ασφαλείας.',
       'Αν ο υπολογιστής είναι αργός αλλά όχι προβληματικός, μια αναβάθμιση σε SSD κάνει συχνά μεγαλύτερη διαφορά από ένα format.',
       'Δεν χρειάζεσαι πια «κλειδί»: αν ο υπολογιστής είχε ενεργοποιημένα Windows, η ψηφιακή άδεια είναι δεμένη με τη μητρική και ενεργοποιείται μόνη της.',
       'Με το winget (ενσωματωμένο στα Windows) εγκαθιστάς δεκάδες προγράμματα με μία εντολή, χωρίς να κατεβάζεις installers ένα-ένα.'],
 tips_en:['Windows 11 requires TPM 2.0, Secure Boot and a supported CPU. Check with the PC Health Check tool before starting.',
          'Windows 10 support ended in October 2025 — it no longer receives security updates.',
          'If the computer is slow but not broken, an SSD upgrade often makes more difference than a reinstall.',
          'You usually do not need a key: if the PC had activated Windows, the digital licence is tied to the motherboard and reactivates itself.',
          'With winget (built into Windows) you can install dozens of programs with one command, without downloading installers one by one.'],
 errs:['Format χωρίς ελεγμένο αντίγραφο ασφαλείας.',
       'Διαγραφή διαμερισμάτων σε λάθος δίσκο.',
       'Εξωτερικός δίσκος συνδεδεμένος κατά την εγκατάσταση.',
       'ISO από μη επίσημη πηγή.',
       'Παράλειψη λήψης οδηγών εκ των προτέρων και μετά αδυναμία σύνδεσης στο ίντερνετ.'],
 errs_en:['Formatting without a verified backup.',
          'Deleting partitions on the wrong disk.',
          'Leaving the external drive connected during setup.',
          'An ISO from an unofficial source.',
          'Not downloading drivers in advance and then being unable to get online.'],
 faq:[{q:'Θα χάσω την άδεια των Windows;', q_en:'Will I lose my Windows licence?',
       a:'Όχι, αν ο υπολογιστής είχε ήδη ενεργοποιημένα Windows. Η ψηφιακή άδεια είναι καταχωρημένη στους διακομιστές της Microsoft και συνδεδεμένη με το υλικό. Σύνδεσε τον ίδιο λογαριασμό Microsoft και θα ενεργοποιηθεί αυτόματα.',
       a_en:'No, if the PC already had activated Windows. The digital licence is registered on Microsoft’s servers and tied to the hardware. Sign in with the same Microsoft account and it reactivates automatically.'},
      {q:'Το format λύνει τους ιούς;', q_en:'Does a clean install remove viruses?',
       a:'Μια καθαρή εγκατάσταση με διαγραφή όλων των διαμερισμάτων καθαρίζει σχεδόν κάθε κακόβουλο λογισμικό. Πρόσεξε όμως: μην επαναφέρεις εκτελέσιμα αρχεία (.exe) από το αντίγραφο — μόνο έγγραφα, φωτογραφίες και βίντεο.',
       a_en:'A clean install that deletes all partitions removes almost all malware. But be careful: do not restore executable files (.exe) from the backup — only documents, photos and videos.'}],
 vq:'format windows 11 καθαρή εγκατάσταση usb', vq_en:'clean install windows 11 from usb step by step',

{
 id:'pc-ssd', cat:'pc', ico:'⚡', diff:2, risk:false,
 n:'Αναβάθμιση σε SSD', n_en:'Upgrading to an SSD',
 d:'Η μοναδική αναβάθμιση που κάνει έναν δεκαετή υπολογιστή να δείχνει καινούριος. Εκκίνηση σε 10 δευτερόλεπτα αντί για 3 λεπτά.',
 d_en:'The one upgrade that makes a ten-year-old computer feel new. Boot in 10 seconds instead of 3 minutes.',
 time:'1 ώρα (+ κλωνοποίηση)', time_en:'1 hour (+ cloning)', cost:'35–120 €', cost_en:'€35–120', ppl:'1', ppl_en:'1',
 safety:['Βγάλε τον υπολογιστή από την πρίζα και κράτα πατημένο το κουμπί λειτουργίας 10 δευτερόλεπτα για να εκφορτιστεί.',
         'Σε φορητό, αφαίρεσε τη μπαταρία αν είναι αποσπώμενη.',
         'Στατικός ηλεκτρισμός: άγγιξε ένα μεταλλικό μέρος του κουτιού πριν πιάσεις εξαρτήματα.'],
 safety_en:['Unplug the computer and hold the power button for 10 seconds to discharge it.',
            'On a laptop, remove the battery if it is removable.',
            'Static: touch a bare metal part of the case before handling components.'],
 tools:['Σταυροκατσάβιδο μικρό','Πλαστικά εργαλεία ανοίγματος (φορητό)','Θήκη USB για τον παλιό δίσκο ή καλώδιο SATA-USB','Δοχείο για τις βίδες'],
 tools_en:['Small Phillips screwdriver','Plastic pry tools (laptop)','A USB enclosure for the old drive, or a SATA-USB cable','A pot for the screws'],
 mats:['SSD (SATA 2,5" ή NVMe M.2, ανάλογα με το τι δέχεται ο υπολογιστής)','Λογισμικό κλωνοποίησης (π.χ. Macrium Reflect, Clonezilla, ή του κατασκευαστή)','Βίδες στήριξης'],
 mats_en:['SSD (2.5" SATA or M.2 NVMe, depending on what the machine takes)','Cloning software (Macrium Reflect, Clonezilla, or the maker’s own)','Mounting screws'],
 steps:[
  {t:'Βρες τι δέχεται ο υπολογιστής σου', t_en:'Find out what your machine accepts',
   d:'Δύο βασικοί τύποι: SATA 2,5 ιντσών (ταιριάζει σε κάθε υπολογιστή με θέση σκληρού δίσκου) και M.2 NVMe (μικρή κάρτα, πολύ ταχύτερη, χρειάζεται υποδοχή M.2 στη μητρική). Δες τις προδιαγραφές του μοντέλου σου.',
   d_en:'Two main types: 2.5-inch SATA (fits any machine with a hard drive bay) and M.2 NVMe (a small card, far faster, needs an M.2 slot on the board). Check your model’s specification.',
   tip:'Αν το μηχάνημα είναι παλιό και δεν έχει M.2, ο SATA SSD θα δώσει και πάλι 5–10 φορές μεγαλύτερη ταχύτητα από τον μηχανικό σκληρό.',
   tip_en:'If the machine is old and has no M.2, a SATA SSD still gives 5–10 times the speed of a mechanical hard drive.'},
  {t:'Διάλεξε: κλωνοποίηση ή καθαρή εγκατάσταση', t_en:'Decide: clone or clean install',
   d:'Κλωνοποίηση = αντιγράφεις τα πάντα ως έχουν, τελειώνεις σε μία ώρα, αλλά μεταφέρεις και τα προβλήματα. Καθαρή εγκατάσταση = καθαρό σύστημα, χρειάζεται περισσότερος χρόνος. Αν ο υπολογιστής είναι ήδη αργός λόγω λογισμικού, προτίμησε καθαρή εγκατάσταση.',
   d_en:'Cloning copies everything as it is, done in an hour, but carries the problems across. A clean install gives a clean system but takes longer. If the machine is already slow because of software, choose the clean install.'},
  {t:'Κλωνοποίησε (αν το επέλεξες)', t_en:'Clone (if that is your choice)',
   d:'Σύνδεσε τον SSD με θήκη USB, τρέξε το λογισμικό κλωνοποίησης, επίλεξε πηγή τον παλιό δίσκο και προορισμό τον SSD. Αν ο SSD είναι μικρότερος, πρέπει πρώτα να μειώσεις τα δεδομένα κάτω από τη χωρητικότητά του.',
   d_en:'Connect the SSD via a USB enclosure, run the cloning software, choose the old drive as source and the SSD as destination. If the SSD is smaller, first reduce your data below its capacity.',
   warn:'Πρόσεξε ποιος δίσκος είναι πηγή και ποιος προορισμός. Αντίστροφα, διαγράφεις τα πάντα.',
   warn_en:'Double-check which disk is source and which is destination. The wrong way round erases everything.'},
  {t:'Άνοιξε τον υπολογιστή', t_en:'Open the computer',
   d:'Σταθερός: ξεβίδωσε το πλαϊνό καπάκι. Φορητός: ξεβίδωσε το κάτω κάλυμμα ή το ειδικό πορτάκι του δίσκου. Κράτα τις βίδες ταξινομημένες — έχουν διαφορετικά μήκη.',
   d_en:'Desktop: unscrew the side panel. Laptop: remove the bottom cover or the dedicated drive hatch. Keep the screws sorted — they come in different lengths.'},
  {t:'Τοποθέτησε τον SSD', t_en:'Fit the SSD',
   d:'SATA: βίδωσέ τον στη θέση του δίσκου (ίσως χρειαστείς προσαρμογέα 2,5"→3,5") και σύνδεσε καλώδιο δεδομένων SATA και τροφοδοσίας. M.2: γείρε την κάρτα 30°, σπρώξε την στην υποδοχή, πίεσε κάτω και βίδωσε τη μικρή βίδα.',
   d_en:'SATA: screw it into the drive bay (you may need a 2.5"→3.5" adapter) and connect the SATA data and power cables. M.2: insert the card at about 30°, push it into the slot, press it down and fit the small screw.'},
  {t:'Ρύθμισε τη σειρά εκκίνησης', t_en:'Set the boot order',
   d:'Άνοιξε τον υπολογιστή, μπες στο BIOS/UEFI (Del, F2 ή F10) και βάλε τον SSD πρώτο στη σειρά εκκίνησης. Αποθήκευσε και βγες.',
   d_en:'Power on, enter the BIOS/UEFI (Del, F2 or F10) and set the SSD first in the boot order. Save and exit.'},
  {t:'Επιβεβαίωσε ότι όλα δουλεύουν', t_en:'Confirm everything works',
   d:'Ξεκίνα και δες ότι τα Windows φορτώνουν από τον SSD. Άφησε τον παλιό δίσκο συνδεδεμένο και ανέγγιχτο για μερικές μέρες, μέχρι να βεβαιωθείς.',
   d_en:'Boot and confirm Windows loads from the SSD. Leave the old drive connected and untouched for a few days until you are sure.'},
  {t:'Ενεργοποίησε το TRIM και έλεγξε την υγεία', t_en:'Check TRIM and drive health',
   d:'Στα Windows 10/11 το TRIM είναι ενεργό από προεπιλογή. Μην κάνεις ποτέ ανασυγκρότηση (defrag) σε SSD. Το εργαλείο του κατασκευαστή δείχνει την υγεία και ενημερώνει το firmware.',
   d_en:'On Windows 10/11 TRIM is on by default. Never defragment an SSD. The manufacturer’s tool shows drive health and updates the firmware.'},
  {t:'Χρησιμοποίησε τον παλιό δίσκο ως αποθηκευτικό', t_en:'Reuse the old drive as storage',
   d:'Σε σταθερό, άφησέ τον μέσα ως δεύτερο δίσκο για αρχεία. Σε φορητό, βάλ’ τον σε θήκη USB και έχεις έναν εξωτερικό δίσκο για αντίγραφα.',
   d_en:'In a desktop, leave it in as a second drive for files. In a laptop, put it in a USB enclosure and you have an external backup drive.'}],
 tips:['500 GB είναι το λογικό ελάχιστο σήμερα· 1 TB αν κρατάς φωτογραφίες, βίντεο ή παιχνίδια.',

 faq:[{q:'Θα χρειαστεί να ξαναεγκαταστήσω τα Windows;', q_en:'Will I need to reinstall Windows?',

{

 time:'20 λεπτά', time_en:'20 minutes', cost:'25–90 €', cost_en:'€25–90', ppl:'1', ppl_en:'1',

 mats:['Μνήμες σωστού τύπου (DDR4/DDR5, DIMM για σταθερό, SO-DIMM για φορητό) και ταχύτητας'],

 steps:[
  {t:'Δες τι έχεις τώρα', t_en:'See what you have now',
   d:'Ctrl+Shift+Esc → Επιδόσεις → Μνήμη. Δείχνει πόση μνήμη έχεις, τον τύπο (DDR4/DDR5), την ταχύτητα και πόσες υποδοχές είναι κατειλημμένες. Σημείωσέ τα όλα.',

   d:'Κάθε μοντέλο έχει μέγιστη υποστηριζόμενη μνήμη και συγκεκριμένο τύπο. Ψάξε το ακριβές μοντέλο ή χρησιμοποίησε τα εργαλεία συμβατότητας των κατασκευαστών μνήμης.',
   d_en:'Every model has a maximum supported capacity and a specific type. Look up your exact model or use a memory maker’s compatibility tool.',

  {t:'Άνοιξε και βρες τις υποδοχές', t_en:'Open up and find the slots',
   d:'Σταθερός: πλαϊνό καπάκι, οι μνήμες είναι δίπλα στον επεξεργαστή. Φορητός: κάτω κάλυμμα ή ειδικό πορτάκι· οι SO-DIMM είναι ξαπλωμένες, συχνά η μία πάνω στην άλλη.',
   d_en:'Desktop: side panel off, the modules sit next to the CPU. Laptop: bottom cover or a dedicated hatch; SO-DIMMs lie flat, often stacked.'},
  {t:'Βγάλε τις παλιές (αν χρειάζεται)', t_en:'Remove the old ones (if needed)',

  {t:'Τοποθέτησε τις νέες στις σωστές υποδοχές', t_en:'Fit the new ones in the correct slots',
   d:'Για διπλό κανάλι (dual channel, ~10–20% γρηγορότερο), δύο ίδιες μνήμες μπαίνουν συνήθως στις υποδοχές 2 και 4 (ή στις υποδοχές του ίδιου χρώματος). Δες το εγχειρίδιο της μητρικής.',

   d:'Ευθυγράμμισε την εγκοπή με το προεξέχον σημείο της υποδοχής — μπαίνει μόνο με έναν τρόπο. Πίεσε σταθερά και στις δύο άκρες μέχρι να κλείσουν μόνα τους τα κλιπ. Χρειάζεται περισσότερη δύναμη απ’ όση περιμένεις.',
   d_en:'Line the notch up with the key in the slot — it only goes in one way. Press firmly at both ends until the clips snap closed by themselves. It takes more force than you expect.',

   d:'Βίδωσε το καπάκι, βάλε ρεύμα, άνοιξε. Έλεγξε στη Διαχείριση Εργασιών ότι φαίνεται η νέα συνολική μνήμη και ότι λειτουργεί σε διπλό κανάλι.',
   d_en:'Refit the cover, plug in and power up. Check in Task Manager that the new total shows and that it is running in dual channel.'},
  {t:'Έλεγξε τη σταθερότητα', t_en:'Test stability',
   d:'Τρέξε το Windows Memory Diagnostic ή το MemTest86 για έναν πλήρη κύκλο. Ελαττωματική μνήμη προκαλεί τυχαία κολλήματα και μπλε οθόνες που δύσκολα εντοπίζονται αλλιώς.',
   d_en:'Run Windows Memory Diagnostic or MemTest86 for one full pass. Faulty memory causes random freezes and blue screens that are hard to trace otherwise.'}],
 tips:['8 GB είναι το λογικό ελάχιστο για καθημερινή χρήση, 16 GB για άνεση με πολλές καρτέλες, 32 GB για επεξεργασία βίντεο ή εικονικές μηχανές.',

       'Αν ο υπολογιστής δεν ξεκινά μετά την αναβάθμιση, βγάλε και ξαναβάλε τις μνήμες πιέζοντας πιο δυνατά. Το 90% των «νεκρών» αναβαθμίσεων είναι μνήμη που δεν κάθισε.',
       'Περισσότερη RAM δεν κάνει τον υπολογιστή γρηγορότερο αν δεν την χρειάζεται. Δες πρώτα στη Διαχείριση Εργασιών αν η μνήμη είναι όντως στο όριο.'],
 tips_en:['8 GB is a sensible minimum for daily use, 16 GB for comfort with many tabs, 32 GB for video editing or virtual machines.',

       'Μνήμη που δεν κάθισε τελείως — ο υπολογιστής δεν ανάβει καθόλου.',
       'Χειρισμός από τα χρυσά δόντια χωρίς προστασία από στατικό.'],
 errs_en:['The wrong type (DDR4 in a DDR5 machine or vice versa).',

 faq:[{q:'Πόση RAM χρειάζομαι πραγματικά;', q_en:'How much RAM do I really need?',
       a:'Άνοιξε τη Διαχείριση Εργασιών και δούλεψε κανονικά για μια ώρα. Αν η μνήμη μένει σταθερά πάνω από 80%, η αναβάθμιση θα φανεί αμέσως. Αν κάθεται στο 50%, το πρόβλημα είναι αλλού — συνήθως ο μηχανικός σκληρός δίσκος.',
       a_en:'Open Task Manager and work normally for an hour. If memory stays consistently above 80%, an upgrade will show immediately. If it sits at 50%, the bottleneck is elsewhere — usually a mechanical hard drive.'}],

{
 id:'pc-clean', cat:'pc', ico:'🌡️', diff:2, risk:false,
 n:'Καθαρισμός υπολογιστή και θερμοαγώγιμη πάστα', n_en:'Cleaning the PC and renewing thermal paste',
 d:'Υπολογιστής που βουίζει, ζεσταίνεται και «κόβει» ταχύτητα. Μία φορά τον χρόνο, μισή ώρα δουλειάς.',
 d_en:'A computer that roars, runs hot and throttles. Once a year, half an hour of work.',
 time:'45 λεπτά', time_en:'45 minutes', cost:'8–20 €', cost_en:'€8–20', ppl:'1', ppl_en:'1',
 safety:['Εκτός πρίζας, κουμπί λειτουργίας 10 δευτερόλεπτα, μπαταρία έξω.',

 safety_en:['Unplugged, power button held 10 seconds, battery out.',
            'NEVER use a vacuum cleaner inside a computer: it generates static that destroys components.',

 tools:['Σταυροκατσάβιδα διαφόρων μεγεθών','Πεπιεσμένος αέρας σε σπρέι','Μαλακό πινέλο','Πανιά χωρίς χνούδι','Μπατονέτες','Δοχεία για βίδες'],
 tools_en:['Phillips screwdrivers in several sizes','Canned compressed air','Soft brush','Lint-free cloths','Cotton buds','Pots for screws'],
 mats:['Θερμοαγώγιμη πάστα','Ισοπροπυλική αλκοόλη 99%','Γάντια'],
 mats_en:['Thermal paste','99% isopropyl alcohol','Gloves'],
 steps:[
  {t:'Μέτρα τις θερμοκρασίες πριν', t_en:'Measure temperatures first',
   d:'Με ένα εργαλείο παρακολούθησης, σημείωσε τις θερμοκρασίες σε ηρεμία και σε φόρτο. Έτσι θα ξέρεις αν η δουλειά είχε αποτέλεσμα.',
   d_en:'With a monitoring tool, note idle and load temperatures. That way you will know whether the job actually helped.'},
  {t:'Άνοιξε και φωτογράφισε', t_en:'Open up and photograph',
   d:'Βγάλε το καπάκι και τράβα φωτογραφίες πριν αγγίξεις οτιδήποτε — πού πάει κάθε καλώδιο, πώς περνούν τα καλωδιάκια των ανεμιστήρων.',
   d_en:'Take the cover off and photograph everything before touching it — where each cable goes, how the fan leads are routed.'},
  {t:'Φύσα τη σκόνη προς τα έξω', t_en:'Blow the dust outwards',
   d:'Κοντές ριπές, από απόσταση 10 cm, πάντα με φορά προς τα έξω από το κουτί. Δώσε έμφαση στα πτερύγια της ψύκτρας, στο τροφοδοτικό και στα φίλτρα εισαγωγής. Ιδανικά, κάν’ το σε μπαλκόνι.',
   d_en:'Short bursts from about 10 cm, always directing dust out of the case. Concentrate on the heatsink fins, the power supply and the intake filters. Ideally do it on a balcony.'},
  {t:'Καθάρισε τους ανεμιστήρες', t_en:'Clean the fans',
   d:'Κράτα τα πτερύγια ακίνητα και σκούπισέ τα ένα-ένα με μπατονέτα ελαφρά βρεγμένη σε αλκοόλη. Η σκόνη στα πτερύγια είναι η κύρια αιτία του θορύβου.',
   d_en:'Hold the blades still and wipe them one by one with a cotton bud lightly dampened in alcohol. Dust on the blades is the main cause of the noise.'},
  {t:'Βγάλε την ψύκτρα του επεξεργαστή', t_en:'Remove the CPU cooler',
   d:'Ξεβίδωσε σταυρωτά και σταδιακά (λίγες στροφές κάθε βίδα με τη σειρά), αποσύνδεσε το καλωδιάκι του ανεμιστήρα, και στρίψε ελαφρά την ψύκτρα για να ξεκολλήσει από την παλιά πάστα. Μην τραβήξεις απότομα.',

   warn:'Αν τραβήξεις απότομα με κρύα, ξεραμένη πάστα, μπορεί να βγει ο επεξεργαστής μαζί με την ψύκτρα και να στραβώσουν τα pin. Ζέστανε τον υπολογιστή για 5 λεπτά πριν τον σβήσεις.',
   warn_en:'Yanking a cooler off dry, cold paste can pull the CPU out with it and bend the pins. Run the computer for 5 minutes before shutting down to soften the paste.'},
  {t:'Καθάρισε την παλιά πάστα', t_en:'Clean off the old paste',
   d:'Με πανί χωρίς χνούδι και ισοπροπυλική αλκοόλη, καθάρισε τελείως και τις δύο επιφάνειες — επεξεργαστή και βάση ψύκτρας — μέχρι να γυαλίζουν. Καμία υπολειμματική πάστα.',
   d_en:'With a lint-free cloth and isopropyl alcohol, clean both surfaces — CPU and cooler base — until they shine. No residue at all.'},
  {t:'Βάλε νέα πάστα', t_en:'Apply new paste',
   d:'Μία σταγόνα στο μέγεθος ενός μπιζελιού στο κέντρο του επεξεργαστή. Μην την απλώσεις: η πίεση της ψύκτρας τη μοιράζει ομοιόμορφα.',
   d_en:'A pea-sized blob in the centre of the CPU. Do not spread it: the cooler’s pressure distributes it evenly.',
   tip:'Πολλή πάστα είναι χειρότερη από λίγη. Η πάστα δεν είναι αγωγός θερμότητας — απλώς γεμίζει τα μικροσκοπικά κενά ανάμεσα στις δύο επιφάνειες.',
   tip_en:'Too much paste is worse than too little. Paste is not a good conductor — it merely fills the microscopic gaps between the two surfaces.'},
  {t:'Ξαναβάλε την ψύκτρα σταυρωτά', t_en:'Refit the cooler in a cross pattern',
   d:'Κάτσε την ίσια χωρίς να την σύρεις, και βίδωσε σταυρωτά και σταδιακά ώστε η πίεση να είναι ομοιόμορφη. Ξανασύνδεσε το καλωδιάκι του ανεμιστήρα — αυτό ξεχνιέται συχνά.',
   d_en:'Set it down squarely without sliding it, and tighten in a cross pattern gradually so the pressure is even. Reconnect the fan lead — this is often forgotten.'},
  {t:'Κλείσε και μέτρα ξανά', t_en:'Close up and measure again',
   d:'Βάλε μπρος και έλεγξε αμέσως ότι ο ανεμιστήρας του επεξεργαστή γυρίζει. Μέτρα ξανά θερμοκρασίες: η διαφορά είναι συχνά 10–25 °C.',
   d_en:'Power up and immediately confirm the CPU fan is spinning. Measure temperatures again: the difference is often 10–25 °C.'}],
 tips:['Καθαρισμός σκόνης: μία φορά τον χρόνο (κάθε 6 μήνες αν υπάρχουν κατοικίδια ή καπνιστές). Θερμοαγώγιμη πάστα: κάθε 3–5 χρόνια.',
       'Σε φορητό, η σκόνη μαζεύεται σαν «τσόχα» στην έξοδο της ψύκτρας. Συχνά χρειάζεται να την τραβήξεις με τσιμπιδάκι — ο αέρας μόνος του δεν αρκεί.',
       'Ανέβασε τον σταθερό 10 cm από το πάτωμα και μακριά από χαλί. Η μοκέτα είναι εργοστάσιο σκόνης.',
       'Αν ο ανεμιστήρας κάνει θόρυβο ακόμη και καθαρός, το ρουλεμάν του έχει φθαρεί και θέλει αντικατάσταση — κοστίζει λίγα ευρώ.'],
 tips_en:['Dust cleaning: once a year (every 6 months with pets or smokers). Thermal paste: every 3–5 years.',
          'In a laptop the dust builds into a felt mat at the heatsink exit. You often need tweezers to pull it out — air alone will not shift it.',
          'Raise a desktop 10 cm off the floor and away from carpet. Carpet is a dust factory.',
          'If a fan is noisy even when clean, its bearing is worn and it needs replacing — that costs a few euros.'],
 errs:['Ηλεκτρική σκούπα μέσα στον υπολογιστή.',
       'Ανεμιστήρες που γυρίζουν ελεύθερα με πεπιεσμένο αέρα.',
       'Υπερβολική ποσότητα πάστας που ξεχειλίζει στη μητρική.',
       'Ξεχασμένο καλωδιάκι ανεμιστήρα επεξεργαστή — ο υπολογιστής σβήνει σε λίγα λεπτά.'],
 errs_en:['A vacuum cleaner inside the computer.',
          'Letting fans spin freely under compressed air.',
          'Far too much paste, oozing onto the board.',
          'A forgotten CPU fan lead — the computer shuts down within minutes.'],
 faq:[{q:'Πόσο ζεστός είναι «πολύ ζεστός»;', q_en:'How hot is “too hot”?',
       a:'Σε ηρεμία, ένας επεξεργαστής κάθεται τυπικά στους 35–50 °C. Σε πλήρες φορτίο, 70–85 °C είναι φυσιολογικά για τα περισσότερα μοντέλα. Πάνω από 95 °C ο επεξεργαστής μειώνει μόνος του τη συχνότητα και ο υπολογιστής γίνεται αργός.',
       a_en:'At idle a CPU typically sits at 35–50 °C. Under full load, 70–85 °C is normal for most. Above 95 °C the CPU throttles itself and the computer slows down.'}],
 vq:'καθαρισμός υπολογιστή θερμοαγώγιμη πάστα', vq_en:'how to clean pc dust and apply thermal paste'
},

 tips:['Ο πιο υποτιμημένος τρόπος να «φτιάξεις» το Wi-Fi: ένα καλώδιο δικτύου εκεί που μένει η τηλεόραση ή ο σταθερός υπολογιστής. Ελευθερώνει τον ασύρματο χώρο για τα υπόλοιπα.',

 tips_en:['The most underrated Wi-Fi fix: an Ethernet cable to wherever the TV or desktop lives. It frees the airwaves for everything else.',

          'Keep a separate guest network: visitors get online without your main password.'],

       a:'Συχνά οι κατασκευαστές βάζουν 2–3 παραπάνω από κάθε τύπο. Αντιπαράβαλε όμως με τη λίστα: αν περισσεύει ολόκληρος τύπος βίδας, έχεις παραλείψει βήμα και πρέπει να το βρεις πριν φορτώσεις το έπιπλο.',

{
 id:'door-hinge', cat:'wood', ico:'🚪', diff:1, risk:false,
 n:'Πόρτα που τρίζει, κολλάει ή δεν κλείνει', n_en:'A door that squeaks, sticks or will not close',

 d_en:'Four different symptoms, four different fixes — and none of them needs a carpenter.',
 time:'20–60 λεπτά', time_en:'20–60 minutes', cost:'0–15 €', cost_en:'€0–15', ppl:'1', ppl_en:'1',
 safety:['Αν ξεβιδώσεις μεντεσέ, κάποιος πρέπει να κρατά την πόρτα. Ζυγίζει 20–35 kg.'],

 tools:['Κατσαβίδια','Σφυρί','Ξύλινο τακάκι','Γυαλόχαρτο ή ξυλοφάγος (ράσπα)','Μολύβι'],
 tools_en:['Screwdrivers','Hammer','Wooden wedge','Sandpaper or a rasp','Pencil'],

 mats_en:['Machine oil or grease (not WD-40 as a permanent fix)','Longer wood screws','Toothpicks and wood glue','Card for shims'],
 steps:[
  {t:'Τρίζει: λάδωσε τους μεντεσέδες', t_en:'Squeaks: oil the hinges',
   d:'Σήκωσε την πόρτα ελαφρά με ένα τακάκι ώστε να μειωθεί η πίεση, και βάλε λίγες σταγόνες λάδι μηχανής στον άξονα κάθε μεντεσέ. Άνοιξε και κλείσε 10 φορές. Σκούπισε ό,τι περισσέψει.',
   d_en:'Wedge the door up slightly to take the load off, and put a few drops of machine oil on each hinge pin. Swing it ten times. Wipe off the excess.',
   tip:'Το WD-40 σταματά το τρίξιμο για λίγες εβδομάδες γιατί δεν είναι λιπαντικό. Για μόνιμη λύση θέλεις λάδι μηχανής, γράσο ή σπρέι σιλικόνης.',
   tip_en:'WD-40 stops the squeak for a few weeks because it is not a lubricant. For a permanent fix use machine oil, grease or silicone spray.'},
  {t:'Κρέμασε: σφίξε ή αντικατάστησε βίδες', t_en:'Dropped: tighten or replace the screws',
   d:'Πόρτα που «τρίβει» στο πάτωμα ή στην κάσα από την πλευρά της κλειδαριάς έχει συνήθως χαλαρό τον πάνω μεντεσέ. Σφίξε τις βίδες. Αν γυρίζουν στο κενό, αντικατάστησέ τες με μακρύτερες που πιάνουν στην ξυλεία της κάσας.',
   d_en:'A door rubbing on the floor or the frame on the latch side usually has a loose top hinge. Tighten the screws. If they spin, replace them with longer ones that reach the frame timber.'},
  {t:'Βίδα που γυρίζει στο κενό', t_en:'A screw hole that will not hold',
   d:'Βγάλε τη βίδα, γέμισε την τρύπα με οδοντογλυφίδες βουτηγμένες σε ξυλόκολλα, κόψε τις πρόσωπο, άσε 1 ώρα και ξαναβίδωσε. Η τρύπα γίνεται σαν καινούρια.',
   d_en:'Remove the screw, pack the hole with glue-dipped toothpicks, snap them off flush, wait an hour and re-drive. The hole is as good as new.'},
  {t:'Κολλάει σε ένα σημείο: βρες πού', t_en:'Sticks in one place: find where',
   d:'Πέρνα ένα φύλλο χαρτί γύρω από την πόρτα με αυτήν κλειστή. Όπου δεν περνά, εκεί τρίβει. Ή βάψε ελαφρά με μολύβι το ύποπτο σημείο και άνοιξε-κλείσε: τα σημάδια δείχνουν την επαφή.',
   d_en:'Slide a sheet of paper around the closed door. Where it will not pass, that is where it binds. Or rub pencil on the suspect edge and swing it: the marks show the contact.'},
  {t:'Τρίψε το ελάχιστο δυνατό', t_en:'Remove the least material possible',
   d:'Τρίψε λίγα δέκατα του χιλιοστού τη φορά με ράσπα ή γυαλόχαρτο και δοκίμαζε συνέχεια. Αφαιρείς εύκολα, δεν προσθέτεις ποτέ. Βάψε ή βερνίκωσε ξανά το γυμνό ξύλο, αλλιώς ρουφά υγρασία και φουσκώνει.',
   d_en:'Take off a few tenths of a millimetre at a time with a rasp or paper and test constantly. You can always remove more; you can never put it back. Repaint or reseal the bare wood or it will absorb moisture and swell.'},
  {t:'Δεν μανταλώνει: μετακίνησε το αντικρίσματο', t_en:'Will not latch: move the strike plate',
   d:'Δες πού χτυπά η γλώσσα σε σχέση με την τρύπα του αντικρίσματος. Ξεβίδωσέ το, μετακίνησέ το 1–2 mm προς τη σωστή κατεύθυνση, ή λίμαρε την τρύπα του, και ξαναβίδωσε.',
   d_en:'See where the latch hits relative to the strike plate opening. Unscrew it, shift it 1–2 mm in the right direction, or file the opening, and refit.'},
  {t:'Ανοίγει μόνη της: σφήνωσε τον μεντεσέ', t_en:'Swings open by itself: shim the hinge',
   d:'Σημαίνει ότι η κάσα δεν είναι κατακόρυφη. Πρακτική λύση: βάλε μια λεπτή σφήνα από χαρτόνι πίσω από το ένα φύλλο του μεντεσέ ώστε να αλλάξει ελαφρά η γωνία.',
   d_en:'It means the frame is not plumb. Practical fix: put a thin card shim behind one leaf of a hinge to change the angle slightly.'}],
 tips:['Οι ξύλινες πόρτες φουσκώνουν το καλοκαίρι με την υγρασία και συρρικνώνονται τον χειμώνα. Αν κολλάει μόνο τον Αύγουστο, μην τρίψεις — θα έχεις κενό τον Ιανουάριο.',
       'Άλλαξε τη βίδα του πάνω μεντεσέ που πιάνει στην κάσα με μία 70 mm: πιάνει στο δομικό ξύλο πίσω από την κάσα και σηκώνει ολόκληρη την πόρτα.',
       'Λάδωσε τους μεντεσέδες μία φορά τον χρόνο και δεν θα ξανατρίξουν ποτέ.'],
 tips_en:['Wooden doors swell in summer humidity and shrink in winter. If it only sticks in August, do not plane it — you will have a gap in January.',
          'Swap the top hinge screw that goes into the frame for a 70 mm one: it bites into the structural timber behind the frame and lifts the whole door.',
          'Oil the hinges once a year and they will never squeak again.'],
 errs:['Τρίψιμο πριν ελεγχθούν οι βίδες των μεντεσέδων — τις περισσότερες φορές το πρόβλημα ήταν μια χαλαρή βίδα.',
       'Υπερβολικό τρίψιμο που αφήνει μόνιμο κενό.',
       'Γυμνό ξύλο που μένει άβαφο και φουσκώνει ξανά.',
       'WD-40 ως μόνιμο λιπαντικό.'],
 errs_en:['Planing before checking the hinge screws — most of the time a loose screw was the whole problem.',
          'Taking off too much and leaving a permanent gap.',
          'Bare wood left unsealed, which swells again.',
          'WD-40 used as a permanent lubricant.'],
 faq:[{q:'Η πόρτα κολλάει στο πάνω μέρος από την πλευρά της κλειδαριάς.', q_en:'The door binds at the top on the latch side.',
       a:'Κλασικό σύμπτωμα χαλαρού πάνω μεντεσέ. Η πόρτα «γέρνει» και το πάνω-μακρινό σημείο ανεβαίνει στην κάσα. Σφίξε ή αντικατάστησε τις βίδες του πάνω μεντεσέ με μακρύτερες πριν σκεφτείς οτιδήποτε άλλο.',
       a_en:'The classic sign of a loose top hinge. The door tips and the top far corner rises into the frame. Tighten or replace the top hinge screws with longer ones before considering anything else.'}],
 vq:'πόρτα τρίζει κολλάει επισκευή μεντεσέ', vq_en:'fix a door that sticks squeaks or will not latch'
},
{
 id:'wood-finish', cat:'wood', ico:'🪵', diff:2, risk:false,
 n:'Τρίψιμο και βερνίκι σε ξύλο', n_en:'Sanding and varnishing wood',
 d:'Παλιό τραπέζι, ράφι ή έπιπλο εξωτερικού χώρου. Η υπομονή στο τρίψιμο φαίνεται σε κάθε εκατοστό του τελικού.',
 d_en:'An old table, a shelf or garden furniture. Patience in the sanding shows in every centimetre of the finish.',
 time:'2 ημέρες', time_en:'2 days', cost:'20–60 €', cost_en:'€20–60', ppl:'1', ppl_en:'1',
 safety:['Μάσκα και γυαλιά στο τρίψιμο. Η σκόνη ορισμένων ξύλων (δρυς, τροπικά) είναι ερεθιστική.',
         'Τα βερνίκια διαλύτη θέλουν αερισμό και μακριά από φλόγα.',
         'Πανιά με βερνίκι ή λάδι μπορούν να αυταναφλεγούν. Άπλωσέ τα να στεγνώσουν έξω.'],
 safety_en:['Mask and goggles when sanding. Some wood dust (oak, tropical species) is an irritant.',
            'Solvent varnishes need ventilation and no naked flames.',
            'Rags soaked in varnish or oil can self-ignite. Spread them out to dry outdoors.'],
 tools:['Τριβείο εκκεντρικό ή χειρός','Γυαλόχαρτα 80, 120, 180, 240','Πινέλα καλής ποιότητας','Σπάτουλα','Πανιά χωρίς χνούδι','Tack cloth'],
 tools_en:['Random orbit or hand sander','80, 120, 180, 240 grit paper','Good quality brushes','Scraper','Lint-free cloths','Tack cloth'],
 mats:['Βερνίκι νερού ή διαλύτη, ή λάδι ξύλου','Ξυλόστοκος','Βύσμα χρώματος (μορίτης) αν αλλάζεις απόχρωση','White spirit ή νερό ανάλογα με το προϊόν'],
 mats_en:['Water- or solvent-based varnish, or wood oil','Wood filler','Wood stain if changing colour','White spirit or water depending on the product'],
 steps:[
  {t:'Αφαίρεσε το παλιό φινίρισμα', t_en:'Strip the old finish',
   d:'Ξεκίνα με γυαλόχαρτο 80, πάντα κατά τη φορά των νερών. Σε πολλές στρώσεις παλιού βερνικιού, ένα χημικό αφαιρετικό γλιτώνει ώρες.',
   d_en:'Start with 80 grit, always along the grain. With many layers of old varnish, a chemical stripper saves hours.',
   warn:'Ποτέ τρίψιμο εγκάρσια στα νερά. Οι γρατζουνιές εμφανίζονται σαν λευκές γραμμές μόλις μπει το βερνίκι.',
   warn_en:'Never sand across the grain. The scratches show as white lines the moment the varnish goes on.'},
  {t:'Στοκάρισε τις ατέλειες', t_en:'Fill the defects',
   d:'Ξυλόστοκος σε τρύπες και ρωγμές, ελαφρώς παραπάνω γιατί «καθίζει». Διάλεξε απόχρωση λίγο πιο ανοιχτή από το ξύλο — ο στόκος σκουραίνει με το βερνίκι.',
   d_en:'Wood filler in holes and cracks, slightly proud because it shrinks. Choose a shade slightly lighter than the wood — filler darkens under varnish.'},
  {t:'Ανέβα σταδιακά στα ψιλά', t_en:'Work up through the grits',
   d:'80 → 120 → 180 → 240. Κάθε στάδιο σβήνει τις γρατζουνιές του προηγούμενου. Μην παραλείψεις βήματα: το 240 δεν σβήνει ποτέ τις γρατζουνιές του 80.',
   d_en:'80 → 120 → 180 → 240. Each stage removes the previous one’s scratches. Do not skip grits: 240 will never remove 80-grit scratches.'},
  {t:'«Σήκωσε» τα νερά (βερνίκι νερού)', t_en:'Raise the grain (water-based finish)',
   d:'Πέρνα ελαφρά με νωπό σφουγγάρι, άσε να στεγνώσει μία ώρα και τρίψε με 240. Οι ίνες που σηκώθηκαν φεύγουν τώρα, όχι μετά το πρώτο χέρι βερνικιού.',
   d_en:'Wipe over with a damp sponge, let it dry an hour and sand with 240. The fibres that lift come off now, not after the first coat.'},
  {t:'Ξεσκόνισε τέλεια', t_en:'Dust off perfectly',
   d:'Σκούπα, νωπό πανί, tack cloth. Ξεσκόνισε και τον χώρο γύρω — η σκόνη που αιωρείται κάθεται πάνω στο νωπό βερνίκι.',
   d_en:'Vacuum, damp cloth, tack cloth. Clean the surroundings too — airborne dust settles into wet varnish.'},
  {t:'Δοκίμασε το χρώμα κάπου κρυφά', t_en:'Test the colour somewhere hidden',
   d:'Αν βάζεις μορίτη, δοκίμασέ τον κάτω από το τραπέζι ή στην πίσω πλευρά. Το ίδιο προϊόν δίνει τελείως άλλη απόχρωση σε πεύκο και σε δρυ.',
   d_en:'If you are staining, test underneath the table or on the back. The same product gives a completely different shade on pine and on oak.'},
  {t:'Πρώτο χέρι αραιωμένο', t_en:'First coat, thinned',
   d:'Αραίωσε το πρώτο χέρι 10% (νερό ή white spirit ανάλογα με το προϊόν). Διεισδύει καλύτερα και δουλεύει ως αστάρι. Άπλωσε λεπτά, κατά τη φορά των νερών.',
   d_en:'Thin the first coat by 10% (water or white spirit as appropriate). It penetrates better and acts as a primer. Apply thinly, along the grain.'},
  {t:'Τρίψε ελαφρά ανάμεσα στα χέρια', t_en:'De-nib between coats',
   d:'Μετά το στέγνωμα, πολύ ελαφρύ πέρασμα με 240 ή ψιλό σφουγγαράκι και ξεσκόνισμα. Αυτό κάνει την επιφάνεια να μοιάζει με γυαλί.',
   d_en:'Once dry, a very light pass with 240 or a fine pad, then dust off. This is what makes the surface feel like glass.'},
  {t:'Δεύτερο και τρίτο χέρι', t_en:'Second and third coats',
   d:'Δύο χέρια για διακοσμητικό έπιπλο, τρία για τραπέζι ή επιφάνεια που δουλεύεται. Το τελευταίο χέρι απλώνεται αδιάλυτο και δεν τρίβεται μετά.',
   d_en:'Two coats for a decorative piece, three for a table or a working surface. The last coat goes on unthinned and is not sanded afterwards.'},
  {t:'Άφησε να σκληρύνει', t_en:'Let it harden',
   d:'Στεγνό στην αφή σε λίγες ώρες, αλλά η πλήρης σκλήρυνση θέλει 7–14 ημέρες. Μην ακουμπήσεις βαριά αντικείμενα ή τραπεζομάντηλο πριν από αυτό.',
   d_en:'Touch dry in a few hours, but full hardness takes 7–14 days. Do not put heavy objects or a tablecloth on it before then.'}],
 tips:['Βερνίκι νερού: χωρίς μυρωδιά, δεν κιτρινίζει, γρήγορο στέγνωμα. Διαλύτη: πιο ανθεκτικό στη χρήση και δίνει «ζεστό» χρώμα, αλλά κιτρινίζει και μυρίζει.',
       'Για έπιπλα εξωτερικού χώρου προτίμησε λάδι ξύλου (teak, τικ) αντί για βερνίκι: δεν ξεφλουδίζει, απλώς ξεθωριάζει και ανανεώνεται με ένα πέρασμα.',
       'Δούλεψε πάντα στη σκιά και όχι σε ώρα με πολύ αέρα — η σκόνη και ο ήλιος καταστρέφουν το φινίρισμα.',
       'Κράτα σημειώσεις: ποιο προϊόν, πόσα χέρια, ποιος μορίτης. Σε δύο χρόνια που θα θέλεις ανανέωση, θα σε γλιτώσει.'],
 tips_en:['Water-based: low odour, does not yellow, dries fast. Solvent-based: tougher in use with a warmer colour, but yellows and smells.',
          'For outdoor furniture prefer a wood oil (teak oil) over varnish: it does not peel, it just fades and is refreshed with a wipe.',
          'Always work in the shade and never on a windy day — dust and sun ruin the finish.',
          'Keep notes: which product, how many coats, which stain. In two years when you refresh it, you will be glad.'],
 errs:['Τρίψιμο εγκάρσια στα νερά.',
       'Παράλειψη ενδιάμεσων κοκκομετριών.',
       'Χοντρές στρώσεις βερνικιού που στάζουν και μένουν σταγόνες.',
       'Χρήση της επιφάνειας πριν σκληρύνει πλήρως.'],
 errs_en:['Sanding across the grain.',
          'Skipping intermediate grits.',
          'Thick varnish coats that run and leave drips.',
          'Using the surface before it has fully hardened.'],
 faq:[{q:'Βερνίκι ή λάδι;', q_en:'Varnish or oil?',
       a:'Το βερνίκι φτιάχνει προστατευτικό φιλμ πάνω από το ξύλο: πιο ανθεκτικό σε νερό και γρατζουνιές, αλλά όταν φθαρεί πρέπει να τριφτεί ολόκληρο. Το λάδι διεισδύει μέσα: πιο φυσική αίσθηση, εύκολη ανανέωση με ένα πανί, αλλά χρειάζεται συντήρηση κάθε 6–12 μήνες.',
       a_en:'Varnish forms a protective film on top: tougher against water and scratches, but when it wears you must sand it all back. Oil penetrates in: a more natural feel, refreshed with a cloth, but needs maintenance every 6–12 months.'}],
 vq:'τρίψιμο και βερνίκι σε ξύλινο έπιπλο', vq_en:'how to sand and varnish wood furniture'
},

{
 id:'washer-filter', cat:'home', ico:'🧺', diff:1, risk:false,
 n:'Πλυντήριο που δεν αδειάζει: καθαρισμός φίλτρου', n_en:'Washing machine not draining: cleaning the filter',

 d_en:'The most common washing machine “fault” is not a fault. It is a coin, a button or a hair in the filter.',
 time:'20 λεπτά', time_en:'20 minutes', cost:'0 €', cost_en:'€0', ppl:'1', ppl_en:'1',

 safety_en:['Unplug the machine before opening it. Water and electricity together are the worst combination.',

 tools:['Ρηχή λεκάνη','Πετσέτες','Πένσα ή τσιμπίδα','Φακός','Κατσαβίδι πλατύ (για το καπάκι)'],

 steps:[

  {t:'Βρες το φίλτρο', t_en:'Find the filter',

  {t:'Άδειασε πρώτα το νερό', t_en:'Drain the water first',
   d:'Δίπλα στο φίλτρο υπάρχει συνήθως ένα λεπτό σωληνάκι εκκένωσης. Τράβα το, βγάλε την τάπα και άδειασε σε λεκάνη. Θα χρειαστεί να αδειάσεις τη λεκάνη 3–5 φορές — μέσα υπάρχουν 5–10 λίτρα.',
   d_en:'Next to the filter there is usually a thin drain hose. Pull it out, remove the cap and drain into the bowl. You will empty the bowl 3–5 times — there are 5–10 litres inside.',
   tip:'Αν δεν υπάρχει σωληνάκι, γείρε το πλυντήριο ελαφρά προς τα πίσω και ξεβίδωσε το φίλτρο αργά, αφήνοντας το νερό να τρέξει σταδιακά.',
   tip_en:'If there is no drain hose, tilt the machine back slightly and unscrew the filter slowly, letting the water out gradually.'},

{
 id:'drip-irrigation', cat:'garden', ico:'💧', diff:2, risk:false,
 n:'Αυτόματο πότισμα με σταγόνες', n_en:'Setting up drip irrigation',
 d:'Μπαλκόνι ή κήπος που ποτίζεται μόνος του, ακόμη και όταν λείπεις. Χωρίς σκάψιμο και χωρίς υδραυλικό.',
 d_en:'A balcony or garden that waters itself, even while you are away. No digging and no plumber.',
 time:'2–4 ώρες', time_en:'2–4 hours', cost:'40–120 €', cost_en:'€40–120', ppl:'1', ppl_en:'1',
 safety:['Ο προγραμματιστής και το φίλτρο μπαίνουν σε σημείο που δεν πλημμυρίζει.',
         'Έλεγξε ότι η πρίζα του προγραμματιστή (αν είναι ρεύματος) είναι στεγανή και εκτός εμβέλειας ψεκασμού.'],
 safety_en:['The timer and filter go somewhere that cannot flood.',
            'If the timer is mains powered, make sure the socket is weatherproof and out of spray range.'],
 tools:['Ψαλίδι ή κόφτης σωλήνα','Εργαλείο διάτρησης σταλακτών (punch)','Κλειδί','Μέτρο'],
 tools_en:['Scissors or pipe cutter','Emitter hole punch','Spanner','Tape measure'],
 mats:['Προγραμματιστής βρύσης με μπαταρίες','Φίλτρο και μειωτήρας πίεσης','Σωλήνας 16 mm (κεντρικός)','Μικροσωλήνας 4 mm','Σταλάκτες 2 ή 4 L/h','Ρακόρ, γωνίες, τάπες','Πάσσαλοι στήριξης'],
 mats_en:['Battery tap timer','Filter and pressure reducer','16 mm main pipe','4 mm micro-tubing','2 or 4 L/h drippers','Fittings, elbows, end caps','Ground stakes'],
 steps:[
  {t:'Σχεδίασε τη διαδρομή', t_en:'Plan the layout',
   d:'Σκίτσαρε πού είναι τα φυτά και πώς θα περάσει ο κεντρικός σωλήνας ώστε να τα προσεγγίζει όλα. Ομαδοποίησε φυτά με παρόμοιες ανάγκες νερού στην ίδια γραμμή.',
   d_en:'Sketch where the plants are and how the main pipe will run to reach them all. Group plants with similar water needs on the same line.'},
  {t:'Συναρμολόγησε την κεφαλή στη βρύση', t_en:'Assemble the tap head',
   d:'Σειρά: βρύση → προγραμματιστής → φίλτρο → μειωτήρας πίεσης → κεντρικός σωλήνας. Ο μειωτήρας είναι απαραίτητος: τα εξαρτήματα σταγόνας δουλεύουν σε 1–2 bar, ενώ το δίκτυο δίνει 3–5.',
   d_en:'Order: tap → timer → filter → pressure reducer → main pipe. The reducer is essential: drip fittings work at 1–2 bar while mains supply is 3–5.',
   warn:'Χωρίς φίλτρο, οι σταλάκτες βουλώνουν μέσα σε μία σεζόν. Χωρίς μειωτήρα, τα ρακόρ πετάγονται.',
   warn_en:'Without a filter the drippers clog within a season. Without a reducer the fittings blow off.'},
  {t:'Στρώσε τον κεντρικό σωλήνα', t_en:'Lay the main pipe',
   d:'Άπλωσέ τον στον ήλιο για μισή ώρα πριν — γίνεται μαλακός και δουλεύεται εύκολα. Στερέωσέ τον με πασσάλους κάθε 1–1,5 m και τερμάτισέ τον με τάπα.',
   d_en:'Lay it in the sun for half an hour first — it softens and becomes easy to work. Peg it every 1–1.5 m and finish with an end cap.'},
  {t:'Τρύπησε και βάλε τους σταλάκτες', t_en:'Punch and fit the drippers',
   d:'Με το ειδικό εργαλείο (όχι με κατσαβίδι ή καρφί, που κάνουν άτακτη τρύπα και διαρροή), άνοιξε τρύπα και πίεσε τον σταλάκτη ή τον μικροσωλήνα μέσα.',
   d_en:'With the proper punch (not a screwdriver or a nail, which make a ragged hole that leaks), make the hole and press the dripper or micro-tube in.'},
  {t:'Τοποθέτησε σωστά κάθε σταλάκτη', t_en:'Position each dripper correctly',
   d:'Όχι κολλητά στον κορμό: 10–15 cm μακριά, ώστε το νερό να φτάνει στις ρίζες που τρέφουν. Μεγάλα φυτά και δέντρα θέλουν 2–4 σταλάκτες γύρω τους.',
   d_en:'Not against the stem: 10–15 cm away, so water reaches the feeding roots. Larger plants and trees want 2–4 drippers around them.'},
  {t:'Ξέπλυνε πριν τερματίσεις', t_en:'Flush before capping',
   d:'Άνοιξε το νερό με τον σωλήνα ανοιχτό στην άκρη για 1–2 λεπτά, ώστε να φύγουν τα σκουπίδια της κοπής. Μετά βάλε την τάπα.',
   d_en:'Run water through with the end open for 1–2 minutes to flush out cutting debris. Then fit the end cap.'},
  {t:'Ρύθμισε τον προγραμματιστή', t_en:'Set the timer',
   d:'Καλύτερα λίγο νερό συχνά παρά πολύ σπάνια, αλλά για βαθιές ρίζες προτίμησε μεγαλύτερα διαστήματα με περισσότερη διάρκεια. Ώρα ποτίσματος: νωρίς το πρωί, ποτέ το μεσημέρι.',
   d_en:'Little and often beats a lot rarely, but for deep roots prefer longer intervals with longer runs. Water early in the morning, never at midday.'},
  {t:'Έλεγξε το πρώτο πότισμα ζωντανά', t_en:'Watch the first cycle',
   d:'Μείνε δίπλα σε ολόκληρο τον πρώτο κύκλο. Έλεγξε ότι κάθε σταλάκτης στάζει και ότι δεν υπάρχει διαρροή σε κανένα ρακόρ. Σκάψε 10 cm δίπλα σε ένα φυτό μετά: το χώμα πρέπει να είναι υγρό σε βάθος.',
   d_en:'Stay for the whole first cycle. Check every dripper is dripping and no fitting is leaking. Afterwards dig 10 cm beside a plant: the soil should be moist at depth.'},
  {t:'Συντήρησε στην αρχή κάθε σεζόν', t_en:'Service it at the start of each season',
   d:'Καθάρισε το φίλτρο, ξέπλυνε τις γραμμές ανοίγοντας τις τάπες, και αντικατάστησε τους σταλάκτες που βούλωσαν. Άλλαξε τις μπαταρίες του προγραμματιστή.',
   d_en:'Clean the filter, flush the lines by opening the end caps, and replace any clogged drippers. Change the timer batteries.'}],
 tips:['Το πότισμα με σταγόνες εξοικονομεί 30–60% νερό σε σχέση με το λάστιχο, γιατί δεν χάνεται τίποτα στην εξάτμιση και στα μονοπάτια.',
       'Βάλε πάντα εφεδρικές μπαταρίες στον προγραμματιστή πριν φύγεις διακοπές — και δοκίμασέ τον μία εβδομάδα πριν.',
       'Ένα λεπτό στρώμα φυτικού υλικού (mulch) πάνω από τους σταλάκτες μειώνει την εξάτμιση δραματικά.',
       'Σε γλάστρες μπαλκονιού, 2 L/h σταλάκτης για μικρή γλάστρα, 4 L/h για μεγάλη. Δοκίμασε και προσάρμοσε: το φύλλωμα σου λέει αν φτάνει.'],
 tips_en:['Drip irrigation saves 30–60% of water compared with a hose, because nothing is lost to evaporation or to paths.',
          'Always put fresh batteries in the timer before you go on holiday — and test it a week ahead.',
          'A thin layer of mulch over the drippers cuts evaporation dramatically.',
          'For balcony pots, a 2 L/h dripper for a small pot, 4 L/h for a large one. Test and adjust: the foliage tells you if it is enough.'],
 errs:['Παράλειψη φίλτρου ή μειωτήρα πίεσης.',
       'Τρύπες με κατσαβίδι αντί για εργαλείο — μόνιμες διαρροές.',
       'Σταλάκτης κολλητά στον κορμό.',
       'Πότισμα το μεσημέρι, όταν το μεγαλύτερο μέρος εξατμίζεται.'],
 errs_en:['Skipping the filter or the pressure reducer.',
          'Punching holes with a screwdriver instead of the tool — permanent leaks.',
          'A dripper right against the stem.',
          'Watering at midday, when most of it evaporates.'],
 faq:[{q:'Πόση ώρα πρέπει να ποτίζει;', q_en:'How long should it run?',
       a:'Ξεκίνα από 20–30 λεπτά, 3 φορές την εβδομάδα το καλοκαίρι, και προσάρμοσε. Ο σωστός έλεγχος είναι πρακτικός: σκάψε 10 cm δίπλα σε ένα φυτό μία ώρα μετά το πότισμα. Αν το χώμα είναι υγρό σε βάθος, η διάρκεια είναι σωστή.',
       a_en:'Start with 20–30 minutes, three times a week in summer, and adjust. The real check is practical: dig 10 cm beside a plant an hour after watering. If the soil is moist at depth, the duration is right.'}],

 tools_en:['A stable ladder','Heavy gloves','Goggles','Bucket with a hook','Gutter scoop or an old trowel','Garden hose','Drain snake'],

   d:'Δες αν κάποιο στήριγμα έχει χαλαρώσει και αν οι αρμοί στάζουν. Σφίξε τις βίδες και πέρασε στεγανωτικό υδρορροής στις ενώσεις που δείχνουν σημάδια διαρροής.',
   d_en:'Look for loose brackets and dripping joints. Tighten the screws and run gutter sealant over any joints showing signs of leaking.'},
  {t:'Έλεγξε την κλίση', t_en:'Check the fall',
   d:'Η υδρορροή πρέπει να πέφτει ελαφρά προς την κατακόρυφη σωλήνα — περίπου 1 cm ανά 3 m. Νερό που λιμνάζει σημαίνει λάσπη, κουνούπια και διάβρωση.',
   d_en:'The gutter should fall gently towards the downpipe — about 1 cm per 3 m. Standing water means silt, mosquitoes and corrosion.'},
  {t:'Σκέψου πλέγμα προστασίας', t_en:'Consider a gutter guard',
   d:'Αν υπάρχουν δέντρα κοντά, ένα πλέγμα ή φίλτρο στο στόμιο της κατακόρυφης μειώνει δραστικά τη συχνότητα καθαρισμού. Δεν την εξαφανίζει — απλώς την αραιώνει.',
   d_en:'If there are trees nearby, a mesh or a downpipe strainer greatly reduces how often you must do this. It does not eliminate the job — it just spaces it out.'}],
 tips:['Καθάρισε πάντα ΠΡΙΝ τις πρώτες βροχές του φθινοπώρου, όχι μετά.',
       'Ένα φραγμένο σημείο στην υδρορροή φαίνεται από κάτω σε δυνατή βροχή: εκεί που ξεχειλίζει, εκεί είναι το πρόβλημα. Παρατήρησε την επόμενη νεροποντή.',
       'Κοίτα ταυτόχρονα και τα κεραμίδια γύρω από την υδρορροή — από τη σκάλα φαίνονται ραγισμένα ή μετατοπισμένα κομμάτια.',
       'Αν το νερό μπαίνει πίσω από την υδρορροή στον τοίχο, λείπει το προστατευτικό έλασμα (drip edge) και εκεί ξεκινά η υγρασία.'],
 tips_en:['Always clean BEFORE the first autumn rains, not after.',
          'A blockage shows itself from the ground in heavy rain: wherever it overflows, that is the spot. Watch during the next downpour.',
          'While you are up there, check the tiles around the gutter — cracked or slipped pieces are visible from the ladder.',
          'If water runs behind the gutter into the wall, the drip edge is missing — that is where the damp starts.'],
 errs:['Σκάλα ακουμπισμένη πάνω στην ίδια την υδρορροή.',
       'Εργασία μόνος, χωρίς κανέναν να κρατά τη σκάλα.',
       'Γέρσιμο πλάγια αντί για μετακίνηση της σκάλας.',
       'Καθαρισμός μόνο των φύλλων χωρίς έλεγχο της κατακόρυφης σωλήνας.'],
 errs_en:['Resting the ladder on the gutter itself.',
          'Working alone with nobody footing the ladder.',
          'Leaning sideways instead of moving the ladder.',
          'Clearing the leaves but never checking the downpipe.'],
 faq:[{q:'Κάθε πότε πρέπει να τις καθαρίζω;', q_en:'How often should I clean them?',
       a:'Δύο φορές τον χρόνο ως κανόνας: τέλη φθινοπώρου και άνοιξη. Αν υπάρχουν πεύκα ή φυλλοβόλα δέντρα δίπλα, τρεις ή τέσσερις. Το κόστος μιας υγρασίας στον τοίχο είναι πολλαπλάσιο του χρόνου που χρειάζεται ο καθαρισμός.',
       a_en:'Twice a year as a rule: late autumn and spring. With pines or deciduous trees nearby, three or four times. The cost of damp in a wall is many times the time this takes.'}],
 vq:'καθαρισμός υδρορροής με ασφάλεια σκάλα', vq_en:'how to clean gutters safely ladder'
},
{
 id:'lock-cylinder', cat:'home', ico:'🔑', diff:2, risk:false,
 n:'Αλλαγή αφαλού κλειδαριάς', n_en:'Changing a lock cylinder',
 d:'Χάθηκε κλειδί, έφυγε ένοικος, ή θέλεις καλύτερη ασφάλεια. Δεν αλλάζεις ολόκληρη την κλειδαριά — μόνο τον αφαλό.',
 d_en:'A lost key, a departed tenant, or you simply want better security. You do not replace the whole lock — only the cylinder.',
 time:'20 λεπτά', time_en:'20 minutes', cost:'15–80 €', cost_en:'€15–80', ppl:'1', ppl_en:'1',

            'Keep the old key until you have confirmed the new one works from both sides.'],
 tools:['Σταυροκατσάβιδο μακρύ','Μέτρο ή χάρακας','Φακός'],
 tools_en:['Long Phillips screwdriver','Ruler or tape measure','Torch'],
 mats:['Νέος αφαλός σωστών διαστάσεων','Βίδα στερέωσης (συνήθως συνοδεύει)','Γραφίτης ή σπρέι κλειδαριάς'],
 mats_en:['New cylinder of the correct size','Fixing screw (usually supplied)','Graphite or lock spray'],
 steps:[
  {t:'Μέτρησε σωστά τον αφαλό', t_en:'Measure the cylinder correctly',
   d:'Ο αφαλός μετριέται σε δύο μέρη, από την κεντρική βίδα προς κάθε πλευρά: π.χ. 35/45 mm. Οι δύο πλευρές είναι συχνά ΔΙΑΦΟΡΕΤΙΚΕΣ. Μέτρα με την πόρτα ανοιχτή, με χάρακα, από το μέσο της τρύπας της βίδας.',
   d_en:'A cylinder is measured in two halves from the central screw: e.g. 35/45 mm. The two halves are often DIFFERENT. Measure with the door open, with a ruler, from the centre of the screw hole.',
   warn:'Αν ο αφαλός προεξέχει πάνω από 3 mm από την ασπίδα, ένας διαρρήκτης μπορεί να τον σπάσει. Πάρε το σωστό μήκος, ούτε μεγαλύτερο ούτε μικρότερο.',
   warn_en:'If the cylinder protrudes more than 3 mm beyond the escutcheon, it can be snapped. Get the right length, neither longer nor shorter.'},
  {t:'Αγόρασε τον σωστό τύπο', t_en:'Buy the right type',
   d:'Ευρωπαϊκός αφαλός (πιο κοινός), με κλειδί και από τις δύο πλευρές ή με πόμολο στη μία. Για εξώπορτα, προτίμησε αφαλό με πιστοποίηση αντιδιάρρηξης και προστασία από «σπάσιμο» (anti-snap).',
   d_en:'Euro cylinder (the most common), key on both sides or a thumbturn on one. For a front door, choose one with an anti-snap security rating.'},
  {t:'Ξεβίδωσε την κεντρική βίδα', t_en:'Undo the central screw',
   d:'Στο κάθετο μέτωπο της κλειδαριάς, στην άκρη της πόρτας, υπάρχει μια μακριά βίδα ακριβώς στο ύψος του αφαλού. Ξεβίδωσέ την τελείως και φύλαξέ την.',
   d_en:'On the lock’s faceplate, on the edge of the door, there is a long screw exactly at cylinder height. Remove it completely and keep it safe.'},
  {t:'Γύρισε το κλειδί 10–15°', t_en:'Turn the key 10–15°',
   d:'Βάλε το κλειδί και γύρισέ το ελαφρά μέχρι το «φτερό» του αφαλού (η μικρή προεξοχή που κινεί την κλειδαριά) να ευθυγραμμιστεί με το σώμα του. Μόνο τότε βγαίνει ο αφαλός.',
   d_en:'Insert the key and turn it slightly until the cylinder’s cam (the small lug that drives the lock) lines up with the body. Only then will it slide out.',
   tip:'Αν δεν βγαίνει, η γωνία δεν είναι σωστή. Δοκίμασε λίγο πιο δεξιά ή αριστερά — δεν χρειάζεται καθόλου δύναμη.',
   tip_en:'If it will not come out the angle is wrong. Try a little more either way — no force is needed at all.'},
  {t:'Τράβα τον παλιό αφαλό', t_en:'Pull the old cylinder out',
