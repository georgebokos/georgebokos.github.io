<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0F5C8C">
<meta name="description" content="Αναλυτικοί οδηγοί DIY στα ελληνικά και αγγλικά: γυψοσανίδα, βάψιμο, πρίζες, υδραυλικά, ποδήλατο, αυτοκίνητο, format υπολογιστή. Βήμα-βήμα, με εργαλεία, υλικά και σχεδιαγράμματα.">
<title>Φτιάξ' το μόνος σου — Οδηγοί DIY</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Φτιάξ' το">
<meta property="og:type" content="website">
<meta property="og:title" content="Φτιάξ' το μόνος σου — Οδηγοί DIY">
<meta property="og:description" content="43 αναλυτικοί οδηγοί με βήματα, εργαλεία, υλικά και σχεδιαγράμματα — στα ελληνικά και στα αγγλικά.">
<meta property="og:image" content="icon-512.png">
<meta property="og:locale" content="el_GR">
<meta property="og:locale:alternate" content="en_GB">
<style>
:root{
  --bg:#F1F3F6;--bg2:#E7EAEF;--card:#FFFFFF;
  --pri:#0F5C8C;--pri2:#0B4870;--priS:rgba(15,92,140,.09);
  --acc:#E08A00;--accS:rgba(224,138,0,.12);
  --dgr:#C7362B;--dgrS:rgba(199,54,43,.09);
  --ok:#1B7A43;--okS:rgba(27,122,67,.10);
  --tx:#14181D;--tx2:#4A5560;--tx3:#8A96A3;
  --brd:#DFE4EA;--brd2:#C3CCD6;
  --sh:0 1px 3px rgba(20,24,29,.07),0 4px 14px rgba(20,24,29,.05);
  --shl:0 10px 46px rgba(20,24,29,.20);
  --r:14px;--rs:10px;--rx:8px;
  --hdr:#0F5C8C;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12161B;--bg2:#1A2027;--card:#1A2027;
    --pri:#4FA3D8;--pri2:#6DB6E4;--priS:rgba(79,163,216,.13);
    --acc:#F0A93A;--accS:rgba(240,169,58,.14);
    --dgr:#F0736A;--dgrS:rgba(240,115,106,.13);
    --ok:#4FBF80;--okS:rgba(79,191,128,.13);
    --tx:#E8EDF2;--tx2:#A9B5C2;--tx3:#78848F;
    --brd:#2A333D;--brd2:#3A4653;
    --sh:0 1px 3px rgba(0,0,0,.4);--shl:0 10px 46px rgba(0,0,0,.6);
    --hdr:#0C1E2C;
  }
}
:root[data-theme="dark"]{
  --bg:#12161B;--bg2:#1A2027;--card:#1A2027;
  --pri:#4FA3D8;--pri2:#6DB6E4;--priS:rgba(79,163,216,.13);
  --acc:#F0A93A;--accS:rgba(240,169,58,.14);
  --dgr:#F0736A;--dgrS:rgba(240,115,106,.13);
  --ok:#4FBF80;--okS:rgba(79,191,128,.13);
  --tx:#E8EDF2;--tx2:#A9B5C2;--tx3:#78848F;
  --brd:#2A333D;--brd2:#3A4653;
  --sh:0 1px 3px rgba(0,0,0,.4);--shl:0 10px 46px rgba(0,0,0,.6);
  --hdr:#0C1E2C;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden;scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100dvh;overflow-x:hidden;line-height:1.5}
.wrap{max-width:760px;margin:0 auto}
button,input{font-family:inherit}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:4px}

/* ---------- HEADER ---------- */
.hdr{background:var(--hdr);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 18px}
.hdr-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:.01em;flex:1;min-width:0}
.brand span:first-child{font-size:19px}
.brand span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icobtn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;border:none;cursor:pointer;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icobtn:hover{background:rgba(255,255,255,.24)}
.h-title{font-size:clamp(24px,6.5vw,33px);font-weight:800;line-height:1.12;letter-spacing:-.01em}
.h-sub{font-size:14px;opacity:.82;margin-top:7px;line-height:1.5}
.searchbox{margin-top:16px;position:relative}
.searchbox input{width:100%;padding:12px 40px 12px 40px;border-radius:11px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.12);color:#fff;font-size:15px;outline:none}
.searchbox input::placeholder{color:rgba(255,255,255,.6)}
.searchbox input:focus{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.18)}
.searchbox .s-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.75;pointer-events:none}
.searchbox .s-clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;border:none;cursor:pointer;font-size:12px;display:none}
.searchbox .s-clr.on{display:block}

/* ---------- CATEGORIES ---------- */
.catbar{display:flex;gap:8px;padding:14px 16px 6px;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 76%,transparent)}
.catbar::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 14px;border-radius:100px;border:1.5px solid var(--brd2);background:var(--card);color:var(--tx2);font-size:13.5px;font-weight:600;cursor:pointer;transition:background .15s,color .15s,border-color .15s;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip:hover{border-color:var(--pri);color:var(--pri)}
.chip.active{background:var(--pri);border-color:var(--pri);color:#fff}
.chip .cnt{font-size:11px;opacity:.7;font-weight:700}
.subbar{display:flex;gap:7px;padding:6px 16px 4px;overflow-x:auto;scrollbar-width:none;align-items:center}
.subbar::-webkit-scrollbar{display:none}
.mini{flex-shrink:0;padding:5px 11px;border-radius:7px;border:1px solid var(--brd);background:transparent;color:var(--tx3);font-size:12px;font-weight:600;cursor:pointer}
.mini.active{background:var(--accS);border-color:var(--acc);color:var(--acc)}
.resline{padding:8px 18px 2px;font-size:12px;color:var(--tx3);font-weight:600;letter-spacing:.02em}

/* ---------- GRID ---------- */
.grid{display:grid;grid-template-columns:1fr;gap:11px;padding:10px 16px 40px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:14px 15px;cursor:pointer;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s,border-color .15s;display:flex;flex-direction:column;gap:9px;text-align:left;width:100%}
.card:hover{transform:translateY(-2px);box-shadow:var(--shl);border-color:var(--brd2)}
.card:active{transform:translateY(0)}
.c-top{display:flex;gap:11px;align-items:flex-start}
.c-ico{width:42px;height:42px;border-radius:11px;background:var(--priS);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.c-hd{flex:1;min-width:0}
.c-name{font-size:16px;font-weight:750;color:var(--tx);line-height:1.25}
.c-cat{font-size:11.5px;color:var(--tx3);margin-top:3px;font-weight:600}
.c-fav{background:none;border:none;font-size:16px;cursor:pointer;padding:2px;opacity:.3;flex-shrink:0;line-height:1}
.c-fav.on{opacity:1}
.c-desc{font-size:13px;color:var(--tx2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--bg2);color:var(--tx2);border:1px solid var(--brd);white-space:nowrap}
.tag.d1{background:var(--okS);color:var(--ok);border-color:transparent}
.tag.d2{background:var(--accS);color:var(--acc);border-color:transparent}
.tag.d3{background:var(--dgrS);color:var(--dgr);border-color:transparent}
.tag.risk{background:var(--dgrS);color:var(--dgr);border-color:transparent}
.prog{height:3px;border-radius:3px;background:var(--brd);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}

.empty{padding:60px 30px;text-align:center;color:var(--tx3)}
.empty .e-ico{font-size:40px;margin-bottom:12px;opacity:.5}
.empty p{font-size:14px;line-height:1.6}

.foot{padding:22px 20px calc(34px + env(safe-area-inset-bottom));border-top:1px solid var(--brd);margin-top:10px}
.foot p{font-size:11.5px;color:var(--tx3);line-height:1.7;text-align:center}
.foot strong{color:var(--tx2)}

/* ---------- DETAIL VIEW ---------- */
.backdrop{position:fixed;inset:0;background:rgba(8,12,16,.55);z-index:100;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset:0;top:auto;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:760px;height:96dvh;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -8px 60px rgba(0,0,0,.3);z-index:101;display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.32,1.12,.6,1);overflow:hidden}
.sheet.open{transform:translateX(-50%) translateY(0)}
.sh-grab{width:38px;height:4px;border-radius:2px;background:var(--brd2);margin:9px auto 0;flex-shrink:0}
.sh-head{padding:10px 18px 0;flex-shrink:0;display:flex;gap:12px;align-items:flex-start}
.sh-head .sh-ico{width:44px;height:44px;border-radius:12px;background:var(--priS);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.sh-head h2{font-size:20px;font-weight:800;line-height:1.2;color:var(--tx)}
.sh-head .sh-c{font-size:12px;color:var(--tx3);margin-top:3px;font-weight:600}
.sh-x{width:32px;height:32px;border-radius:50%;background:var(--bg2);border:1px solid var(--brd);color:var(--tx2);font-size:15px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sh-x:hover{background:var(--brd)}
.tabs{display:flex;gap:2px;padding:12px 12px 0;border-bottom:1.5px solid var(--brd);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 12px;font-size:13px;font-weight:700;color:var(--tx3);background:none;border:none;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.tab.active{color:var(--pri);border-bottom-color:var(--pri)}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(40px + env(safe-area-inset-bottom));flex:1;overscroll-behavior:contain}

.blk{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:15px 16px;margin-bottom:12px}
.blk h4{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--tx3);font-weight:750;margin-bottom:10px}
.lead{font-size:14.5px;line-height:1.75;color:var(--tx2)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mit{background:var(--bg2);border-radius:var(--rs);padding:11px 12px;border:1px solid var(--brd)}
.mit label{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);display:block;margin-bottom:4px;font-weight:700}
.mit span{font-size:13.5px;font-weight:700;color:var(--tx);line-height:1.35;display:block}

.warn{background:var(--dgrS);border:1.5px solid var(--dgr);border-radius:var(--r);padding:14px 15px;margin-bottom:12px}
.warn h4{color:var(--dgr);margin-bottom:9px}
.warn ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.warn li{font-size:13.5px;color:var(--tx2);line-height:1.6;padding-left:22px;position:relative}
.warn li::before{content:'⚠';position:absolute;left:0;top:0;color:var(--dgr);font-size:13px}
.pro{background:var(--accS);border:1.5px solid var(--acc);border-radius:var(--r);padding:13px 15px;margin-bottom:12px}
.pro h4{color:var(--acc);margin-bottom:7px}
.pro p{font-size:13.5px;color:var(--tx2);line-height:1.65}

.klist{list-style:none;display:flex;flex-direction:column;gap:1px}
.klist li{font-size:13.5px;color:var(--tx2);line-height:1.6;padding:8px 0 8px 26px;position:relative;border-bottom:1px solid var(--brd)}
.klist li:last-child{border-bottom:none}
.klist li::before{content:'';position:absolute;left:7px;top:15px;width:6px;height:6px;border-radius:50%;background:var(--pri)}
.klist.tool li::before{content:'🔧';background:none;left:0;top:7px;width:auto;height:auto;font-size:13px}
.klist.mat li::before{content:'📦';background:none;left:0;top:7px;width:auto;height:auto;font-size:13px}
.klist.tip li::before{content:'💡';background:none;left:0;top:7px;width:auto;height:auto;font-size:13px}
.klist.err li::before{content:'✕';background:none;left:2px;top:7px;width:auto;height:auto;color:var(--dgr);font-weight:800;font-size:13px}

/* STEPS */
.pbar{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:13px 15px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.pbar .pb-t{flex:1}
.pbar .pb-n{font-size:13px;font-weight:750;color:var(--tx)}
.pbar .pb-l{height:5px;border-radius:5px;background:var(--brd);overflow:hidden;margin-top:7px}
.pbar .pb-l i{display:block;height:100%;background:var(--ok);border-radius:5px;transition:width .3s}
.pbar button{padding:7px 12px;border-radius:var(--rx);border:1px solid var(--brd2);background:var(--bg2);color:var(--tx2);font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0}
.pbar button:hover{border-color:var(--pri);color:var(--pri)}

.step{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:14px 15px;margin-bottom:10px;display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;transition:border-color .2s,opacity .2s}
.step.done{opacity:.62;border-color:var(--ok)}
.step-chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--brd2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;flex-shrink:0;margin-top:1px;font-weight:800}
.step.done .step-chk{background:var(--ok);border-color:var(--ok);color:#fff}
.step-n{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--pri);font-weight:800;margin-bottom:4px}
.step-t{font-size:15px;font-weight:750;color:var(--tx);line-height:1.35;margin-bottom:6px}
.step.done .step-t{text-decoration:line-through;text-decoration-color:var(--tx3)}
.step-d{font-size:13.5px;color:var(--tx2);line-height:1.7}
.step-tip{margin-top:9px;font-size:12.5px;color:var(--tx2);background:var(--accS);border-left:3px solid var(--acc);border-radius:0 var(--rx) var(--rx) 0;padding:8px 11px;line-height:1.6}
.step-tip b{color:var(--acc)}
.step-w{margin-top:9px;font-size:12.5px;color:var(--tx2);background:var(--dgrS);border-left:3px solid var(--dgr);border-radius:0 var(--rx) var(--rx) 0;padding:8px 11px;line-height:1.6}
.step-w b{color:var(--dgr)}

/* DIAGRAM */
.diag{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:14px;margin-bottom:12px;overflow-x:auto}
.diag svg{display:block;width:100%;height:auto;max-width:100%;min-width:300px}
.dg-bg{fill:var(--bg2)}.dg-cd{fill:var(--card)}
.dg-l{stroke:var(--brd2);stroke-width:1.6;fill:none}
.dg-s{stroke:var(--pri);stroke-width:2;fill:none}
.dg-f{fill:var(--priS);stroke:var(--pri);stroke-width:1.6}
.dg-a{fill:var(--accS);stroke:var(--acc);stroke-width:1.6}
.dg-r{fill:var(--dgrS);stroke:var(--dgr);stroke-width:1.6}
.dg-g{fill:var(--okS);stroke:var(--ok);stroke-width:1.6}
.dg-t{fill:var(--tx2);font-size:11px;font-weight:600;font-family:-apple-system,sans-serif}
.dg-tb{fill:var(--tx);font-size:12px;font-weight:750;font-family:-apple-system,sans-serif}
.dg-num{fill:var(--pri);font-size:11px;font-weight:800;font-family:-apple-system,sans-serif}
.dg-cir{fill:var(--card);stroke:var(--pri);stroke-width:1.8}
.dg-ar{stroke:var(--acc);stroke-width:2;fill:none;marker-end:url(#ah)}
.legend{list-style:none;display:flex;flex-direction:column;gap:7px;margin-top:12px;padding-top:12px;border-top:1px solid var(--brd)}
.legend li{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--tx2);line-height:1.55}
.legend .ln{width:19px;height:19px;border-radius:50%;background:var(--priS);color:var(--pri);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}

/* VIDEO */
.vid{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:14px 15px;text-decoration:none;margin-bottom:10px;transition:border-color .15s,transform .15s}
.vid:hover{border-color:var(--pri);transform:translateY(-1px)}
.vid .v-ico{width:40px;height:40px;border-radius:10px;background:var(--dgrS);color:var(--dgr);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.vid .v-t{font-size:14px;font-weight:750;color:var(--tx);line-height:1.3}
.vid .v-s{font-size:12px;color:var(--tx3);margin-top:2px;line-height:1.4}
.vid .v-go{margin-left:auto;color:var(--tx3);font-size:16px;flex-shrink:0}
.note{font-size:12px;color:var(--tx3);line-height:1.65;padding:0 4px 8px}

.faq{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.faq summary{padding:13px 15px;font-size:14px;font-weight:700;color:var(--tx);cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:'?';width:20px;height:20px;border-radius:50%;background:var(--priS);color:var(--pri);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.faq[open] summary{border-bottom:1px solid var(--brd)}
.faq p{padding:12px 15px 14px;font-size:13.5px;color:var(--tx2);line-height:1.7}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:100px;font-size:13.5px;font-weight:650;z-index:200;opacity:0;transition:transform .3s,opacity .3s;pointer-events:none;box-shadow:var(--shl);max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 z" fill="var(--acc)"/></marker></defs>
</svg>
<div class="wrap">
  <header class="hdr">
    <div class="hdr-top">
      <div class="brand"><span>🛠️</span><span id="brandName">Φτιάξ' το μόνος σου</span></div>
      <button class="icobtn" id="themeBtn" title="Θέμα"><svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
      <button class="icobtn" id="langBtn">EN</button>
    </div>
    <h1 class="h-title" id="hTitle"></h1>
    <p class="h-sub" id="hSub"></p>
    <div class="searchbox">
      <span class="s-ico">🔍</span>
      <input id="q" type="search" autocomplete="off" spellcheck="false">
      <button class="s-clr" id="qClr">✕</button>

{

 tools:['Δράπανο (κρουστική λειτουργία για μπετόν/τούβλο)','Τρυπάνια μπετού και ξύλου','Ανιχνευτής καλωδίων/μετάλλων','Αλφάδι','Μέτρο και μολύβι','Σφυρί μικρό','Ηλεκτρική σκούπα'],

 steps:[
  {t:'Κατάλαβε τι τοίχο έχεις', t_en:'Identify your wall',
   d:'Χτύπα τον τοίχο με τον κόμπο του δαχτύλου. Βαρύς και συμπαγής ήχος = μπετόν ή συμπαγές τούβλο. Κούφιος «ταμ-ταμ» ήχος = γυψοσανίδα ή κούφιο τούβλο. Τρύπησε 1 cm δοκιμαστικά: γκρι σκόνη = μπετόν, κόκκινη = τούβλο, λευκή σαν κιμωλία = γυψοσανίδα.',
   d_en:'Knock on the wall with a knuckle. A heavy, solid sound means concrete or solid brick. A hollow drum sound means plasterboard or hollow brick. Drill 1 cm as a test: grey dust = concrete, red = brick, chalky white = plasterboard.'},
  {t:'Διάλεξε βύσμα και βίδα', t_en:'Choose plug and screw',
   d:'Μπετόν/τούβλο: νάιλον βύσμα. Για κάδρο ή μικρό ράφι 6 mm, για ντουλάπι ή τηλεόραση 8–10 mm. Γυψοσανίδα: ΠΟΤΕ απλό νάιλον βύσμα — χρησιμοποίησε αυτοδιάτρητο μεταλλικό (έως 10 kg) ή πεταλούδα/molly (έως 25 kg). Ιδανικά, βίδωσε στον μεταλλικό ορθοστάτη πίσω από τη γυψοσανίδα.',
   d_en:'Concrete/brick: nylon plug. 6 mm for a picture or small shelf, 8–10 mm for a cabinet or TV. Plasterboard: NEVER a plain nylon plug — use a self-drill metal fixing (up to 10 kg) or a toggle/molly bolt (up to 25 kg). Best of all, screw into the metal stud behind the board.',
   tip:'Κανόνας μήκους βίδας: πάχος αντικειμένου + μήκος βύσματος + 10 mm. Πολύ κοντή βίδα δεν ανοίγει το βύσμα και δεν κρατά τίποτα.',
   tip_en:'Screw length rule: thickness of the item + length of the plug + 10 mm. A screw that is too short never expands the plug and holds nothing.'},
  {t:'Σημάδεψε και αλφάδιασε', t_en:'Mark and level',
   d:'Μέτρησε, σημάδεψε με μολύβι, βάλε το αλφάδι και τράβα γραμμή. Για δύο ή περισσότερες τρύπες, σημάδεψε πρώτα όλες και έλεγξε ξανά — μία λάθος τρύπα σημαίνει στοκάρισμα και βάψιμο.',
   d_en:'Measure, mark with a pencil, set the level and draw a line. For two or more holes, mark them all first and check again — one wrong hole means filling and repainting.'},
  {t:'Τρύπησε σωστά', t_en:'Drill it properly',
   d:'Τρυπάνι ίδιας διαμέτρου με το βύσμα (βύσμα 8 → τρυπάνι 8). Κράτα το δράπανο κάθετα στον τοίχο. Σε μπετόν βάλε κρουστική λειτουργία, σε γυψοσανίδα ή πλακάκι ΟΧΙ κρουστική. Τρύπησε 5–10 mm βαθύτερα από το βύσμα.',
   d_en:'Use a bit the same diameter as the plug (8 mm plug → 8 mm bit). Hold the drill square to the wall. Use hammer mode on concrete, but NOT on plasterboard or tiles. Drill 5–10 mm deeper than the plug.',
   warn:'Σε πλακάκι: κόλλησε χαρτοταινία στο σημείο, ξεκίνα χωρίς κρούση και με χαμηλές στροφές, αλλιώς το τρυπάνι γλιστρά και το πλακάκι ραγίζει.',
   warn_en:'On tiles: stick masking tape on the spot, start without hammer mode and at low speed, otherwise the bit skates and the tile cracks.'},
  {t:'Καθάρισε την τρύπα', t_en:'Clean the hole',
   d:'Αυτό το βήμα το παραλείπουν όλοι και είναι ο λόγος που το βύσμα γυρίζει. Βάλε τη σκούπα στην τρύπα ή φύσα τη σκόνη έξω. Σκόνη μέσα = το βύσμα δεν πιάνει στα τοιχώματα.',
   d_en:'Everyone skips this step and it is why the plug spins. Put the vacuum nozzle in the hole or blow the dust out. Dust inside means the plug never grips the walls of the hole.'},
  {t:'Βάλε το βύσμα και βίδωσε', t_en:'Insert the plug and screw',
   d:'Σπρώξε το βύσμα με το χέρι· αν αντιστέκεται, δώσε ελαφρά χτυπήματα με το σφυρί μέχρι να μπει πρόσωπο με τον τοίχο. Βίδωσε μέχρι να σφίξει — και σταμάτα. Παραπάνω σφίξιμο σκίζει το βύσμα.',
   d_en:'Push the plug in by hand; if it resists, tap it gently with the hammer until it is flush with the wall. Screw until it tightens — then stop. Over-tightening tears the plug out.'},
  {t:'Έλεγξε το φορτίο', t_en:'Test the load',
   d:'Πριν βάλεις βάρος, τράβα δυνατά με το χέρι προς τα έξω και προς τα κάτω. Αν κουνιέται καθόλου, βγάλ’ το, γέμισε την τρύπα με χημικό βύσμα ή στόκο και ξανακάν’ το 3 cm δίπλα.',
   d_en:'Before loading it, pull hard outwards and downwards by hand. If it moves at all, take it out, fill the hole with chemical anchor or filler and redo it 3 cm to the side.'}],
 tips:['Αν το βύσμα γυρίζει στο κενό (κούφιο τούβλο), βγάλ’ το, γέμισε την τρύπα με χημικό βύσμα ή κόλλα δύο συστατικών και ξαναβάλε το βύσμα πριν στεγνώσει.',
       'Για τηλεόραση σε γυψοσανίδα, βρες οπωσδήποτε τους μεταλλικούς ορθοστάτες με μαγνήτη ή ανιχνευτή. Καμία πεταλούδα δεν σηκώνει τηλεόραση με μπράτσο με ασφάλεια.',

       a:'Σωστά τοποθετημένο, ένα νάιλον βύσμα 8 mm σε μπετόν κρατά άνετα 40–60 kg σε διάτμηση (βάρος που κρέμεται). Το πρόβλημα δεν είναι ποτέ το βύσμα, αλλά η καθαριότητα της τρύπας και το σωστό μήκος βίδας.',
       a_en:'Fitted correctly, an 8 mm nylon plug in concrete comfortably holds 40–60 kg in shear (hanging load). The plug is never the problem — a dirty hole and the wrong screw length are.'},
      {q:'Πώς βρίσκω τον ορθοστάτη πίσω από τη γυψοσανίδα;', q_en:'How do I find the stud behind plasterboard?',
       a:'Πέρνα έναν δυνατό μαγνήτη αργά πάνω στον τοίχο: θα κολλήσει πάνω στις βίδες που συγκρατούν τη γυψοσανίδα στον μεταλλικό ορθοστάτη. Δύο-τρεις βίδες στην ίδια κατακόρυφο σου δίνουν τη θέση του ορθοστάτη.',
       a_en:'Slide a strong magnet slowly across the wall: it will stick over the screws holding the board to the metal stud. Two or three screws on the same vertical line give you the stud position.'}],

 tools:['Ψαλίδι λαμαρίνας','Δράπανο/κατσαβίδι με stop βάθους','Κοπίδι με σπαστές λάμες','Αλφάδι 1,2 m και νήμα στάθμης','Μέτρο, μολύβι, χάρακας 1 m','Πριόνι γυψοσανίδας (για πρίζες)','Ποτηροτρύπανο 68 mm'],
 tools_en:['Tin snips','Drill/driver with depth stop','Snap-off blade knife','1.2 m level and chalk line','Tape measure, pencil, 1 m straight edge','Drywall saw (for socket cut-outs)','68 mm hole saw'],
 mats:['Γυψοσανίδες 12,5 mm (πράσινη ανθυγρή σε μπάνιο/κουζίνα)','Οδηγοί U (στράντζα) 50/75 mm','Ορθοστάτες C 50/75 mm','Λαμαρινόβιδες γυψοσανίδας 25 mm & 3,5 mm','Βύσματα και βίδες για δάπεδο/οροφή','Ηχομονωτική ταινία για κάτω από τους οδηγούς','Πετροβάμβακας 50 mm (ηχομόνωση)'],
 mats_en:['12.5 mm plasterboard (green moisture-resistant in bathroom/kitchen)','U track 50/75 mm','C studs 50/75 mm','25 mm drywall screws','Plugs and screws for floor/ceiling','Acoustic tape under the tracks','50 mm mineral wool (sound insulation)'],
 steps:[
  {t:'Χάραξε τη θέση του τοίχου', t_en:'Set out the wall',
   d:'Σημάδεψε τη γραμμή στο δάπεδο με νήμα στάθμης. Με αλφάδι ή λέιζερ μετέφερε την ίδια γραμμή στην οροφή. Έλεγξε ότι είναι κάθετη στους υπάρχοντες τοίχους μετρώντας τις διαγώνιες.',
   d_en:'Snap the line on the floor with a chalk line. Transfer the same line to the ceiling with a level or laser. Check it is square to the existing walls by measuring the diagonals.',
   tip:'Λάθος 1 cm στη χάραξη γίνεται 3 cm λάθος στην άλλη άκρη του τοίχου. Μέτρα δύο φορές.',
   tip_en:'A 1 cm setting-out error becomes 3 cm at the far end of the wall. Measure twice.'},
  {t:'Στερέωσε τους οδηγούς U', t_en:'Fix the U tracks',
   d:'Κόλλησε ηχομονωτική ταινία στην πλάτη του οδηγού και βίδωσε τον κάτω οδηγό στο δάπεδο κάθε 60 cm με βύσματα. Ίδια δουλειά στην οροφή. Οι δύο οδηγοί πρέπει να είναι ακριβώς ο ένας πάνω από τον άλλον.',
   d_en:'Stick acoustic tape to the back of the track and fix the bottom track to the floor every 60 cm with plugs. Same on the ceiling. The two tracks must sit exactly one above the other.'},
  {t:'Τοποθέτησε τους ορθοστάτες', t_en:'Place the studs',
   d:'Κόψε τους ορθοστάτες C 1 cm κοντύτερους από το καθαρό ύψος, ώστε να μπαίνουν με άνεση. Πέρασέ τους μέσα στους οδηγούς ανά 60 cm από άξονα σε άξονα (ανά 40 cm αν θα κρεμάσεις βάρη ή θα βάλεις πλακάκια). Αλφάδιασε κάθε ορθοστάτη.',
   d_en:'Cut the C studs 1 cm shorter than the clear height so they slot in easily. Slide them into the tracks every 60 cm centre to centre (every 40 cm if you will hang loads or tile). Plumb every stud.',
   tip:'Οι ορθοστάτες μπαίνουν όλοι με το άνοιγμα προς την ίδια κατεύθυνση — έτσι βιδώνεις πάντα στην ίδια πλευρά.',
   tip_en:'Set all studs with the open side facing the same way — that way you always screw into the same flange.'},
  {t:'Πέρνα σωληνώσεις και καλώδια', t_en:'Run pipes and cables',
   d:'Τώρα, πριν κλείσεις. Πέρνα τα ηλεκτρικά μέσα σε σπιράλ από τις έτοιμες τρύπες των ορθοστατών και στερέωσε τα κουτιά διακλάδωσης. Άφησε 20 cm περίσσευμα καλωδίου σε κάθε σημείο πρίζας.',
   d_en:'Now, before closing up. Run the electrics in conduit through the pre-punched holes in the studs and fix the back boxes. Leave 20 cm of spare cable at each socket point.',
   warn:'Τα καλώδια περνούν πάντα μέσα σε σπιράλ ή σωλήνα, ποτέ γυμνά ακουμπισμένα στη λαμαρίνα.',
   warn_en:'Cables always run inside conduit, never bare against the sheet metal.'},
  {t:'Κόψε τις γυψοσανίδες', t_en:'Cut the boards',
   d:'Χάραξε με το κοπίδι στη χαρτονένια όψη πατώντας τον χάρακα, «σπάσε» τη σανίδα με το γόνατο και κόψε το πίσω χαρτόνι. Κόψε τη σανίδα 1 cm κοντύτερη από το ύψος και ακούμπησέ τη στην οροφή — το κενό μένει κάτω.',
   d_en:'Score the paper face with the knife against a straight edge, snap the board over your knee and cut the back paper. Cut it 1 cm short of the height and push it up to the ceiling — the gap stays at the bottom.'},
  {t:'Βίδωσε τις σανίδες', t_en:'Screw the boards on',
   d:'Βίδες ανά 25 cm στη μέση της σανίδας και ανά 20 cm στις άκρες, τουλάχιστον 1 cm από το άκρο. Η κεφαλή πρέπει να «βουλιάξει» 0,5 mm μέσα στο χαρτόνι χωρίς να το σκίσει — γι’ αυτό χρειάζεσαι stop βάθους.',
   d_en:'Screws every 25 cm in the field and every 20 cm at the edges, at least 1 cm in from the edge. The head must dimple 0.5 mm into the paper without tearing it — that is what the depth stop is for.',
   tip:'Οι κατακόρυφοι αρμοί δύο διαδοχικών σανίδων δεν πρέπει να πέφτουν στον ίδιο ορθοστάτη με την απέναντι πλευρά — μετατόπισέ τους.',
   tip_en:'Vertical joints on one side must not land on the same stud as those on the other side — stagger them.'},
  {t:'Άνοιξε τις τρύπες για πρίζες', t_en:'Cut the socket holes',
   d:'Μέτρησε τη θέση του κουτιού από δύο σταθερά σημεία, μετάφερέ την στη σανίδα και άνοιξε με ποτηροτρύπανο 68 mm. Κάν’ το πριν βιδώσεις τελείως τη σανίδα, ώστε να μπορείς να τη διορθώσεις.',
   d_en:'Measure the box position from two fixed points, transfer it to the board and cut with a 68 mm hole saw. Do it before fully screwing the board, so you can still adjust.'},
  {t:'Γέμισε με πετροβάμβακα', t_en:'Fill with mineral wool',
   d:'Πριν κλείσεις τη δεύτερη πλευρά, γέμισε τα κενά με πετροβάμβακα. Χωρίς αυτόν ο τοίχος γίνεται τύμπανο και ακούγεται τα πάντα. Με 50 mm πετροβάμβακα κερδίζεις περίπου 8–10 dB.',
   d_en:'Before closing the second side, fill the cavity with mineral wool. Without it the wall becomes a drum and you hear everything. 50 mm of wool gains roughly 8–10 dB.'},
  {t:'Κλείσε τη δεύτερη πλευρά', t_en:'Close the second side',
   d:'Ίδια διαδικασία. Στο τέλος έλεγξε με το αλφάδι όλη την επιφάνεια για «κοιλιές» και σφίξε ή πρόσθεσε βίδες όπου χρειάζεται. Ο τοίχος είναι έτοιμος για αρμολόγηση.',
   d_en:'Same process. At the end run the level over the whole surface looking for bellies and add or tighten screws where needed. The wall is ready for jointing.'}],
 tips:['Σε μπάνιο και κουζίνα χρησιμοποίησε πράσινη ανθυγρή γυψοσανίδα, και τσιμεντοσανίδα εκεί που θα πέφτει άμεσα νερό (ντουζιέρα).',
       'Για διπλή επένδυση (καλύτερη ηχομόνωση και αντοχή), η δεύτερη στρώση μπαίνει με τους αρμούς μετατοπισμένους κατά μισή σανίδα.',
       'Κράτα τα κομμάτια που περισσεύουν — είναι ιδανικά για μπαλώματα.',
       'Αν ο τοίχος θα δεχτεί ντουλάπια κουζίνας ή τηλεόραση, βίδωσε ένα ξύλο 2 cm ανάμεσα στους ορθοστάτες στο σωστό ύψος, πριν κλείσεις.'],
 tips_en:['In bathrooms and kitchens use green moisture-resistant board, and cement board where water hits directly (shower).',
          'For a double layer (better sound and impact resistance), offset the second layer’s joints by half a board.',
          'Keep the offcuts — they are perfect for patches.',
          'If the wall will carry kitchen units or a TV, screw a 2 cm timber noggin between the studs at the right height before closing up.'],
 errs:['Σανίδα ακουμπισμένη στο δάπεδο: ρουφά υγρασία και φουσκώνει. Άφησε 1 cm κενό κάτω.',
       'Πολύ σφιγμένες βίδες που σκίζουν το χαρτόνι — δεν κρατούν τίποτα, είναι σαν να μην υπάρχουν.',
       'Ορθοστάτες ανά 80–90 cm για οικονομία: ο τοίχος «παίζει» και οι αρμοί ραγίζουν σε έναν χρόνο.',
       'Παράλειψη πετροβάμβακα — αδύνατον να διορθωθεί μετά χωρίς να ανοίξεις τον τοίχο.'],
 errs_en:['Board resting on the floor: it wicks moisture and swells. Leave a 1 cm gap at the bottom.',

          'Studs at 80–90 cm to save money: the wall flexes and the joints crack within a year.',
          'Skipping the wool — impossible to fix later without opening the wall.'],
 faq:[{q:'60 cm ή 40 cm απόσταση ορθοστατών;', q_en:'Studs at 60 cm or 40 cm?',
       a:'60 cm για συνηθισμένο χώρισμα. 40 cm όταν θα βάλεις πλακάκια, θα κρεμάσεις ντουλάπια ή ο τοίχος είναι ψηλότερος από 3 m. Η διαφορά κόστους είναι μικρή, η διαφορά στιβαρότητας τεράστια.',
       a_en:'60 cm for a normal partition. 40 cm when you will tile, hang cabinets, or the wall is over 3 m tall. The cost difference is small, the rigidity difference is huge.'},
      {q:'Μπορώ να κρεμάσω τηλεόραση σε γυψοσανίδα;', q_en:'Can I hang a TV on plasterboard?',
       a:'Ναι, αλλά μόνο πάνω στους μεταλλικούς ορθοστάτες ή σε ξύλινο τραβέρσο που έχεις βάλει πριν κλείσεις τον τοίχο. Ποτέ μόνο με βύσματα γυψοσανίδας για τηλεόραση με κινητή βάση.',
       a_en:'Yes, but only into the metal studs or a timber noggin fitted before closing the wall. Never on board fixings alone for a TV on an articulating arm.'}],

{
 id:'drywall-joints', cat:'wall', ico:'🩹', diff:2, risk:false,

 d_en:'The step that decides whether the wall looks professional or amateur. Patience across three coats.',

 tools_en:['10 cm and 25–30 cm putty knives','Stainless steel finishing trowel','Mixing bucket','Sanding block with mesh or sponge','LED torch (raking light)','Paddle mixer for the drill'],
 mats:['Στόκος αρμολόγησης σε σκόνη (πρώτη στρώση)','Έτοιμος στόκος φινιρίσματος (τελικές στρώσεις)','Ταινία αρμού: χάρτινη ή fibreglass αυτοκόλλητη','Γωνιόκρανα για εξωτερικές γωνίες','Γυαλόχαρτο 120 και 180'],
 mats_en:['Powder jointing compound (first coat)','Ready-mixed finishing compound (top coats)','Joint tape: paper or self-adhesive fibreglass','Corner beads for external corners','120 and 180 grit sandpaper'],
 steps:[
  {t:'Έλεγξε τις βίδες', t_en:'Check the screws',
   d:'Πέρνα τη σπάτουλα πάνω σε κάθε σειρά βιδών. Αν χτυπά κάπου, η βίδα προεξέχει — σφίξε την λίγο ακόμη. Καμία κεφαλή δεν πρέπει να είναι πάνω από την επιφάνεια.',
   d_en:'Run the knife over every row of screws. If it clicks anywhere, that screw is proud — drive it slightly deeper. No head may sit above the surface.'},
  {t:'Πρώτη στρώση στους αρμούς', t_en:'First coat on the joints',
   d:'Ανακάτεψε στόκο σκόνης σε πυκνότητα γιαουρτιού. Γέμισε τον αρμό ανάμεσα στις δύο σανίδες με τη μικρή σπάτουλα, πιέζοντας τον στόκο μέσα στην εσοχή.',
   d_en:'Mix powder compound to the consistency of yoghurt. Fill the recess between the two boards with the small knife, pressing the compound into the taper.'},
  {t:'Βάλε την ταινία', t_en:'Bed the tape',
   d:'Ακούμπησε την ταινία στον φρέσκο στόκο και πέρασε τη σπάτουλα από πάνω με γωνία 30°, πιέζοντας από το κέντρο προς τα άκρα. Ο στόκος πρέπει να βγει από κάτω· αν μείνει αέρας, η ταινία θα φουσκώσει και θα ξεκολλήσει.',
   d_en:'Lay the tape into the wet compound and pull the knife over it at 30°, pressing from the centre outwards. Compound must squeeze out from underneath; trapped air means the tape will bubble and lift.',
   tip:'Χάρτινη ταινία = πιο δυνατός αρμός, αλλά θέλει τεχνική. Fibreglass αυτοκόλλητη = πιο εύκολη για αρχάριο, κόλλησέ την πρώτα και στοκάρισε από πάνω.',
   tip_en:'Paper tape gives the stronger joint but needs technique. Self-adhesive fibreglass is easier for a beginner: stick it first, then coat over it.'},
  {t:'Κάλυψε βίδες και γωνίες', t_en:'Cover screws and corners',
   d:'Με την ίδια στρώση, πέρασε στόκο πάνω σε κάθε κεφαλή βίδας με δύο σταυρωτές κινήσεις. Στις εξωτερικές γωνίες τοποθέτησε γωνιόκρανο και κάλυψέ το.',
   d_en:'With the same coat, cover every screw head with two crossing strokes. On external corners fit a corner bead and coat over it.'},
  {t:'Άφησε να στεγνώσει τελείως', t_en:'Let it dry completely',
   d:'12–24 ώρες ανάλογα με θερμοκρασία και υγρασία. Ο στόκος είναι έτοιμος όταν έχει γίνει ομοιόμορφα λευκός, χωρίς γκρίζες υγρές κηλίδες. Μη βιαστείς — στόκος πάνω σε υγρό στόκο ραγίζει.',
   d_en:'12–24 hours depending on temperature and humidity. It is ready when it has turned uniformly white with no grey damp patches. Do not rush — compound over damp compound cracks.'},
  {t:'Δεύτερη στρώση, πιο φαρδιά', t_en:'Second coat, wider',
   d:'Με τη μεγάλη σπάτουλα, άπλωσε λεπτή στρώση 20–25 cm πλάτος, κεντραρισμένη στον αρμό. Στόχος: να «σβήσει» ο αρμός σταδιακά στον τοίχο, όχι να τον γεμίσεις.',
   d_en:'With the wide knife spread a thin coat 20–25 cm wide, centred on the joint. The aim is to feather the joint gradually into the wall, not to fill it.'},
  {t:'Τρίτη στρώση, ακόμη πιο φαρδιά', t_en:'Third coat, wider still',
   d:'Μετά το στέγνωμα, ελαφρύ τρίψιμο και τελευταία στρώση 30–35 cm πλάτος, όσο πιο λεπτή γίνεται. Εδώ κρίνεται το αποτέλεσμα.',
   d_en:'After drying, sand lightly and apply the last coat 30–35 cm wide, as thin as you can. This is where the result is decided.'},
  {t:'Τρίψιμο με πλάγιο φως', t_en:'Sand with raking light',
   d:'Τρίψε με γυαλόχαρτο 180 ή πλέγμα, με κυκλικές κινήσεις και ελαφριά πίεση. Βάλε έναν φακό σχεδόν παράλληλα στον τοίχο: οι σκιές δείχνουν κάθε ατέλεια που το κανονικό φως κρύβει.',
   d_en:'Sand with 180 grit or mesh, circular motions and light pressure. Hold a torch almost parallel to the wall: the shadows reveal every flaw that normal light hides.',
   tip:'Μην τρίβεις μέχρι να φανεί το χαρτόνι της γυψοσανίδας — «ξεφτίζει» και φαίνεται μετά το βάψιμο.',
   tip_en:'Do not sand into the board’s paper face — it fuzzes up and shows through the paint.'},
  {t:'Αστάρι πριν τη μπογιά', t_en:'Prime before painting',
   d:'Οι στοκαρισμένες περιοχές ρουφούν διαφορετικά από τη γυψοσανίδα. Χωρίς αστάρι, μετά το βάψιμο φαίνονται όλοι οι αρμοί σαν σκιές. Ένα χέρι αστάρι γυψοσανίδας λύνει το θέμα.',
   d_en:'Filled areas absorb differently from the board. Without primer, every joint shows as a shadow after painting. One coat of drywall primer solves it.'}],
 tips:['Καθάρισε τη σπάτουλα μετά από κάθε πέρασμα. Ένας ξερός κόκκος στη λάμα χαράζει όλη τη στρώση.',

       a_en:'Paper is clearly more crack-resistant and is the right choice for internal corners. Fibreglass is forgiving for a beginner on flat joints. In corners always use paper.'}],

{
 id:'wall-hole', cat:'wall', ico:'🕳️', diff:1, risk:false,
 n:'Επισκευή τρύπας σε τοίχο', n_en:'Repairing a hole in a wall',
 d:'Από τη μικρή τρύπα του καρφιού μέχρι την τρύπα πόμολου στη γυψοσανίδα — κάθε μέγεθος έχει τη δική του λύση.',
 d_en:'From a nail hole to a doorknob hole in plasterboard — each size has its own fix.',

 safety:['Πριν ανοίξεις μεγάλη τρύπα σε γυψοσανίδα, βεβαιώσου ότι δεν υπάρχει καλώδιο ή σωλήνας πίσω.'],
 safety_en:['Before opening a large hole in plasterboard, make sure there is no cable or pipe behind it.'],
 tools:['Σπάτουλες 6 και 12 cm','Κοπίδι','Πριόνι γυψοσανίδας','Γυαλόχαρτο 120/180','Πινέλο μικρό','Σφουγγάρι'],
 tools_en:['6 cm and 12 cm putty knives','Utility knife','Drywall saw','120/180 grit sandpaper','Small brush','Sponge'],
 mats:['Έτοιμος στόκος σπατουλαρίσματος','Κομμάτι γυψοσανίδας (για μεγάλες τρύπες)','Ξυλάκι ή πηχάκι για στήριγμα','Βίδες γυψοσανίδας 25 mm','Ταινία αρμού','Αστάρι και μπογιά ίδιου χρώματος'],
 mats_en:['Ready-mixed filler','Offcut of plasterboard (for large holes)','A timber batten as backing','25 mm drywall screws','Joint tape','Primer and matching paint'],
 steps:[
  {t:'Καθάρισε την τρύπα', t_en:'Clean the hole',
   d:'Αφαίρεσε ό,τι είναι χαλαρό γύρω-γύρω με το κοπίδι. Ο στόκος δεν κολλά πάνω σε σαθρό υλικό — αν το αφήσεις, το μπάλωμα θα σκάσει σε λίγους μήνες.',
   d_en:'Cut away anything loose around the edges with the knife. Filler does not bond to crumbling material — leave it and the patch will pop out in a few months.'},
  {t:'Μικρή τρύπα (έως 1 cm)', t_en:'Small hole (up to 1 cm)',
   d:'Πίεσε στόκο μέσα με τη σπάτουλα, γεμίζοντας υπερβολικά, και πέρασε ίσια. Θα «καθίσει» στεγνώνοντας, οπότε μια δεύτερη λεπτή στρώση είναι σχεδόν πάντα απαραίτητη.',
   d_en:'Press filler in with the knife, slightly overfilling, and scrape flat. It shrinks as it dries, so a second thin coat is nearly always needed.'},
  {t:'Μεσαία τρύπα (1–8 cm)', t_en:'Medium hole (1–8 cm)',
   d:'Κόλλησε αυτοκόλλητο μεταλλικό πλέγμα μπαλώματος πάνω από την τρύπα και πέρασε τρεις λεπτές στρώσεις στόκου, κάθε μία πιο φαρδιά από την προηγούμενη.',
   d_en:'Stick a self-adhesive mesh patch over the hole and apply three thin coats of filler, each wider than the last.'},
  {t:'Μεγάλη τρύπα: κόψε τετράγωνο', t_en:'Large hole: cut it square',
   d:'Χάραξε ένα κανονικό τετράγωνο ή ορθογώνιο γύρω από τη ζημιά και κόψε το με το πριόνι. Οι ίσιες γραμμές μπαλώνονται πολύ πιο εύκολα από τα σπασμένα άκρα.',
   d_en:'Draw a proper square or rectangle around the damage and cut it out with the saw. Straight lines patch far more easily than ragged edges.'},
  {t:'Βάλε στήριγμα πίσω', t_en:'Fit a backing batten',
   d:'Πέρασε ένα ξυλάκι 5 cm πιο μακρύ από την τρύπα μέσα από το άνοιγμα, κράτα το και βίδωσέ το στη γυψοσανίδα από τις δύο πλευρές. Αυτό είναι το «πάτημα» για το μπάλωμα.',
   d_en:'Slide a batten 5 cm longer than the hole through the opening, hold it and screw it to the board on both sides. That is what the patch will sit on.'},
  {t:'Κόψε και βίδωσε το μπάλωμα', t_en:'Cut and fix the patch',

  {t:'Τρίψε, αστάρωσε, βάψε', t_en:'Sand, prime, paint',

  {t:'Στοκάρισε και τρίψε', t_en:'Fill and sand',
   d:'Γέμισε τρύπες και ρωγμές, άφησε να στεγνώσει, τρίψε ίσια. Τρίψε ελαφρά και όλη την επιφάνεια αν η παλιά μπογιά είναι γυαλιστερή. Ξεσκόνισε στο τέλος.',
   d_en:'Fill holes and cracks, let them dry, sand flat. Lightly abrade the whole surface too if the old paint is glossy. Dust off afterwards.'},
  {t:'Κόλλησε χαρτοταινία', t_en:'Mask up',
   d:'Ταινία σε σοβατεπί, κάσες, γωνίες με άλλο χρώμα. Πίεσε καλά την άκρη με τη σπάτουλα ώστε να μη ρέει η μπογιά από κάτω.',
   d_en:'Tape skirtings, door casings and any edge meeting a different colour. Press the edge down firmly with a knife so paint cannot bleed under it.',
   tip:'Τράβα την ταινία όσο η μπογιά είναι ακόμη ελαφρά νωπή, με γωνία 45°. Αν στεγνώσει τελείως, ξεκολλά και τη μπογιά μαζί της.',
   tip_en:'Pull the tape while the paint is still slightly damp, at 45°. If it dries fully, it lifts the paint with it.'},
  {t:'Αστάρωσε όπου χρειάζεται', t_en:'Prime where needed',
   d:'Αστάρι σε: νέο σοβά ή γυψοσανίδα, στοκαρισμένα σημεία, λεκέδες υγρασίας ή καπνού, και όταν περνάς από σκούρο σε ανοιχτό χρώμα. Το αστάρι κοστίζει λιγότερο από ένα τρίτο χέρι μπογιάς.',
   d_en:'Prime: new plaster or board, filled areas, damp or smoke stains, and whenever going from a dark to a light colour. Primer costs less than a third coat of paint.'},
  {t:'Πέρνα τις γωνίες με πινέλο', t_en:'Cut in with the brush',
   d:'Με το λοξό πινέλο βάψε λωρίδα 5–7 cm σε όλες τις γωνίες, γύρω από κάσες, σοβατεπί και οροφή. Βούτα μόνο το 1/3 της τρίχας και σκούπισε την περίσσεια.',
   d_en:'With the angled brush lay a 5–7 cm band along every corner, around casings, skirtings and the ceiling. Load only the bottom third of the bristles and wipe off the excess.'},
  {t:'Ρολό σε σχήμα W', t_en:'Roll in a W pattern',
   d:'Βούτα το ρολό και κύλησέ το στη σχάρα. Ξεκίνα με ένα μεγάλο «W» ή «M» ύψους 1 m και μετά γέμισέ το με κατακόρυφες κινήσεις χωρίς να ξανασηκώσεις το ρολό. Δούλευε σε τμήματα 1×1 m.',
   d_en:'Load the roller and roll it out on the grid. Start with a large 1 m tall “W” or “M”, then fill it in with vertical strokes without lifting the roller. Work in 1×1 m sections.',
   tip:'Πάντα βάφε σε «νωπή άκρη»: το νέο τμήμα πρέπει να ενώνεται με το προηγούμενο πριν αυτό στεγνώσει, αλλιώς μένουν γραμμές.',
   tip_en:'Always keep a wet edge: join each new section to the previous one before it dries, or you get lap marks.'},
  {t:'Άφησε να στεγνώσει και δεύτερο χέρι', t_en:'Let it dry and apply the second coat',
   d:'2–4 ώρες ανάμεσα στα χέρια, σύμφωνα με το κουτί. Το δεύτερο χέρι είναι σχεδόν πάντα απαραίτητο — ένα χέρι δείχνει καλό όσο είναι νωπό και «ανοίγει» στεγνώνοντας.',
   d_en:'2–4 hours between coats, as the tin says. A second coat is nearly always needed — one coat looks fine while wet and goes patchy as it dries.'},
  {t:'Καθάρισε τα εργαλεία αμέσως', t_en:'Clean tools immediately',
   d:'Πλαστικά/ακρυλικά χρώματα: ζεστό νερό και σαπούνι, αμέσως. Ένα ρολό που ξεράθηκε πετιέται. Αν κάνεις διάλειμμα λίγων ωρών, τύλιξε ρολό και πινέλο σφιχτά σε μεμβράνη.',
   d_en:'Water-based paints: warm soapy water, right away. A roller left to dry is rubbish. For a break of a few hours, wrap the roller and brush tightly in cling film.'}],
 tips:['Υπολόγισε 1 λίτρο ανά 10–12 m² ανά χέρι. Ένα δωμάτιο 12 m² χρειάζεται περίπου 7–9 λίτρα για δύο χέρια σε τοίχους και οροφή.',
       'Βάψε πρώτα την οροφή, μετά τους τοίχους, τελευταία τα ξύλινα. Έτσι οι σταγόνες πέφτουν σε ό,τι δεν έχεις βάψει ακόμη.',
       'Ματ φινίρισμα κρύβει ατέλειες αλλά λερώνεται· σατινέ καθαρίζεται και είναι σωστό για κουζίνα, μπάνιο και διαδρόμους.',
       'Δοκίμασε το χρώμα σε ένα τετράγωνο 50×50 cm και δες το πρωί, μεσημέρι και βράδυ πριν αγοράσεις 10 λίτρα.'],
 tips_en:['Reckon 1 litre per 10–12 m² per coat. A 12 m² room needs roughly 7–9 litres for two coats on walls and ceiling.',
          'Paint the ceiling first, then the walls, woodwork last. That way drips land on what you have not painted yet.',
          'Matt hides flaws but marks easily; satin wipes clean and is the right choice for kitchens, bathrooms and hallways.',
          'Test the colour on a 50×50 cm patch and look at it morning, noon and night before buying 10 litres.'],
 errs:['Παράλειψη ασταριού πάνω σε στόκο — φαίνονται όλα τα μπαλώματα σαν λεκέδες.',
       'Πολύ φορτωμένο ρολό: στάζει και αφήνει «πορτοκαλί φλούδα» υφή.',
       'Βάψιμο σε τμήματα που στεγνώνουν πριν ενωθούν — μόνιμες γραμμές.',
       'Χαρτοταινία που μένει μέχρι το επόμενο πρωί και ξεκολλά τη μπογιά.'],
 errs_en:['Skipping primer over filler — every patch shows as a stain.',
          'An overloaded roller: it drips and leaves an orange-peel texture.',
          'Painting sections that dry before they meet — permanent lap lines.',
          'Tape left on until the next morning that peels the paint off.'],
 faq:[{q:'Πρέπει οπωσδήποτε αστάρι;', q_en:'Do I really need primer?',
       a:'Όχι πάντα. Αν βάφεις πάνω σε παλιά, καθαρή, μη γυαλιστερή μπογιά με παρόμοιο χρώμα, δύο χέρια αρκούν. Αστάρι είναι υποχρεωτικό σε νέο σοβά/γυψοσανίδα, σε στοκαρίσματα, σε λεκέδες και σε αλλαγή από σκούρο σε ανοιχτό.',
       a_en:'Not always. Over old, clean, non-glossy paint in a similar colour, two coats are enough. Primer is essential on new plaster or board, over filler, over stains, and when going from dark to light.'},
      {q:'Πώς καλύπτω σκούρο κόκκινο ή μπλε τοίχο;', q_en:'How do I cover a dark red or blue wall?',
       a:'Ένα χέρι γκρι ή τονισμένο αστάρι και μετά δύο χέρια του τελικού χρώματος. Χωρίς αστάρι θα χρειαστείς τέσσερα ή πέντε χέρια και το κόκκινο θα εξακολουθεί να «περνά».',
       a_en:'One coat of grey or tinted primer, then two coats of the finish colour. Without primer you will need four or five coats and the red will still ghost through.'}],
 vq:'πώς βάφω τοίχο σωστά ρολό', vq_en:'how to paint a wall properly roller technique',

{

  {t:'Καθάρισε λίπη και βρωμιά', t_en:'Degrease and clean',
   d:'Ειδικά γύρω από το πόμολο, όπου έχουν περάσει χιλιάδες χέρια. Απορρυπαντικό, ξέπλυμα, στέγνωμα.',

   tip:'Αν μείνει έστω μία γυαλιστερή περιοχή, εκεί ακριβώς θα ξεφλουδίσει η νέα μπογιά σε έναν χρόνο.',

   d:'Σε ταμπλαδωτή πόρτα: πρώτα τα βαθουλωτά ταμπλάδες, μετά οι οριζόντιες τραβέρσες, τέλος τα κατακόρυφα. Πάντα στρώσεις λεπτές — δύο λεπτές είναι καλύτερες από μία χοντρή.',
   d_en:'On a panel door: the recessed panels first, then the horizontal rails, then the vertical stiles. Always thin coats — two thin beat one thick.'},

   d:'Μετά το πλήρες στέγνωμα (διάβασε το κουτί — συχνά 6–16 ώρες), ελαφρύ τρίψιμο με 240 και δεύτερο χέρι. Ξαναβίδωσε τα εξαρτήματα μόνο αφού σκληρύνει η μπογιά, όχι απλώς στεγνώσει: συνήθως 48 ώρες.',

 tips:['Υδατική ριπολίνη: λιγότερη μυρωδιά, δεν κιτρινίζει, στεγνώνει γρήγορα. Διαλύτη: πιο σκληρή και πιο «γεμάτη» αλλά κιτρινίζει και μυρίζει έντονα.',

   d:'Ακόμη και εκεί που η παλιά μπογιά κρατά, τρίψε με 80–120 ώστε να χάσει τη γυαλάδα. Η νέα στρώση χρειάζεται τραχύτητα για να πιαστεί.',
   d_en:'Even where the old paint is sound, abrade with 80–120 so it loses its sheen. The new coat needs a key to grip.'},
  {t:'Καθάρισε λίπη και σκόνη', t_en:'Degrease and dust off',
   d:'Πανί με white spirit σε όλη την επιφάνεια, μετά στεγνό πανί. Μην αγγίξεις με γυμνά χέρια μετά — το λίπος του δέρματος αρκεί για να μη κολλήσει το αστάρι.',
   d_en:'Wipe the whole surface with white spirit, then a dry cloth. Do not touch it with bare hands afterwards — skin oil alone is enough to stop the primer bonding.'},
  {t:'Αστάρωσε την ίδια μέρα', t_en:'Prime the same day',
   d:'Το γυμνό μέταλλο ξαναρχίζει να σκουριάζει μέσα σε ώρες, ειδικά κοντά στη θάλασσα. Πέρασε αντισκωριακό αστάρι αμέσως, με έμφαση στις γωνίες, τις κολλήσεις και τα κάτω άκρα όπου λιμνάζει το νερό.',

   warn:'Μη βάφεις με υγρασία, ομίχλη ή κάτω από 10 °C. Η μπογιά δεν πολυμερίζεται σωστά και θα ξεφλουδίσει.',

  {t:'Δύο χέρια τελικού χρώματος', t_en:'Two topcoats',
   d:'Λεπτές στρώσεις, με το πινέλο πάντα προς την ίδια κατεύθυνση. Άφησε τον χρόνο που λέει το κουτί ανάμεσα — συνήθως 6–24 ώρες. Δώσε έξτρα προσοχή στις κάτω ακμές, εκεί που πάντα ξεκινά η επόμενη σκουριά.',
   d_en:'Thin coats, brushing in one direction. Leave the interval the tin states — usually 6–24 hours. Give extra attention to the bottom edges, where the next rust always starts.'},
  {t:'Έλεγξε και συντήρησε', t_en:'Check and maintain',
   d:'Μία φορά τον χρόνο, κοίτα τα σημεία που δείχνουν καφέ στίγματα και δούλεψέ τα τοπικά. Μισή ώρα κάθε χρόνο σε σώζει από ολόκληρη ξαναβαφή κάθε πέντε.',
   d_en:'Once a year, look for brown specks and touch them up locally. Half an hour a year saves you a full repaint every five.'}],
 tips:['Σε βαθιά σκουριά που δεν φεύγει με τη βούρτσα, χρησιμοποίησε μετατροπέα σκουριάς: μετατρέπει τον οξείδιο σε σταθερή μαύρη ένωση που δέχεται μπογιά.',
       'Το μαύρο και τα σκούρα χρώματα ζεσταίνονται πολύ στον ήλιο και «σκάνε» νωρίτερα σε νότιο προσανατολισμό.',
       'Στα κάτω άκρα των κάγκελων συσσωρεύεται νερό. Ένα επιπλέον χέρι αστάρι εκεί διπλασιάζει τη διάρκεια.'],
 tips_en:['For deep rust the brush cannot reach, use a rust converter: it turns the oxide into a stable black compound that accepts paint.',
          'Black and dark colours get very hot in the sun and fail earlier on a south-facing elevation.',
          'Water collects at the bottom of railings. One extra primer coat there doubles the life.'],
 errs:['Βάψιμο πάνω σε σκουριά «για να μη φαίνεται» — φουσκώνει σε λίγους μήνες.',
       'Παράλειψη ασταριού για οικονομία — το τελικό χρώμα δεν έχει αντισκωριακή προστασία.',
       'Βάψιμο σε πολύ ζεστή λαμαρίνα κάτω από ήλιο — η μπογιά ξεραίνεται πριν απλωθεί και αφήνει πινελιές.'],
 errs_en:['Painting over rust so it “does not show” — it blisters within months.',
          'Skipping primer to save money — the topcoat has no corrosion protection.',

 faq:[{q:'Υπάρχει μπογιά «απευθείας πάνω στη σκουριά»;', q_en:'Do direct-to-rust paints work?',
       a:'Υπάρχουν και δουλεύουν ικανοποιητικά σε ελαφριά επιφανειακή σκουριά, αφού πρώτα βουρτσίσεις τα χαλαρά. Σε βαθιά, φουσκωμένη σκουριά καμία μπογιά δεν σε σώζει — η σκουριά συνεχίζει να δουλεύει από κάτω.',
       a_en:'They exist and work acceptably on light surface rust, after you brush off anything loose. On deep, flaking rust no paint saves you — the corrosion keeps working underneath.'}],
 vq:'βάψιμο κάγκελου με σκουριά αντισκωριακό', vq_en:'how to paint rusty metal railings'
},

{

 safety:['Κατέβασε τη ΓΕΝΙΚΗ ασφάλεια, όχι μόνο τη μερική. Οι παλιές εγκαταστάσεις έχουν συχνά λάθος αντιστοιχίσεις στον πίνακα.',

            'Test EVERY conductor in the box before touching anything.',
            'A lighting circuit may be fed from a different breaker than you assume.'],
 tools:['Δοκιμαστικό τάσης','Μονωμένα κατσαβίδια','Απογυμνωτής','Μυτοτσίμπιδο','Κινητό για φωτογραφία'],
 tools_en:['Voltage tester','Insulated screwdrivers','Wire strippers','Long-nose pliers','Phone for a photo'],
 mats:['Νέος διακόπτης ίδιου τύπου','Πλαίσιο','Μονωτική ταινία για σήμανση'],
 mats_en:['New switch of the same type','Frame','Electrical tape for labelling'],
 steps:[
  {t:'Κατάλαβε τι διακόπτη έχεις', t_en:'Work out what type you have',
   d:'Ένας διακόπτης που ανάβει το φως μόνο από ένα σημείο = απλός (2 καλώδια). Δύο διακόπτες που ανάβουν το ίδιο φως από δύο σημεία = κομμιτατέρ/αλέ-ρετούρ (3 καλώδια). Διπλός = δύο ομάδες φώτων (3–4 καλώδια).',
   d_en:'One switch controlling the light from a single point = one-way (2 conductors). Two switches controlling the same light = two-way (3 conductors). Double switch = two lighting groups (3–4 conductors).'},
  {t:'Κατέβασε τη γενική και επιβεβαίωσε', t_en:'Kill the main breaker and confirm',
   d:'Άναψε πρώτα το φως, κατέβασε τη γενική, δες ότι έσβησε. Άνοιξε το καπάκι και έλεγξε με δοκιμαστικό κάθε καλώδιο.',
   d_en:'Switch the light on first, kill the main breaker, see it go out. Open the plate and test every conductor.'},
  {t:'Φωτογράφισε και σημάδεψε', t_en:'Photograph and label',
   d:'Φωτογραφία από κοντά και ταινία με ετικέτα σε κάθε καλώδιο: L (τροφοδοσία), 1 και 2 (έξοδοι). Σε κομμιτατέρ, οι δύο «κλωστές» πάνε στον άλλο διακόπτη.',
   d_en:'Close-up photo plus a tape label on each conductor: L (feed), 1 and 2 (outputs). On a two-way, the two travellers go to the other switch.'},
  {t:'Αποσύνδεσε ένα-ένα', t_en:'Disconnect one at a time',
   d:'Ξεβίδωσε και βγάλε ένα καλώδιο, σημάδεψέ το, πέρνα στο επόμενο. Μη βγάλεις όλα μαζί.',
   d_en:'Loosen and remove one conductor, label it, move on. Do not pull them all out at once.'},
  {t:'Μετάφερε στον νέο μηχανισμό', t_en:'Transfer to the new mechanism',
   d:'Ο νέος διακόπτης έχει τους ίδιους ακροδέκτες, συχνά με σήμανση L, 1, 2 ή με βελάκια. Απλός: τροφοδοσία στο L, έξοδος στο 1. Κομμιτατέρ: κοινή στο L (ή C), οι δύο κλωστές στα 1 και 2.',
   d_en:'The new switch has the same terminals, often marked L, 1, 2 or with arrows. One-way: feed to L, output to 1. Two-way: common to L (or C), the two travellers to 1 and 2.',
   tip:'Αν σε κομμιτατέρ μπερδέψεις τις δύο κλωστές μεταξύ τους, δεν πειράζει — απλώς αντιστρέφεται η θέση «πάνω/κάτω». Αν όμως μπερδέψεις την κοινή, το φως δεν θα δουλέψει σωστά.',
   tip_en:'On a two-way, swapping the two travellers is harmless — it just flips which position is “on”. Swapping the common, though, breaks the switching.'},
  {t:'Σφίξε και τράβα για έλεγχο', t_en:'Tighten and tug-test',
   d:'Κάθε ακροδέκτης σφιχτά, κανένας γυμνός χαλκός εκτός. Τράβα κάθε καλώδιο ελαφρά για να επιβεβαιώσεις.',
   d_en:'Every terminal tight, no bare copper outside. Tug each conductor lightly to confirm.'},
  {t:'Τοποθέτησε και δοκίμασε', t_en:'Fit and test',
   d:'Δίπλωσε τα καλώδια, βίδωσε τον μηχανισμό ίσια, κούμπωσε το πλαίσιο, ανέβασε την ασφάλεια και δοκίμασε από όλα τα σημεία ελέγχου.',
   d_en:'Fold the conductors in, screw the mechanism in straight, clip the frame on, restore power and test from every control point.'}],
 tips:['Αν θέλεις να περάσεις σε «έξυπνο» διακόπτη Wi-Fi, έλεγξε πρώτα αν υπάρχει ουδέτερος (μπλε) στο κουτί — τα περισσότερα τον χρειάζονται και στα παλιά ελληνικά σπίτια συνήθως δεν υπάρχει.',
       'Αν το φως τρεμοπαίζει μετά την αλλαγή με λάμπες LED, φταίει συνήθως διακόπτης με λυχνία ένδειξης που αφήνει μικρό ρεύμα να περνά.',
       'Κράτα τον παλιό διακόπτη μέχρι να επιβεβαιώσεις ότι όλα δουλεύουν.'],
 tips_en:['If you want a Wi-Fi smart switch, first check there is a neutral (blue) in the box — most need one and older Greek homes usually do not have it.',
          'If LED lamps flicker after the swap, it is usually an indicator-lamp switch letting a small current leak through.',
          'Keep the old switch until you have confirmed everything works.'],
 errs:['Εργασία με τον διακόπτη «σβηστό» αντί για κατεβασμένη ασφάλεια — η φάση είναι εκεί.',
       'Αποσύνδεση όλων των καλωδίων μαζί χωρίς σήμανση.',
       'Σύνδεση της κοινής σε λάθος ακροδέκτη σε κομμιτατέρ.'],
 errs_en:['Working with the switch “off” instead of the breaker — the live is still there.',
          'Pulling all conductors out together with no labels.',
          'Wiring the common to the wrong terminal on a two-way.'],
 faq:[{q:'Γιατί υπάρχει ρεύμα στον διακόπτη ενώ το φως είναι σβηστό;', q_en:'Why is there voltage at the switch when the light is off?',
       a:'Γιατί ο διακόπτης κόβει τη φάση ΠΡΙΝ φτάσει στη λάμπα. Η τροφοδοσία φτάνει πάντα στον διακόπτη· αυτό που διακόπτεται είναι η συνέχεια προς το φωτιστικό. Γι’ αυτό η γενική ασφάλεια είναι υποχρεωτική.',
       a_en:'Because the switch breaks the live BEFORE it reaches the lamp. The feed is always present at the switch; what is interrupted is the run onward to the fitting. That is why the main breaker is mandatory.'}],
 vq:'αλλαγή διακόπτη φωτισμού κομμιτατέρ', vq_en:'how to replace a light switch one way two way'
},
{
 id:'ceiling-light', cat:'elec', ico:'🔆', diff:2, risk:true,
 n:'Αντικατάσταση φωτιστικού οροφής', n_en:'Replacing a ceiling light',
 d:'Από τον παλιό πολυέλαιο στο νέο φωτιστικό. Το δύσκολο δεν είναι η καλωδίωση — είναι η στερέωση στην οροφή.',
 d_en:'From the old chandelier to a new fitting. The hard part is not the wiring — it is fixing it to the ceiling.',
 time:'40 λεπτά', time_en:'40 minutes', cost:'20–150 €', cost_en:'€20–150', ppl:'2 (ένας κρατά το φωτιστικό)', ppl_en:'2 (one holds the fitting)',
 pro:'Κάλεσε ηλεκτρολόγο αν το φωτιστικό είναι πολύ βαρύ (πάνω από 5 kg) και δεν υπάρχει άγκιστρο ή δοκός στην οροφή, ή αν δεν υπάρχει γείωση και το φωτιστικό είναι μεταλλικό.',
 pro_en:'Call an electrician if the fitting is heavy (over 5 kg) with no hook or joist in the ceiling, or if there is no earth and the fitting is metal.',
 safety:['Γενική ασφάλεια κάτω και επιβεβαίωση με δοκιμαστικό.',
         'Σταθερή σκάλα σε επίπεδο δάπεδο. Ποτέ πάνω σε καρέκλα ή τραπέζι.',
         'Δύο άτομα: το φωτιστικό δεν κρέμεται ποτέ από τα καλώδια όσο το συνδέεις.'],
 safety_en:['Main breaker off and confirmed with a tester.',
            'Stable ladder on a level floor. Never a chair or a table.',
            'Two people: never let the fitting hang from its wires while you connect it.'],
 tools:['Δοκιμαστικό τάσης','Κατσαβίδια','Δράπανο με τρυπάνι μπετού','Απογυμνωτής','Σκάλα','Φακός κεφαλής'],
 tools_en:['Voltage tester','Screwdrivers','Drill with masonry bit','Wire strippers','Ladder','Head torch'],
 mats:['Νέο φωτιστικό','Βύσματα και βίδες κατάλληλα για την οροφή','Κλέμα σύνδεσης ή WAGO','Λάμπες LED','Μονωτική ταινία'],
 mats_en:['New fitting','Plugs and screws suited to the ceiling','Terminal block or WAGO connectors','LED lamps','Electrical tape'],
 steps:[
  {t:'Κόψε το ρεύμα και επιβεβαίωσε', t_en:'Isolate and confirm',
   d:'Γενική ασφάλεια κάτω. Άνοιξε τον διακόπτη του φωτιστικού για να επιβεβαιώσεις ότι δεν ανάβει, και δοκίμασε με το δοκιμαστικό στα καλώδια της οροφής μόλις τα ξεσκεπάσεις.',
   d_en:'Main breaker off. Flip the light switch to confirm nothing lights, and test the ceiling conductors with the tester as soon as they are exposed.'},
  {t:'Κατέβασε το παλιό φωτιστικό', t_en:'Take the old fitting down',
   d:'Ξεβίδωσε το καπάκι/ροζέτα. Ζήτα από τον δεύτερο να κρατήσει το βάρος. Φωτογράφισε τη σύνδεση πριν αποσυνδέσεις.',
   d_en:'Unscrew the canopy/rose. Have the second person take the weight. Photograph the connections before disconnecting.'},
  {t:'Έλεγξε τη στήριξη στην οροφή', t_en:'Check the ceiling fixing',
   d:'Δες τι υπάρχει: μεταλλικό άγκιστρο, ξύλινη δοκός, μπετόν ή γυψοσανίδα. Το βάρος του νέου φωτιστικού κρέμεται από αυτό, όχι από τα καλώδια.',
   d_en:'See what is there: a metal hook, a timber joist, concrete or plasterboard. The weight of the new fitting hangs from that, not from the cables.',
   warn:'Σε γυψοσανίδα, φωτιστικό πάνω από 3 kg χρειάζεται πεταλούδες ή, καλύτερα, βίδωμα σε δοκό/τραβέρσο. Ένα φωτιστικό που πέφτει από την οροφή είναι σοβαρό ατύχημα.',
   warn_en:'On plasterboard, a fitting over 3 kg needs toggle fixings or, better, screwing into a joist or noggin. A fitting falling from the ceiling is a serious accident.'},
  {t:'Στερέωσε τη βάση', t_en:'Fix the base plate',
   d:'Τρύπησε, βάλε βύσματα και βίδωσε τη βάση του νέου φωτιστικού. Πέρνα τα καλώδια της οροφής μέσα από την οπή της βάσης πριν τη βιδώσεις.',
   d_en:'Drill, plug and screw the new fitting’s base plate. Thread the ceiling conductors through the hole in the plate before fixing it.'},
  {t:'Σύνδεσε τα καλώδια', t_en:'Make the connections',
   d:'Γείωση (κίτρινο-πράσινο) στο σύμβολο ⏚ του φωτιστικού, ουδέτερος (μπλε) στο N, φάση (καφέ/μαύρο) στο L. Χρησιμοποίησε κλέμα ή WAGO, ποτέ στριφτές ενώσεις με μονωτική.',
   d_en:'Earth (green-yellow) to the fitting’s ⏚, neutral (blue) to N, live (brown/black) to L. Use a terminal block or WAGO connectors, never twisted joints with tape.',
   tip:'Αν το φωτιστικό είναι πλαστικό διπλής μόνωσης (σύμβολο ⧈), δεν έχει ακροδέκτη γείωσης. Τότε το κίτρινο-πράσινο μπαίνει σε μονωμένη κλέμα και μένει εκεί ασφαλές — δεν το κόβεις ποτέ.',
   tip_en:'If the fitting is double-insulated plastic (⧈ symbol) it has no earth terminal. Park the green-yellow safely in an insulated connector — never cut it off.'},
  {t:'Τακτοποίησε και κλείσε', t_en:'Tidy and close up',
   d:'Σπρώξε τα καλώδια στο κουτί χωρίς να πιεστούν, ανέβασε τη ροζέτα και βίδωσε. Βάλε τις λάμπες.',
   d_en:'Push the wiring back into the box without pinching it, lift the canopy and screw it home. Fit the lamps.'},
  {t:'Δοκίμασε και έλεγξε ξανά τη στήριξη', t_en:'Test and re-check the fixing',
   d:'Ανέβασε την ασφάλεια, δοκίμασε τον διακόπτη. Μετά τράβα ελαφρά προς τα κάτω το φωτιστικό για να βεβαιωθείς ότι κάθεται σταθερά.',
   d_en:'Restore power and test the switch. Then pull down gently on the fitting to confirm it is solidly fixed.'}],
 tips:['Αν βρεις πολλά καλώδια στο κουτί οροφής (κουτί διακλάδωσης), σημάδεψε προσεκτικά ποια ζεύγη ήταν ενωμένα μεταξύ τους πριν ακουμπήσεις οτιδήποτε.',
       'Οι λάμπες LED με ντουί E27 ταιριάζουν σχεδόν παντού και μειώνουν τη θερμότητα στο φωτιστικό.',
       'Για dimmer, βεβαιώσου ότι οι λάμπες γράφουν ρητά «dimmable» — αλλιώς θα τρεμοπαίζουν και θα βουίζουν.'],
 tips_en:['If you find many conductors in the ceiling box (a junction box), carefully note which pairs were joined before touching anything.',
          'E27 LED lamps fit almost everywhere and reduce heat in the fitting.',
          'For a dimmer, make sure the lamps explicitly say “dimmable” — otherwise they flicker and buzz.'],
 errs:['Στήριξη φωτιστικού από τα ίδια τα καλώδια.',
       'Κομμένος αγωγός γείωσης «γιατί δεν χρειαζόταν».',
       'Ενώσεις με στρίψιμο και μονωτική ταινία μέσα στο κουτί.',
       'Φωτιστικό σε γυψοσανίδα με απλά βύσματα.'],
 errs_en:['Letting the fitting hang from its own conductors.',
          'Cutting off the earth because “it was not needed”.',
          'Twisted joints and insulating tape inside the box.',
          'A fitting on plasterboard with plain plugs.'],
 faq:[{q:'Βρήκα τρία καλώδια αλλά το φωτιστικό έχει δύο ακροδέκτες.', q_en:'I found three wires but the fitting has two terminals.',
       a:'Το τρίτο είναι σχεδόν σίγουρα η γείωση (κίτρινο-πράσινο) και το φωτιστικό είναι διπλής μόνωσης. Μην την κόψεις: βάλ’ την σε μονωμένη κλέμα μέσα στο κουτί. Αν το τρίτο δεν είναι κίτρινο-πράσινο, σταμάτα — μπορεί να είναι δεύτερη ομάδα φώτων και θέλει ηλεκτρολόγο.',
       a_en:'The third is almost certainly the earth (green-yellow) and the fitting is double-insulated. Do not cut it: cap it in an insulated connector inside the box. If the third is not green-yellow, stop — it may be a second lighting group and needs an electrician.'}],

{
 id:'breaker-rcd', cat:'elec', ico:'🧯', diff:1, risk:true,
 n:'Ασφάλεια που πέφτει: τι κάνω με ασφάλεια', n_en:'A breaker that keeps tripping: what to do safely',
 d:'Πώς επαναφέρεις σωστά τον πίνακα, πώς βρίσκεις ποια συσκευή φταίει, και πότε δεν πρέπει να ξαναανεβάσεις τίποτα.',
 d_en:'How to reset the panel properly, how to find the appliance at fault, and when you must not switch anything back on.',
 time:'15 λεπτά', time_en:'15 minutes', cost:'0 €', cost_en:'€0', ppl:'1', ppl_en:'1',
 pro:'ΔΕΝ ανοίγεις ποτέ το καπάκι του πίνακα και δεν αγγίζεις καλωδιώσεις μέσα σε αυτόν. Αν η ασφάλεια πέφτει επαναλαμβανόμενα χωρίς προφανή συσκευή, αν μυρίζει καμένο, αν το ρελέ δεν «κρατά» καθόλου, ή αν υπάρχει νερό κοντά στην εγκατάσταση, κάλεσε αδειούχο ηλεκτρολόγο. Η αντικατάσταση ασφάλειας ή ρελέ είναι δουλειά αδειούχου.',
 pro_en:'Never open the panel cover or touch any wiring inside it. If the breaker trips repeatedly with no obvious appliance, if you smell burning, if the RCD will not hold at all, or if there is water near the installation, call a licensed electrician. Replacing a breaker or RCD is a licensed electrician’s job.',
 safety:['Στεγνά χέρια, στεγνό πάτωμα, φακός στο άλλο χέρι — όχι κινητό ακουμπισμένο στον πίνακα.',
         'Αν ο πίνακας είναι ζεστός, μαυρισμένος ή μυρίζει καμένο: μην αγγίξεις τίποτα, κατέβασε τη γενική αν φτάνεις με ασφάλεια και κάλεσε ηλεκτρολόγο.',
         'Ποτέ μη «γεφυρώσεις» μια ασφάλεια και ποτέ μη βάλεις μεγαλύτερη για να μην πέφτει. Η ασφάλεια προστατεύει το καλώδιο μέσα στον τοίχο από φωτιά.'],
 safety_en:['Dry hands, dry floor, torch in your other hand — not a phone propped on the panel.',
            'If the panel is hot, blackened or smells burnt: touch nothing, kill the main breaker if you can reach it safely and call an electrician.',
            'Never bridge a breaker and never fit a larger one so it stops tripping. The breaker protects the cable inside the wall from catching fire.'],
 tools:['Φακός','Σημειωματάριο ή κινητό για καταγραφή'],
 tools_en:['Torch','Notepad or phone to record what you find'],
 mats:['—'], mats_en:['—'],
 steps:[
  {t:'Κατάλαβε τι έπεσε', t_en:'Identify what tripped',
   d:'Στον πίνακα υπάρχουν τρία είδη: η γενική, οι μερικές ασφάλειες (μία ανά κύκλωμα), και το ρελέ διαφυγής (αντιηλεκτροπληξιακό, συνήθως πιο φαρδύ, με κουμπί TEST). Δες ποιο είναι κατεβασμένο ή στη μέση.',
   d_en:'There are three kinds in the panel: the main switch, the circuit breakers (one per circuit), and the RCD (residual current device, usually wider, with a TEST button). See which one is down or mid-position.'},
  {t:'Κατέβασε τα πάντα πρώτα', t_en:'Switch everything off first',
   d:'Κατέβασε ΟΛΕΣ τις μερικές ασφάλειες. Μετά ανέβασε πρώτα τη γενική και το ρελέ. Αν αυτά κρατούν με όλες τις μερικές κάτω, το πρόβλημα είναι σε ένα κύκλωμα.',
   d_en:'Switch ALL the circuit breakers off. Then switch the main and the RCD back on. If those hold with every circuit off, the problem is on one circuit.'},
  {t:'Ανέβαζε μία-μία', t_en:'Bring them up one by one',
   d:'Ανέβασε τις μερικές μία κάθε φορά, περιμένοντας λίγα δευτερόλεπτα. Όταν πέσει πάλι, βρήκες το προβληματικό κύκλωμα. Σημείωσέ το.',
   d_en:'Switch the circuits on one at a time, waiting a few seconds each. When it trips again you have found the faulty circuit. Note it down.'},
  {t:'Βρες τη συσκευή που φταίει', t_en:'Find the appliance at fault',
   d:'Κατέβασε πάλι εκείνη την ασφάλεια, βγάλε ΟΛΕΣ τις συσκευές από τις πρίζες αυτού του κυκλώματος, ανέβασέ την, και μετά βάλε τις συσκευές μία-μία. Αυτή που ρίχνει την ασφάλεια είναι η βλάβη.',
   d_en:'Switch that circuit off again, unplug EVERY appliance on it, switch it back on, then plug the appliances in one at a time. The one that trips it is the fault.',
   tip:'Οι πιο συχνοί ένοχοι: θερμοσίφωνας με χαλασμένη αντίσταση, πλυντήριο, ψυγείο παλιό, φορτιστές χαμηλής ποιότητας, φωτιστικό εξωτερικού χώρου με υγρασία.',
   tip_en:'The usual suspects: an immersion heater with a failed element, a washing machine, an old fridge, cheap chargers, and outdoor light fittings that have taken in water.'},
  {t:'Ξεχώρισε υπερφόρτωση από βραχυκύκλωμα', t_en:'Tell overload from short circuit',
   d:'Αν η ασφάλεια πέφτει μόνο όταν δουλεύουν πολλές συσκευές μαζί, είναι υπερφόρτωση — μοίρασε τα φορτία. Αν πέφτει αμέσως μόλις την ανεβάσεις, είναι βραχυκύκλωμα και θέλει ηλεκτρολόγο.',
   d_en:'If it trips only when several appliances run together, that is overload — spread the load. If it drops the instant you raise it, that is a short circuit and needs an electrician.'},
  {t:'Έλεγξε το ρελέ διαφυγής κάθε 6 μήνες', t_en:'Test the RCD every 6 months',
   d:'Πάτα το κουμπί TEST στο ρελέ. Πρέπει να πέσει αμέσως. Αν δεν πέφτει, το ρελέ δεν σε προστατεύει από ηλεκτροπληξία και πρέπει να αντικατασταθεί από ηλεκτρολόγο άμεσα.',
   d_en:'Press the TEST button on the RCD. It must trip instantly. If it does not, it is not protecting you from electrocution and must be replaced by an electrician right away.',
   warn:'Αν το ρελέ δεν πέφτει στο TEST, μην το αγνοήσεις. Είναι η μοναδική συσκευή που σε σώζει από θανατηφόρα ηλεκτροπληξία.',
   warn_en:'If the RCD does not trip on TEST, do not ignore it. It is the one device that saves you from a fatal shock.'},
  {t:'Κατάγραψε και σημάδεψε τον πίνακα', t_en:'Label the panel',
   d:'Γράψε σε ετικέτες ποια ασφάλεια αντιστοιχεί σε ποιο δωμάτιο ή συσκευή. Θα σου γλιτώσει πολύ χρόνο και θα κάνει κάθε μελλοντική εργασία πιο ασφαλή.',
   d_en:'Write labels showing which breaker serves which room or appliance. It saves a lot of time and makes every future job safer.'}],
 tips:['Το ρελέ διαφυγής προστατεύει ανθρώπους, οι ασφάλειες προστατεύουν καλώδια. Είναι δύο διαφορετικά πράγματα και χρειάζονται και τα δύο.',
       'Ασφάλεια που πέφτει είναι μήνυμα, όχι ενόχληση. Κάτι έχει πρόβλημα και βρέθηκε πριν γίνει φωτιά.',
       'Σε παλιά διαμερίσματα χωρίς ρελέ διαφυγής, η προσθήκη του από ηλεκτρολόγο κοστίζει λίγα δεκάδες ευρώ και είναι η σημαντικότερη αναβάθμιση ασφάλειας που μπορείς να κάνεις.'],
 tips_en:['The RCD protects people, the breakers protect cables. They are two different things and you need both.',
          'A tripping breaker is a message, not a nuisance. Something is faulty and it was caught before a fire.',
          'In older flats with no RCD, having an electrician fit one costs a few tens of euros and is the single most important safety upgrade you can make.'],

 mats_en:['Hot water','Baking soda and vinegar','Dish soap','New trap washer (if needed)'],
 steps:[
  {t:'Δοκίμασε ζεστό νερό και απορρυπαντικό', t_en:'Try hot water and detergent',
   d:'Ρίξε δύο κουταλιές υγρό πιάτων και μετά 2 λίτρα πολύ ζεστό (όχι βραστό, αν οι σωλήνες είναι πλαστικοί) νερό. Λιώνει τα λίπη — η πιο συχνή αιτία στην κουζίνα.',
   d_en:'Pour in two spoons of dish soap followed by 2 litres of very hot (not boiling, if the pipes are plastic) water. It melts grease — the most common kitchen cause.'},
  {t:'Σόδα και ξύδι', t_en:'Baking soda and vinegar',
   d:'Μισό φλιτζάνι μαγειρική σόδα στην αποχέτευση, μετά ένα φλιτζάνι ξύδι. Κλείσε την τάπα, περίμενε 20 λεπτά και ξέπλυνε με ζεστό νερό. Ακίνδυνο για σένα και για τους σωλήνες.',
   d_en:'Half a cup of baking soda down the drain, then a cup of vinegar. Cover the plughole, wait 20 minutes and flush with hot water. Harmless to you and to the pipes.'},
  {t:'Βεντούζα σωστά', t_en:'Use the plunger properly',
   d:'Γέμισε τον νεροχύτη με λίγο νερό ώστε να καλύπτει το χείλος της βεντούζας. ΚΛΕΙΣΕ την υπερχείλιση (τη μικρή τρύπα ψηλά) με ένα βρεγμένο πανί, αλλιώς χάνεται όλη η πίεση. Πίεσε 15–20 φορές δυνατά και τράβα απότομα.',
   d_en:'Put enough water in the sink to cover the plunger’s rim. BLOCK the overflow (the small hole near the top) with a wet cloth, or all the pressure escapes. Push 15–20 times firmly and pull sharply.',
   tip:'Σε διπλό νεροχύτη, κάποιος πρέπει να κλείνει την άλλη γούρνα με μια τάπα και δύναμη, αλλιώς το νερό απλώς πηγαινοέρχεται.',
   tip_en:'On a double sink, someone must hold a stopper down firmly in the other bowl, otherwise the water just moves side to side.'},
  {t:'Άνοιξε το σιφώνι', t_en:'Open the trap',
   d:'Βάλε λεκάνη από κάτω. Ξεβίδωσε με το χέρι τα δύο πλαστικά παξιμάδια του σιφωνιού. Θα βγει βρωμόνερο — γι’ αυτό η λεκάνη. Άδειασέ το και καθάρισέ το με νερό και οδοντόβουρτσα.',
   d_en:'Put the bowl underneath. Hand-undo the two plastic nuts on the trap. Dirty water will come out — that is what the bowl is for. Empty it and scrub it out with water and a toothbrush.'},
  {t:'Έλεγξε τη σωλήνα προς τον τοίχο', t_en:'Check the pipe to the wall',
   d:'Αν το σιφώνι ήταν καθαρό, η έμφραξη είναι πιο μέσα. Πέρνα το σπιράλ στη σωλήνα προς τον τοίχο, στρίβοντας δεξιόστροφα καθώς σπρώχνεις. Όταν συναντήσεις αντίσταση, στρίψε και τράβα — μη σπρώχνεις μόνο.',
   d_en:'If the trap was clean, the blockage is further in. Feed the snake into the pipe towards the wall, turning clockwise as you push. When you meet resistance, turn and pull — do not just push.'},
  {t:'Ξανασυναρμολόγησε σωστά', t_en:'Reassemble correctly',
   d:'Έλεγξε ότι κάθε λαστιχένια τσιμούχα κάθεται σωστά και με τη σωστή φορά (η κωνική πλευρά προς τα κάτω). Σφίξε ΜΟΝΟ με το χέρι — τα πλαστικά παξιμάδια δεν θέλουν κλειδί.',
   d_en:'Check each rubber washer is seated the right way round (tapered side down). Tighten by HAND only — plastic nuts do not want a spanner.'},
  {t:'Δοκίμασε με άφθονο νερό', t_en:'Test with plenty of water',
   d:'Άνοιξε τη βρύση δυνατά για ένα λεπτό και παρακολούθησε κάθε σύνδεση με στεγνό χαρτί. Γέμισε και τη γούρνα και άδειασέ τη μονομιάς — αυτό είναι το πραγματικό τεστ.',
   d_en:'Run the tap hard for a minute and watch every joint with dry paper. Then fill the bowl and let it all go at once — that is the real test.'}],
 tips:['Πρόληψη: βάλε σουρωτήρι στην αποχέτευση και μη ρίχνεις ποτέ λάδι τηγανίσματος στον νεροχύτη. Το λάδι πήζει μέσα στη σωλήνα.',
       'Στο μπάνιο η αιτία είναι σχεδόν πάντα μαλλιά τυλιγμένα γύρω από τη βαλβίδα. Ένα πλαστικό «φιδάκι» με δοντάκια των 2 € τα βγάζει σε 30 δευτερόλεπτα.',
       'Αν βουλώνουν ταυτόχρονα νεροχύτης, μπανιέρα και λεκάνη, η έμφραξη είναι στην κεντρική στήλη της πολυκατοικίας — αυτό είναι δουλειά αποφρακτικής εταιρείας.'],
 tips_en:['Prevention: fit a strainer and never pour cooking oil down the sink. Oil congeals inside the pipe.',
          'In the bathroom the cause is almost always hair wrapped around the waste. A €2 plastic barbed strip removes it in 30 seconds.',
          'If the sink, bath and toilet all block at once, the blockage is in the building’s main stack — that is a drainage contractor’s job.'],
 errs:['Καυστικά χημικά ως πρώτη επιλογή: καταστρέφουν παλιές σωλήνες, δεν λύνουν λίπη σε βάθος και κάνουν επικίνδυνη κάθε επόμενη προσπάθεια.',
       'Βεντούζα χωρίς κλείσιμο της υπερχείλισης — δεν δημιουργείται καθόλου πίεση.',
       'Σφίξιμο πλαστικών παξιμαδιών με κλειδί — ραγίζουν.',
       'Τσιμούχα σιφωνιού τοποθετημένη ανάποδα.'],
 errs_en:['Caustic chemicals as the first move: they damage old pipes, do not clear deep grease, and make every later attempt dangerous.',
          'Plunging without blocking the overflow — no pressure is built at all.',
          'Tightening plastic nuts with a spanner — they crack.',
          'A trap washer fitted upside down.'],
 faq:[{q:'Το νερό φεύγει αργά αλλά δεν έχει βουλώσει τελείως.', q_en:'The water drains slowly but is not fully blocked.',
       a:'Είναι το προειδοποιητικό στάδιο: υπάρχει στρώμα λίπους ή σαπουνιού στα τοιχώματα. Καθάρισε το σιφώνι τώρα, πριν φράξει εντελώς μια Κυριακή βράδυ.',
       a_en:'That is the warning stage: a layer of grease or soap is coating the pipe walls. Clean the trap now, before it blocks completely on a Sunday night.'}],
 vq:'ξεβούλωμα νεροχύτη σιφώνι καθαρισμός', vq_en:'how to unclog a sink drain trap'
},
{

 d_en:'Black, mouldy or lifting silicone. Success is decided by the cleaning, not by the bead.',

 tools:['Πιστόλι σιλικόνης','Κοπίδι','Ειδικό εργαλείο αφαίρεσης σιλικόνης','Σπάτουλα διαμόρφωσης ή απλώς το δάχτυλο','Χαρτοταινία','Πιστολάκι μαλλιών'],

   d_en:'Wipe the joint with bleach or a mould remover, leave 15 minutes and rinse. Any spores left under the new silicone will come back through it.'},
  {t:'Καθάρισε με οινόπνευμα και στέγνωσε', t_en:'Degrease with alcohol and dry',
   d:'Πέρασε οινόπνευμα ή ασετόν στις δύο επιφάνειες του αρμού. Στέγνωσε τελείως — με πιστολάκι αν χρειαστεί. Η επιφάνεια πρέπει να είναι απόλυτα στεγνή, χωρίς λίπος και χωρίς σκόνη.',

   d_en:'Two strips of masking tape, one each side, leaving a 4–6 mm gap. This is the secret to a straight, professional line.'},
  {t:'Γέμισε τη μπανιέρα με νερό', t_en:'Fill the bath with water',
   d:'Αν σφραγίζεις μπανιέρα ή ντουζιέρα, γέμισέ τη με νερό πριν περάσεις σιλικόνη και άδειασέ τη μόνο αφού στεγνώσει. Το βάρος κατεβάζει τη μπανιέρα στην τελική της θέση, ώστε ο αρμός να μη σκίσει την πρώτη φορά που θα κάνεις μπάνιο.',

   d_en:'Cut the nozzle at an angle, with an opening slightly smaller than the joint width. A big hole means too much silicone and a mess.'},

   d_en:'Within 3–5 minutes, run a finger dipped in water with a drop of dish soap along the bead in one continuous stroke. Wipe your finger after each pass.'},
  {t:'Τράβα την ταινία αμέσως', t_en:'Pull the tape straight away',
   d:'Τράβα τη χαρτοταινία ενώ η σιλικόνη είναι ακόμη νωπή, με γωνία 45° και προς τα έξω. Αν περιμένεις να στεγνώσει, θα σκίσει τη γραμμή.',
   d_en:'Pull the tape while the silicone is still wet, at 45° and away from the bead. Wait for it to skin and it will tear the line.'},

   d:'Μη βρέξεις, μην αγγίξεις, μην κάνεις μπάνιο. Η σιλικόνη «ξεραίνεται» στην επιφάνεια σε μία ώρα αλλά χρειάζεται 24 ώρες για να ωριμάσει σε όλο το βάθος.',
   d_en:'No water, no touching, no showering. Silicone skins over in an hour but needs 24 hours to cure right through.'}],
 tips:['Επίλεξε πάντα «σιλικόνη υγιεινής» με αντιμουχλικό (fungicide) για μπάνιο και κουζίνα. Η γενικής χρήσης μαυρίζει σε έναν χρόνο.',

       'Μετά το μπάνιο, σκούπισε τον αρμό με μια πετσέτα. Η σιλικόνη μαυρίζει από τη μόνιμη υγρασία, όχι από την ηλικία.',

 tips_en:['Always choose sanitary silicone with a fungicide for bathrooms and kitchens. General-purpose goes black within a year.',

{

 n:'Επισκευή σκασμένου λάστιχου', n_en:'Fixing a puncture',

 tools:['2–3 πλαστικά λαστιχάκια (κασετίνες)','Τρόμπα με μανόμετρο ή φορητή','Κλειδί άξονα 15 mm (αν δεν έχει ταχυσύνδεσμο)','Γάντια ή πανί'],

 steps:[

   d:'Πάτα τη βαλβίδα μέχρι να φύγει όλος ο αέρας. Πίεσε το λάστιχο με τα δύο χέρια γύρω-γύρω για να «ξεκολλήσει» από το χείλος της ζάντας.',

   d_en:'Put just enough air in to give it shape — that stops it folding. Put the valve through the rim hole first, then tuck the tube all the way round inside the tyre.'},
  {t:'Μόνταρε το λάστιχο με τα χέρια', t_en:'Refit the tyre by hand',

   d_en:'Rear: guide the chain onto the small sprocket and push the axle fully into the dropouts. Tighten properly and test the brakes before riding off.'}],
 tips:['Κουβάλα πάντα μια εφεδρική σαμπρέλα και δύο λαστιχάκια. Στον δρόμο αλλάζεις σαμπρέλα· τα μπαλώματα τα κάνεις άνετα στο σπίτι.',
