   d_en:'Pull it out on the key side. It comes out whole. Compare it with the new one: identical dimensions and the same cam shape.'},
  {t:'Βάλε τον νέο με το κλειδί μέσα', t_en:'Fit the new one with the key inserted',
   d:'Βάλε το νέο κλειδί στον νέο αφαλό, γύρισέ το στην ίδια γωνία και σπρώξε τον αφαλό στη θέση του. Πρέπει να μπει χωρίς πίεση.',
   d_en:'Put the new key in the new cylinder, turn it to the same angle and slide it in. It should go in without force.'},
  {t:'Βίδωσε και δοκίμασε', t_en:'Screw it in and test',
   d:'Ξαναβίδωσε την κεντρική βίδα — σφιχτά αλλά όχι υπερβολικά. Βγάλε το κλειδί και δοκίμασε: κλείδωμα και ξεκλείδωμα, με την πόρτα ΑΝΟΙΧΤΗ, τουλάχιστον πέντε φορές.',
   d_en:'Refit the central screw — tight but not over-tightened. Remove the key and test: lock and unlock, with the door still OPEN, at least five times.'},
  {t:'Δοκίμασε με κλειστή πόρτα', t_en:'Test with the door closed',
   d:'Μόνο αφού είσαι σίγουρος. Κλείσε την πόρτα και δοκίμασε από έξω και από μέσα, με όλα τα αντίγραφα κλειδιών.',
   d_en:'Only once you are confident. Close the door and test from outside and inside, with every copy of the key.'}],
 tips:['Κράτα τον παλιό αφαλό: αν δεν είσαι ευχαριστημένος με τον νέο, τον ξαναβάζεις σε δύο λεπτά.',
       'Μη λαδώνεις ποτέ κλειδαριά με λάδι ή WD-40: μαζεύει σκόνη και κολλάει. Χρησιμοποίησε σκόνη γραφίτη ή ειδικό σπρέι κλειδαριών.',
       'Αν το κλειδί «γρατζουνά» ή γυρίζει σκληρά, το πρόβλημα είναι συχνά η ευθυγράμμιση της πόρτας, όχι ο αφαλός.',
       'Για ενοικιαζόμενο σπίτι, η αλλαγή αφαλού μεταξύ ενοικιαστών κοστίζει λίγα ευρώ και είναι βασική προφύλαξη.'],
 tips_en:['Keep the old cylinder: if you are not happy with the new one you can refit it in two minutes.',
          'Never oil a lock with WD-40 or machine oil: it collects dust and gums up. Use graphite powder or a proper lock spray.',
          'If the key grates or turns stiffly, the problem is often door alignment, not the cylinder.',

 errs:['Λάθος μέτρηση και αφαλός που προεξέχει — σοβαρό κενό ασφαλείας.',

       'Δύναμη στο τράβηγμα αντί για σωστή γωνία κλειδιού.',
       'Λάδι μηχανής μέσα στην κλειδαριά.'],
 errs_en:['Wrong measurement and a protruding cylinder — a serious security weakness.',

          'Machine oil inside the lock.'],
 faq:[{q:'Μπορώ να έχω ένα κλειδί για όλες τις πόρτες;', q_en:'Can I have one key for all the doors?',

       a_en:'Yes — ask for keyed-alike cylinders at the shop. They must be bought together from the same range. But be aware: one lost key then opens everything.'}],

{
 id:'olive-prune', cat:'garden', ico:'🌳', diff:2, risk:true,
 n:'Κλάδεμα ελιάς και δέντρων', n_en:'Pruning olive and other trees',
 d:'Τα βασικά που ισχύουν σε κάθε δέντρο: πότε, πόσο και πού ακριβώς κόβεις.',
 d_en:'The basics that apply to any tree: when, how much and exactly where to cut.',
 time:'2–5 ώρες ανά δέντρο', time_en:'2–5 hours per tree', cost:'0–60 €', cost_en:'€0–60', ppl:'1–2', ppl_en:'1–2',
 pro:'Ψηλά κλαδιά που απαιτούν ανέβασμα σε δέντρο, κοντά σε καλώδια ρεύματος, ή αλυσοπρίονο πάνω από το ύψος του ώμου: εκεί σταματάς και καλείς επαγγελματία. Κλαδιά κοντά σε γραμμές ΔΕΗ δεν τα αγγίζεις ποτέ — ειδοποιείς τον πάροχο.',
 pro_en:'High limbs needing you to climb, work near power lines, or a chainsaw above shoulder height: that is where you stop and call a professional. Never touch branches near power lines — report them to the utility.',
 safety:['Γυαλιά, γάντια, κράνος αν κόβεις από κάτω. Κλαδί που πέφτει είναι απρόβλεπτο.',
         'Σκάλα σε σταθερό έδαφος με δεύτερο άτομο. Ποτέ σκάλα ακουμπισμένη σε κλαδί που θα κόψεις.',
         'Αλυσοπρίονο: μόνο με προστατευτικό παντελόνι, και ποτέ πάνω από το ύψος των ώμων.',
         'Πρόσεχε πάντα πού θα πέσει το κλαδί και πού θα βρίσκεσαι εσύ.'],
 safety_en:['Goggles, gloves and a helmet if cutting overhead. A falling branch is unpredictable.',
            'Ladder on firm ground with a second person. Never lean a ladder on the branch you are cutting.',
            'Chainsaw: only with protective trousers, and never above shoulder height.',
            'Always know where the branch will fall and where you will be.'],
 tools:['Ψαλίδι κλαδέματος (χειρός)','Κλαδευτήρι με δύο λαβές','Πριόνι κλαδέματος','Τηλεσκοπικό κονταροπρίονο','Γυαλιά και γάντια','Οινόπνευμα για απολύμανση'],
 tools_en:['Hand secateurs','Loppers','Pruning saw','Telescopic pole saw','Goggles and gloves','Alcohol for disinfecting'],
 mats:['Λάδι λίπανσης εργαλείων','Πάστα επούλωσης (σπάνια απαραίτητη)'],
 mats_en:['Tool lubricating oil','Wound sealant (rarely necessary)'],
 steps:[
  {t:'Διάλεξε τη σωστή εποχή', t_en:'Choose the right season',
   d:'Ελιά: τέλη χειμώνα ως αρχές άνοιξης, μετά τον κίνδυνο παγετού και πριν την ανθοφορία. Φυλλοβόλα οπωροφόρα: στην περίοδο λήθαργου, χειμώνα. Ποτέ σε συνθήκες παγετού και ποτέ στον καύσωνα.',
   d_en:'Olive: late winter to early spring, after frost risk and before flowering. Deciduous fruit trees: during dormancy, in winter. Never in freezing conditions and never in a heatwave.'},
  {t:'Απολύμανε τα εργαλεία', t_en:'Disinfect the tools',
   d:'Πέρνα τις λεπίδες με οινόπνευμα πριν ξεκινήσεις και ανάμεσα σε διαφορετικά δέντρα. Οι μυκητιάσεις μεταφέρονται με τα εργαλεία.',
   d_en:'Wipe the blades with alcohol before you start and between different trees. Fungal diseases travel on tools.'},
  {t:'Κοίτα το δέντρο πριν κόψεις', t_en:'Look at the tree before you cut',
   d:'Κάνε τον γύρο του δύο φορές. Αποφάσισε τη γενική μορφή που θέλεις. Το κλάδεμα δεν είναι «κόβω ό,τι βρω» — είναι επιλογή ποια κλαδιά θα κρατήσεις.',
   d_en:'Walk around it twice. Decide the overall shape you want. Pruning is not “cut whatever you find” — it is choosing which branches to keep.'},
  {t:'Ξεκίνα από τα τρία «Ν»', t_en:'Start with the three D’s',
   d:'Νεκρά, Νοσούντα, Ξερά — αυτά φεύγουν πάντα, σε κάθε εποχή, χωρίς δεύτερη σκέψη. Πολλές φορές μετά από αυτό το δέντρο δεν χρειάζεται τίποτα άλλο.',
   d_en:'Dead, Diseased, Damaged — those always go, in any season, without a second thought. Very often the tree needs nothing more after that.'},
  {t:'Βγάλε τα κλαδιά που τρίβονται', t_en:'Remove crossing branches',
   d:'Δύο κλαδιά που ακουμπούν δημιουργούν πληγή και είσοδο ασθενειών. Κράτα το πιο γερό και το καλύτερα τοποθετημένο, κόψε το άλλο.',
   d_en:'Two branches rubbing create a wound and a route for disease. Keep the stronger, better-placed one and remove the other.'},
  {t:'Άνοιξε το κέντρο', t_en:'Open up the centre',
   d:'Στην ελιά, ο στόχος είναι σχήμα «κύπελλου»: φως και αέρας να φτάνουν στο εσωτερικό. Βγάλε τα κατακόρυφα «λαίμαργα» βλαστάρια και ό,τι μεγαλώνει προς τα μέσα. Ο καρπός βγαίνει στα κλαδιά της προηγούμενης χρονιάς.',
   d_en:'On an olive the aim is a vase shape: light and air reaching the inside. Remove vertical water shoots and anything growing inwards. Fruit forms on last year’s wood.'},
  {t:'Κόψε στο σωστό σημείο', t_en:'Cut in the right place',
   d:'Ποτέ κολλητά στον κορμό και ποτέ αφήνοντας «κρεμάστρα». Κόψε ακριβώς έξω από το «κολάρο» — το ελαφρώς διογκωμένο δαχτυλίδι στη βάση του κλαδιού. Εκεί το δέντρο μπορεί να επουλωθεί μόνο του.',
   d_en:'Never flush with the trunk and never leaving a stub. Cut just outside the branch collar — the slightly swollen ring at its base. That is where the tree can seal itself.',
   tip:'Σε κλαδί πάνω από 3 cm, κάνε τρεις κοπές: πρώτα μια εγκοπή από κάτω 20 cm έξω, μετά κόψε από πάνω λίγο πιο έξω (το κλαδί πέφτει καθαρά), και τέλος κόψε το υπόλοιπο στο κολάρο. Έτσι δεν σκίζεται ο φλοιός.',
   tip_en:'For a branch over 3 cm, use three cuts: an undercut 20 cm out, a top cut slightly further out (the branch drops cleanly), then the final cut at the collar. That stops the bark tearing.'},
  {t:'Μην αφαιρέσεις πάνω από το 25%', t_en:'Do not remove more than 25%',
   d:'Σε μία σεζόν, μη βγάλεις πάνω από το ένα τέταρτο της φυλλικής επιφάνειας. Το δέντρο απαντά σε βίαιο κλάδεμα με πλήθος αδύναμων βλαστών και εξαντλείται.',
   d_en:'In one season, do not take more than a quarter of the canopy. A tree responds to hard pruning with a mass of weak shoots and exhausts itself.'},
  {t:'Καθάρισε και τακτοποίησε', t_en:'Clean up',
   d:'Μάζεψε τα κομμένα κλαδιά, ειδικά τα ασθενή, και μην τα αφήσεις στη βάση του δέντρου. Καθάρισε και λάδωσε τα εργαλεία πριν τα αποθηκεύσεις.',
   d_en:'Collect the prunings, especially diseased ones, and do not leave them at the base of the tree. Clean and oil the tools before storing them.'}],
 tips:['Κόψε λιγότερο απ’ όσο νομίζεις ότι πρέπει. Μπορείς πάντα να κόψεις κι άλλο τον επόμενο μήνα· δεν μπορείς να το ξανακολλήσεις.',
       'Οι πάστες επούλωσης έχουν αποδειχθεί κυρίως περιττές. Μια καθαρή κοπή στο σωστό σημείο επουλώνεται μόνη της καλύτερα.',
       'Κοφτερά εργαλεία κάνουν καθαρές πληγές που κλείνουν γρήγορα. Στομωμένα εργαλεία σκίζουν και αφήνουν είσοδο σε μύκητες.',
       'Τα «λαίμαργα» βλαστάρια που φυτρώνουν κατακόρυφα δεν καρποφορούν ποτέ. Βγάλ’ τα κάθε χρόνο.'],
 tips_en:['Cut less than you think you should. You can always take more next month; you cannot put it back.',
          'Wound sealants have largely proved unnecessary. A clean cut in the right place heals better on its own.',
          'Sharp tools make clean wounds that close fast. Blunt tools tear and let fungi in.',
          'Vertical water shoots never bear fruit. Remove them every year.'],
 errs:['Κοπή κολλητά στον κορμό, που αφαιρεί το κολάρο και δεν επουλώνεται ποτέ.',
       '«Κρεμάστρες» που μένουν και σαπίζουν.',
       'Υπερβολικό κλάδεμα σε μία σεζόν.',
       'Εργαλεία που δεν απολυμάνθηκαν ανάμεσα σε ασθενή δέντρα.'],
 errs_en:['Flush cuts that remove the collar and never heal.',
          'Stubs left behind that rot.',
          'Removing far too much in one season.',
          'Tools not disinfected between diseased trees.'],
 faq:[{q:'Πότε δεν πρέπει να κλαδέψω;', q_en:'When should I not prune?',
       a:'Σε παγετό (το ξύλο γίνεται εύθραυστο και οι πληγές δεν επουλώνονται), σε καύσωνα (το δέντρο είναι σε καταπόνηση), και σε περίοδο έντονης βροχής (οι μύκητες μεταδίδονται εύκολα σε νωπές πληγές). Τα νεκρά κλαδιά όμως αφαιρούνται οποτεδήποτε.',
       a_en:'In frost (the wood is brittle and wounds do not seal), in a heatwave (the tree is already stressed), and in wet spells (fungi spread easily into fresh wounds). Dead wood, though, can be removed at any time.'}],
 vq:'κλάδεμα ελιάς σωστή τεχνική', vq_en:'how to prune an olive tree correctly'
},

 id:'water-leak', cat:'emerg', ico:'💧', diff:1, risk:true,
 n:'Διαρροή νερού: τα πρώτα πέντε λεπτά', n_en:'A water leak: the first five minutes',

 d_en:'Water is running and will not stop. The order of your actions decides between a small mess and a ruined floor.',
 time:'5 λεπτά', time_en:'5 minutes', cost:'0 €', cost_en:'€0', ppl:'1', ppl_en:'1',
 pro:'Κάλεσε υδραυλικό αμέσως αν: η διαρροή είναι μέσα σε τοίχο ή δάπεδο, δεν βρίσκεις τον γενικό διακόπτη, ή το νερό συνεχίζει να τρέχει αφού τον κλείσεις. Αν το νερό φτάνει σε πρίζες, φωτιστικά ή στον ηλεκτρικό πίνακα, κατέβασε πρώτα τη γενική ασφάλεια και μην πατήσεις στο νερό.',
 pro_en:'Call a plumber immediately if: the leak is inside a wall or floor, you cannot find the main stopcock, or water keeps running after you close it. If water reaches sockets, light fittings or the consumer unit, kill the main breaker first and do not step in the water.',
 safety:['Νερό και ρεύμα μαζί σκοτώνουν. Αν το νερό πλησιάζει πρίζες ή τον πίνακα, ΠΡΩΤΑ κατεβάζεις τη γενική ασφάλεια — από στεγνό σημείο, με στεγνά χέρια.',
         'Μην πατήσεις σε λιμνασμένο νερό όσο υπάρχει ρεύμα στο κύκλωμα.',
         'Ζεστό νερό από σπασμένο θερμοσίφωνα προκαλεί εγκαύματα. Κλείσε και το ρεύμα του θερμοσίφωνα.'],
 safety_en:['Water and electricity together kill. If water is nearing sockets or the panel, kill the main breaker FIRST — from a dry spot, with dry hands.',
            'Do not step into standing water while the circuit is live.',
            'Hot water from a burst heater scalds. Switch the heater’s power off too.'],
 tools:['Γενικός διακόπτης νερού (μάθε πού είναι ΠΡΙΝ τον χρειαστείς)','Κουβάς και πανιά','Ηλεκτρική σκούπα υγρών, αν υπάρχει','Φακός'],
 tools_en:['The main stopcock (learn where it is BEFORE you need it)','Bucket and cloths','Wet vacuum, if you have one','Torch'],
 mats:['Πετσέτες','Ταινία επισκευής σωλήνα ή σφιγκτήρας','Λεκάνες'],
 mats_en:['Towels','Pipe repair tape or a clamp','Bowls'],
 steps:[
  {t:'Κλείσε το νερό — τώρα', t_en:'Shut the water off — now',
   d:'Πρώτα η γωνιακή βάνα κοντά στο σημείο, αν φτάνεις. Αλλιώς κατευθείαν ο γενικός διακόπτης του διαμερίσματος (συνήθως στο μπάνιο, στην κουζίνα ή στο κλιμακοστάσιο, δίπλα στον μετρητή). Μην ψάχνεις από πού τρέχει πριν κλείσεις.',
   d_en:'The isolating valve nearest the leak first, if you can reach it. Otherwise straight to the flat’s main stopcock (usually in the bathroom, kitchen or on the landing by the meter). Do not investigate the source before shutting off.',
   warn:'Αν δεν ξέρεις πού είναι ο γενικός διακόπτης, βρες τον σήμερα — όχι την ώρα που θα τρέχει νερό.',
   warn_en:'If you do not know where the stopcock is, find it today — not while water is pouring.'},
  {t:'Κόψε το ρεύμα αν χρειάζεται', t_en:'Kill the power if needed',
   d:'Αν το νερό έχει φτάσει ή πλησιάζει πρίζες, φωτιστικά οροφής του κάτω ορόφου, ή τον πίνακα: κατέβασε τη γενική ασφάλεια από στεγνό σημείο. Καλύτερα να μείνεις στο σκοτάδι παρά να μπεις σε βρεγμένο δωμάτιο με ρεύμα.',
   d_en:'If water has reached or is nearing sockets, the ceiling fittings of the floor below, or the panel: kill the main breaker from a dry spot. Better to sit in the dark than to walk into a wet room that is still live.'},
  {t:'Άνοιξε τις βρύσες για να αδειάσουν οι σωλήνες', t_en:'Open the taps to drain the pipes',
   d:'Άνοιξε την πιο χαμηλή βρύση του σπιτιού. Έτσι φεύγει το νερό που έχει μείνει στο δίκτυο και μειώνεται η πίεση στο σημείο της διαρροής.',
   d_en:'Open the lowest tap in the home. That drains the water left in the pipework and drops the pressure at the leak.'},
  {t:'Περιόρισε τη ζημιά', t_en:'Contain the damage',
   d:'Λεκάνη κάτω από τη στάλα, πετσέτες γύρω-γύρω. Σήκωσε χαλιά, έπιπλα και ό,τι ρουφά νερό. Αν τρέχει προς τον κάτω όροφο, ειδοποίησε τους αμέσως — η ζημιά τους μεγαλώνει κάθε λεπτό.',
   d_en:'A bowl under the drip, towels around it. Lift rugs, furniture and anything absorbent. If it is going to the flat below, tell them at once — their damage grows every minute.'},
  {t:'Βρες από πού έρχεται', t_en:'Find where it comes from',
   d:'Τώρα που δεν τρέχει, σκούπισε και παρακολούθησε. Συνηθισμένες αιτίες: σπιράλ βρύσης, γωνιακή βάνα, σιφώνι, σύνδεση πλυντηρίου, θερμοσίφωνας, καζανάκι. Το νερό ταξιδεύει: το σημείο που στάζει σπάνια είναι το σημείο που σπάει.',
   d_en:'Now that it has stopped, dry everything and watch. Common causes: a tap hose, an isolating valve, a trap, a washing machine connection, the water heater, the cistern. Water travels: where it drips is rarely where it broke.'},
  {t:'Προσωρινό μπάλωμα, όχι μόνιμη λύση', t_en:'A temporary patch, not a permanent fix',
   d:'Σε ορατό σωλήνα, ταινία επισκευής ή σφιγκτήρας με λάστιχο κρατά μερικές ημέρες. Είναι για να αντέξεις μέχρι τον υδραυλικό, όχι για να το ξεχάσεις.',
   d_en:'On a visible pipe, repair tape or a clamp with rubber holds for a few days. It is to get you to the plumber, not to forget about it.'},
  {t:'Στέγνωσε σοβαρά', t_en:'Dry it properly',
   d:'Άνοιξε παράθυρα, βάλε ανεμιστήρα, σήκωσε ό,τι μπορείς. Νερό που μένει σε δάπεδο ή τοίχο γίνεται μούχλα σε 48 ώρες και είναι πολύ χειρότερο πρόβλημα από τη διαρροή.',
   d_en:'Open windows, run a fan, lift what you can. Water left in a floor or wall becomes mould within 48 hours — a far worse problem than the leak.'},
  {t:'Φωτογράφισε πριν καθαρίσεις', t_en:'Photograph before you clean up',
   d:'Αν σκοπεύεις να το δηλώσεις στην ασφάλεια, τράβα φωτογραφίες της ζημιάς πριν την αποκαταστήσεις. Μετά είναι αργά.',
   d_en:'If you plan an insurance claim, photograph the damage before you repair it. Afterwards is too late.'}],
 tips:['Σήμερα, όχι κάποια στιγμή: βρες τον γενικό διακόπτη νερού, δοκίμασε ότι κλείνει, και δείξ’ τον σε όλους στο σπίτι.',
       'Αν κλείνεις σπίτι για διακοπές, κλείσε τον γενικό διακόπτη. Οι περισσότερες μεγάλες ζημιές γίνονται σε άδεια σπίτια.',
       'Τα σπιράλ των βρυσών έχουν ζωή. Άλλαξέ τα κάθε 8–10 χρόνια πριν σκάσουν μόνα τους.',
       'Ένας αισθητήρας διαρροής με ήχο κοστίζει λίγα ευρώ και μπαίνει κάτω από τον νεροχύτη και δίπλα στο πλυντήριο.'],
 tips_en:['Today, not sometime: find the main stopcock, check it actually closes, and show everyone in the house.',
          'If you leave the house for a holiday, shut the stopcock. Most big escapes happen in empty homes.',
          'Tap hoses have a lifespan. Replace them every 8–10 years before they burst on their own.',
          'A leak alarm costs a few euros and goes under the sink and beside the washing machine.'],
 errs:['Ψάξιμο της αιτίας πριν κλείσει το νερό.',
       'Περπάτημα σε βρεγμένο δωμάτιο με το ρεύμα ανοιχτό.',
       'Καθυστέρηση ειδοποίησης του κάτω ορόφου.',
       'Επιφανειακό σκούπισμα χωρίς πραγματικό στέγνωμα — μούχλα σε λίγες μέρες.'],
 errs_en:['Hunting for the cause before shutting the water off.',
          'Walking into a wet room with the power still on.',
          'Delaying telling the neighbours below.',
          'A quick wipe with no real drying — mould within days.'],
 faq:[{q:'Πού είναι συνήθως ο γενικός διακόπτης νερού;', q_en:'Where is the main stopcock usually?',
       a:'Σε διαμέρισμα: στο ντουλάπι του μπάνιου ή της κουζίνας, σε φρεάτιο στο κλιμακοστάσιο, ή δίπλα στους μετρητές του κτηρίου. Σε μονοκατοικία: στο φρεάτιο του μετρητή, στην αυλή ή στο πεζοδρόμιο. Ψάξ’ τον με ησυχία και σημάδεψέ τον με ταινία.',
       a_en:'In a flat: in the bathroom or kitchen cupboard, in a riser cupboard on the landing, or by the building’s meters. In a house: in the meter chamber, in the yard or at the pavement. Find it calmly and mark it with tape.'}],
 vq:'διαρροή νερού τι κάνω πρώτα γενικός διακόπτης', vq_en:'what to do first water leak shut off valve'
},
{
 id:'gas-smell', cat:'emerg', ico:'⚠️', diff:1, risk:true,
 n:'Μυρωδιά φυσικού αερίου ή υγραερίου', n_en:'A smell of gas',
 d:'Μυρίζει «κλούβιο αυγό». Εδώ δεν κάνεις τίποτα μόνος σου — υπάρχει μία μόνο σωστή σειρά ενεργειών και τη διαβάζεις πριν τη χρειαστείς.',
 d_en:'It smells of rotten eggs. This is not a DIY job — there is exactly one correct sequence, and you read it before you need it.',
 time:'άμεσα', time_en:'immediately', cost:'0 €', cost_en:'€0', ppl:'—', ppl_en:'—',
 pro:'Καμία εργασία σε εγκατάσταση αερίου δεν γίνεται από μη αδειούχο. Ούτε σύσφιξη, ούτε αλλαγή λάστιχου, ούτε «θα το δω εγώ». Κάλεσε τον αριθμό βλαβών του παρόχου αερίου (αναγράφεται στον λογαριασμό) ή το 112. Αν υπάρχει κίνδυνος πυρκαγιάς, κάλεσε την Πυροσβεστική στο 199.',
 pro_en:'No work on a gas installation may be done by an unlicensed person. Not tightening, not changing a hose, not “I will have a look”. Call your gas supplier’s emergency number (printed on the bill) or 112. If there is any fire risk, call the fire service (199 in Greece).',
 safety:['ΜΗΝ ανάψεις και ΜΗΝ σβήσεις κανέναν διακόπτη, φως, απορροφητήρα ή συσκευή. Ο σπινθήρας του διακόπτη αρκεί για ανάφλεξη.',
         'ΜΗΝ χρησιμοποιήσεις κινητό μέσα στον χώρο. Τηλεφώνησε από έξω.',
         'ΜΗΝ ανάψεις φλόγα, τσιγάρο ή αναπτήρα. Μη χτυπήσεις το κουδούνι διαμερίσματος.',
         'ΜΗΝ χρησιμοποιήσεις ανελκυστήρα.'],
 safety_en:['DO NOT switch anything on or off — no lights, no extractor, no appliance. The spark in a switch is enough to ignite it.',
            'DO NOT use a phone inside. Call from outside.',
            'DO NOT light a flame, cigarette or lighter. Do not ring a doorbell.',
            'DO NOT use the lift.'],
 tools:['—'], tools_en:['—'],
 mats:['—'], mats_en:['—'],
 steps:[
  {t:'Μην αγγίξεις κανέναν διακόπτη', t_en:'Touch no switch',
   d:'Ούτε για να ανάψεις, ούτε για να σβήσεις. Αν το φως είναι αναμμένο, άσ’ το αναμμένο. Αν είναι σβηστό, άσ’ το σβηστό. Κάθε διακόπτης παράγει μικρό σπινθήρα.',
   d_en:'Not to switch on, not to switch off. If a light is on, leave it on. If it is off, leave it off. Every switch makes a small spark.'},
  {t:'Άνοιξε πόρτες και παράθυρα', t_en:'Open doors and windows',
   d:'Ρεύμα αέρα σε όλο το σπίτι. Το αέριο πρέπει να φύγει και η συγκέντρωση να πέσει.',
   d_en:'Get air moving through the whole place. The gas must escape and the concentration must drop.'},
  {t:'Κλείσε τον διακόπτη αερίου', t_en:'Close the gas valve',
   d:'Μόνο αν είναι σε σημείο που φτάνεις χωρίς να μπεις βαθύτερα στη μυρωδιά: ο κρουνός δίπλα στον μετρητή ή στη φιάλη υγραερίου. Αν η μυρωδιά είναι έντονη, μην ψάξεις — φύγε.',
   d_en:'Only if it is somewhere you can reach without going deeper into the smell: the tap by the meter or on the LPG cylinder. If the smell is strong, do not search — leave.'},
  {t:'Βγες έξω και πάρε μαζί όλους', t_en:'Get out and take everyone with you',
   d:'Όλοι έξω, από τις σκάλες. Μην περιμένεις να δεις αν «περνάει». Χτύπα τις πόρτες των γειτόνων με το χέρι, όχι με το κουδούνι.',
   d_en:'Everyone out, by the stairs. Do not wait to see if it clears. Knock on neighbours’ doors with your hand, not the bell.'},
  {t:'Τηλεφώνησε από απόσταση', t_en:'Phone from a distance',
   d:'Από τον δρόμο, μακριά από το κτήριο: αριθμός βλαβών του παρόχου αερίου, ή 112. Αν φοβάσαι ανάφλεξη, 199 για την Πυροσβεστική. Πες ακριβώς πού μυρίζει και πόσο έντονα.',
   d_en:'From the street, away from the building: your gas supplier’s emergency line, or 112. If you fear ignition, call the fire service. Say exactly where the smell is and how strong.'},
  {t:'Μην ξαναμπείς μέχρι να σου το πουν', t_en:'Do not go back in until you are told',
   d:'Ακόμη κι αν η μυρωδιά έφυγε. Μόνο ο τεχνικός του παρόχου λέει πότε είναι ασφαλές.',
   d_en:'Even if the smell has gone. Only the supplier’s technician says when it is safe.'}],
 tips:['Το φυσικό αέριο είναι ελαφρύτερο από τον αέρα και ανεβαίνει· το υγραέριο είναι βαρύτερο και κάθεται χαμηλά, σε υπόγεια και φρεάτια. Γι’ αυτό ένα υπόγειο με υγραέριο είναι ιδιαίτερα επικίνδυνο.',
       'Ένας ανιχνευτής αερίου κοστίζει λίγα δεκάδες ευρώ και μπαίνει κοντά στην κουζίνα ή στον λέβητα.',
       'Έλεγχος από αδειούχο κάθε δύο χρόνια, και άμεση αντικατάσταση λάστιχων κουζίνας στην ημερομηνία λήξης τους.',
       'Μάθε από σήμερα πού είναι ο κρουνός του αερίου και ο αριθμός βλαβών του παρόχου σου.'],
 tips_en:['Natural gas is lighter than air and rises; LPG is heavier and settles low, in basements and pits. That is why a basement with LPG is especially dangerous.',
          'A gas detector costs a few tens of euros and goes near the cooker or the boiler.',
          'Have a licensed check every two years, and replace cooker hoses on their expiry date.',
          'Learn today where the gas tap is and what your supplier’s emergency number is.'],
 errs:['Άναμμα ή σβήσιμο φωτός «για να δω».',
       'Χρήση κινητού μέσα στον χώρο.',
       'Αναζήτηση της διαρροής με αναπτήρα ή σπίρτο — αυτό σκοτώνει.',
       'Επιστροφή στο σπίτι πριν το πει ο τεχνικός.'],
 errs_en:['Switching a light on or off “to see”.',
          'Using a phone inside.',
          'Looking for the leak with a lighter or match — this kills.',
          'Going back inside before the technician says so.'],
 faq:[{q:'Πώς ελέγχω μόνος μου αν υπάρχει διαρροή;', q_en:'How do I check for a leak myself?',
       a:'Ο ΜΟΝΟΣ ασφαλής οικιακός έλεγχος είναι σαπουνόνερο σε ορατή σύνδεση, με τον χώρο αερισμένο και χωρίς καμία μυρωδιά ήδη παρούσα: φυσαλίδες σημαίνουν διαρροή. Ποτέ με φλόγα. Και ακόμη κι έτσι, τη διαρροή τη διορθώνει αδειούχος — εσύ κλείνεις τον κρουνό και τηλεφωνείς.',
       a_en:'The ONLY safe home check is soapy water on a visible joint, with the room ventilated and no smell already present: bubbles mean a leak. Never with a flame. And even then, only a licensed engineer fixes it — you close the tap and phone.'}],
 vq:'μυρωδιά φυσικού αερίου τι κάνω', vq_en:'what to do if you smell gas'
},
{
 id:'power-cut', cat:'emerg', ico:'🔌', diff:1, risk:true,
 n:'Έμεινες χωρίς ρεύμα: πού φταίει', n_en:'The power is out: where the fault is',
 d:'Σε τρία λεπτά μαθαίνεις αν φταίει το σπίτι σου, το κτήριο ή η γειτονιά — και τι μπορείς να κάνεις μόνος.',
 d_en:'In three minutes you learn whether it is your flat, the building or the whole street — and what you can do yourself.',
 time:'10 λεπτά', time_en:'10 minutes', cost:'0 €', cost_en:'€0', ppl:'1', ppl_en:'1',
 pro:'Δεν ανοίγεις ποτέ το καπάκι του πίνακα και δεν αγγίζεις καλωδίωση μέσα του. Αν ο πίνακας είναι ζεστός, μαυρισμένος ή μυρίζει καμένο, ή αν η γενική δεν κρατά με όλες τις μερικές κατεβασμένες, κάλεσε αδειούχο ηλεκτρολόγο.',
 pro_en:'Never open the consumer unit cover or touch wiring inside it. If the panel is hot, blackened or smells burnt, or if the main will not hold with every circuit off, call a licensed electrician.',
 safety:['Στεγνά χέρια, στεγνό πάτωμα, φακός — όχι κερί δίπλα σε κουρτίνες.',
         'Αν υπάρχει μυρωδιά καμένου από τον πίνακα, μην τον ξαναανεβάσεις. Κάλεσε ηλεκτρολόγο.',
         'Αν έχει πλημμυρίσει, μην ακουμπήσεις τίποτα ηλεκτρικό.'],
 safety_en:['Dry hands, dry floor, a torch — not a candle next to curtains.',
            'If there is a burning smell from the panel, do not reset it. Call an electrician.',
            'If there has been flooding, touch nothing electrical.'],
 tools:['Φακός','Κινητό','Ο λογαριασμός ρεύματος (έχει τον αριθμό βλαβών)'],
 tools_en:['Torch','Phone','Your electricity bill (it has the fault number)'],
 mats:['—'], mats_en:['—'],
 steps:[
  {t:'Κοίτα έξω από το παράθυρο', t_en:'Look out of the window',
   d:'Έχουν ρεύμα οι γείτονες, τα φανάρια, οι πινακίδες; Αν όλη η γειτονιά είναι στο σκοτάδι, δεν φταις εσύ — είναι βλάβη δικτύου και δεν έχεις τίποτα να κάνεις παρά να το δηλώσεις.',
   d_en:'Do the neighbours, the street lights, the signs have power? If the whole street is dark it is not you — it is a network fault and there is nothing to do but report it.'},
  {t:'Δες τον πίνακά σου', t_en:'Look at your consumer unit',
   d:'Είναι κάποια ασφάλεια κατεβασμένη ή στη μέση; Είναι το ρελέ διαφυγής (το φαρδύ, με το κουμπί TEST) πεσμένο; Αυτό σου λέει αμέσως αν το πρόβλημα είναι μέσα στο σπίτι.',
   d_en:'Is a breaker down or in a middle position? Has the RCD (the wide one with the TEST button) tripped? That tells you at once whether the problem is inside the flat.'},
  {t:'Αν έπεσε το ρελέ, βρες τι το ρίχνει', t_en:'If the RCD tripped, find what trips it',
   d:'Κατέβασε ΟΛΕΣ τις μερικές ασφάλειες, ανέβασε τη γενική και το ρελέ, και μετά ανέβαζε τις μερικές μία-μία. Αυτή που ξαναρίχνει το ρελέ δείχνει το προβληματικό κύκλωμα. Μετά ξεσυνδέεις τις συσκευές του και τις βάζεις μία-μία.',
   d_en:'Switch every circuit off, bring the main and the RCD back up, then raise the circuits one at a time. The one that trips it again is the faulty circuit. Then unplug its appliances and add them back one by one.'},
  {t:'Έλεγξε αν είναι μόνο ένα δωμάτιο', t_en:'Check whether it is only one room',
   d:'Αν έσβησαν μόνο κάποια φώτα ή πρίζες, είναι μια μερική ασφάλεια. Αν έσβησαν τα πάντα αλλά οι γείτονες έχουν, κοίτα τη γενική και τον μετρητή σου.',
   d_en:'If only some lights or sockets are dead, it is one circuit breaker. If everything is dead but the neighbours have power, look at your main switch and your meter.'},
  {t:'Κοίτα τον μετρητή', t_en:'Check the meter',
   d:'Σε πολλά κτήρια υπάρχει ασφάλεια και στον μετρητή, στο κλιμακοστάσιο. Αν εκεί λείπει ρεύμα ενώ οι διπλανοί μετρητές δουλεύουν, είναι θέμα παροχής και το δηλώνεις.',
   d_en:'Many buildings have a fuse at the meter on the landing. If there is no power there while neighbouring meters work, it is a supply issue and you report it.'},
  {t:'Δήλωσε τη βλάβη', t_en:'Report the fault',
   d:'Κάλεσε τον αριθμό βλαβών του διαχειριστή δικτύου — αναγράφεται στον λογαριασμό ρεύματος (στην Ελλάδα, ΔΕΔΔΗΕ: 11500). Δώσε διεύθυνση, αριθμό παροχής και αν φταίει μόνο το δικό σου σπίτι.',
   d_en:'Call the network operator’s fault line — it is printed on your electricity bill (in Greece, DEDDIE: 11500). Give the address, the supply number, and whether it is only your home.'},
  {t:'Προστάτεψε τα τρόφιμα', t_en:'Protect the food',
   d:'Κράτα ψυγείο και καταψύκτη ΚΛΕΙΣΤΑ. Ένας γεμάτος καταψύκτης κρατά περίπου 24–48 ώρες κλειστός· ανοιγμένος, λίγες ώρες.',
   d_en:'Keep the fridge and freezer CLOSED. A full freezer holds roughly 24–48 hours closed; opened, a few hours.'},
  {t:'Πριν επανέλθει το ρεύμα', t_en:'Before the power returns',
   d:'Κατέβασε ή αποσύνδεσε ευαίσθητες συσκευές (υπολογιστή, τηλεόραση, λέβητα). Η επαναφορά συχνά συνοδεύεται από υπέρταση.',
   d_en:'Switch off or unplug sensitive equipment (computer, TV, boiler). Power coming back is often accompanied by a surge.'}],
 tips:['Φακός με μπαταρίες σε σταθερό, γνωστό σημείο. Το κινητό δεν είναι φακός όταν θα το χρειαστείς και για τηλέφωνο.',

{

 tools:['Καπάκι κατσαρόλας ή μεταλλικός δίσκος','Πυροσβεστική κουβέρτα','Πυροσβεστήρας ξηράς σκόνης ABC ή αφρού F'],

{
 id:'rad-bleed', cat:'heat', ico:'♨️', diff:1, risk:false,

 d:'Το καλοριφέρ ζεσταίνεται κάτω αλλά μένει κρύο πάνω. Δέκα λεπτά δουλειάς που ρίχνουν αισθητά τον λογαριασμό.',
 d_en:'The radiator is warm at the bottom but cold at the top. Ten minutes of work that noticeably cuts the bill.',
 time:'10 λεπτά ανά σώμα', time_en:'10 minutes per radiator', cost:'0–5 €', cost_en:'€0–5', ppl:'1', ppl_en:'1',
 safety:['Το νερό που θα βγει είναι καυτό και μαύρο. Γάντια, πανί, και ποτέ το πρόσωπό σου μπροστά στη βαλβίδα.',
         'Σε επιδαπέδια ή αυτόνομη θέρμανση με λέβητα, η θέρμανση πρέπει να είναι σβηστή και κρύα.'],
 safety_en:['The water that comes out is scalding and black. Gloves, a cloth, and never your face in front of the valve.',
            'With a boiler system, the heating must be off and cool.'],
 tools:['Κλειδί εξαέρωσης καλοριφέρ (ή μικρό ίσιο κατσαβίδι)','Λεκανάκι ή ποτήρι','Πανιά','Γάντια'],
 tools_en:['Radiator bleed key (or a small flat screwdriver)','Small bowl or cup','Cloths','Gloves'],
 mats:['—'], mats_en:['—'],
 steps:[
  {t:'Σβήσε τη θέρμανση και άσε να κρυώσει', t_en:'Turn the heating off and let it cool',
   d:'Περίμενε 30–60 λεπτά. Με ζεστό νερό μέσα, κινδυνεύεις να καείς και ο αέρας δεν έχει προλάβει να συγκεντρωθεί ψηλά.',
   d_en:'Wait 30–60 minutes. With hot water inside you risk scalding, and the air has not had time to gather at the top.'},
  {t:'Βρες ποια σώματα το χρειάζονται', t_en:'Find which radiators need it',
   d:'Πέρνα το χέρι πάνω σε κάθε σώμα όταν λειτουργεί. Ζεστό κάτω και κρύο πάνω σημαίνει αέρας. Κρύο παντού σημαίνει άλλο πρόβλημα — κλειστός διακόπτης ή κολλημένη βαλβίδα.',
   d_en:'Run your hand over each radiator while it is running. Warm at the bottom, cold at the top means air. Cold all over means something else — a closed valve or a stuck head.'},
  {t:'Ξεκίνα από τον κάτω όροφο', t_en:'Start on the lowest floor',
   d:'Δούλεψε από το χαμηλότερο και πιο κοντινό στον λέβητα σώμα προς το ψηλότερο και πιο μακρινό. Έτσι ο αέρας μαζεύεται προς την κατεύθυνση που τον βγάζεις.',
   d_en:'Work from the lowest, nearest-the-boiler radiator towards the highest and furthest. That way the air collects in the direction you are pushing it.'},
  {t:'Άνοιξε αργά τη βαλβίδα εξαέρωσης', t_en:'Open the bleed valve slowly',
   d:'Είναι η μικρή τετράγωνη βίδα στο πάνω πλάι του σώματος. Κράτα λεκανάκι από κάτω και γύρισε αριστερόστροφα ένα τέταρτο έως μισή στροφή. Θα ακουστεί σφύριγμα αέρα.',
   d_en:'It is the small square screw at the top side of the radiator. Hold the bowl underneath and turn anticlockwise a quarter to half a turn. You will hear air hissing.',
   warn:'Μην την ξεβιδώσεις τελείως. Βγαίνει, και τότε έχεις πίδακα καυτού νερού που δεν σταματά.',
   warn_en:'Do not unscrew it all the way. It comes out, and then you have a jet of scalding water that will not stop.'},

   d_en:'When the hiss stops and a steady dribble of water starts, the air is out. Tighten it — firmly but not brutally, brass strips easily.'},

   d:'Η εξαέρωση βγάζει νερό από το σύστημα και ρίχνει την πίεση. Δες το μανόμετρο: πρέπει να δείχνει 1–1,5 bar σε κρύο σύστημα. Αν έπεσε κάτω από 1, συμπλήρωσε.',
   d_en:'Bleeding removes water and drops the pressure. Check the gauge: it should read 1–1.5 bar cold. If it fell below 1, top it up.'},
  {t:'Άναψε και ξαναέλεγξε', t_en:'Fire it up and re-check',
   d:'Άναψε τη θέρμανση και μετά από 20 λεπτά πέρνα ξανά το χέρι σε όλα τα σώματα. Αν κάποιο μένει κρύο πάνω, επανάλαβε — μερικές φορές θέλει δεύτερο πέρασμα.',
   d_en:'Switch the heating on and after 20 minutes feel every radiator again. If one is still cold at the top, repeat — sometimes it takes a second pass.'}],
 tips:['Κάν’ το κάθε φθινόπωρο πριν ανάψεις για πρώτη φορά. Είναι η πιο φθηνή «συντήρηση θέρμανσης» που υπάρχει.',
       'Αν χρειάζεται εξαέρωση συνέχεια, μπαίνει αέρας από κάπου: πιθανή μικροδιαρροή ή πρόβλημα στο δοχείο διαστολής. Θέλει τεχνικό.',
       'Το νερό είναι μαύρο και λερώνει μόνιμα. Πετσέτα κάτω από κάθε σώμα πριν ξεκινήσεις.',
       'Μη σκεπάζεις τα σώματα με ρούχα ή έπιπλα — χάνεις μεγάλο μέρος της απόδοσης.'],
 tips_en:['Do it every autumn before the first firing. It is the cheapest heating maintenance there is.',

          'The water is black and stains permanently. A towel under every radiator before you start.',
          'Do not cover radiators with clothes or furniture — you lose a lot of their output.'],
 errs:['Εξαέρωση με ζεστό, γεμάτο σύστημα — εγκαύματα.',
       'Πλήρες ξεβίδωμα της βαλβίδας.',
       'Παράλειψη ελέγχου πίεσης μετά — ο λέβητας μπλοκάρει.',
       'Υπερβολικό σφίξιμο που σπάει το ορείχαλκο.'],
 errs_en:['Bleeding a hot, full system — scalds.',
          'Unscrewing the valve completely.',
          'Not checking pressure afterwards — the boiler locks out.',
          'Over-tightening and stripping the brass.'],
 faq:[{q:'Το σώμα είναι κρύο και πάνω και κάτω.', q_en:'The radiator is cold at the top and the bottom.',
       a:'Δεν είναι αέρας. Έλεγξε ότι ο διακόπτης του σώματος είναι ανοιχτός και ότι η θερμοστατική κεφαλή δεν έχει κολλήσει (βγάλ’ την και πάτα το πινάκι με τον αντίχειρα — πρέπει να μπαινοβγαίνει). Αν όλα τα σώματα είναι κρύα, το θέμα είναι στον λέβητα ή στον κυκλοφορητή.',
       a_en:'That is not air. Check the radiator valve is open and the thermostatic head is not stuck (take it off and press the pin — it should move freely). If every radiator is cold, the problem is the boiler or the pump.'}],

{
 id:'boiler-pressure', cat:'heat', ico:'🎛️', diff:1, risk:true,
 n:'Πίεση λέβητα: συμπλήρωση νερού', n_en:'Boiler pressure: topping up',
 d:'Ο λέβητας έσβησε και το μανόμετρο δείχνει κάτω από 1. Συμπληρώνεται σε πέντε λεπτά — αν ξέρεις πού να σταματήσεις.',
 d_en:'The boiler has cut out and the gauge reads below 1. It is a five-minute job — if you know when to stop.',

 pro:'Κάθε επέμβαση στο κύκλωμα αερίου, στον καυστήρα ή στα ηλεκτρονικά του λέβητα γίνεται από αδειούχο τεχνικό. Αν η πίεση πέφτει ξανά μέσα σε μέρες, υπάρχει διαρροή ή χαλασμένο δοχείο διαστολής — κάλεσε τεχνικό αντί να συμπληρώνεις συνέχεια.',
 pro_en:'Any work on the gas circuit, the burner or the boiler electronics is for a licensed engineer. If the pressure drops again within days there is a leak or a failed expansion vessel — call an engineer instead of topping up repeatedly.',
 safety:['Μη συμπληρώνεις με τον λέβητα ζεστό. Το νερό ζεσταίνεται και η πίεση ανεβαίνει άλλο μισό bar από μόνη της.',
         'Μην ξεπεράσεις τα 2 bar. Η βαλβίδα ασφαλείας θα ανοίξει και θα τρέξει νερό έξω.'],
 safety_en:['Do not top up while the boiler is hot. The water expands and the pressure rises another half bar on its own.',
            'Do not go past 2 bar. The safety valve will open and dump water outside.'],
 tools:['Φακός','Πανί'],
 tools_en:['Torch','Cloth'],
 mats:['—'], mats_en:['—'],
 steps:[
  {t:'Σβήσε τον λέβητα και άσε να κρυώσει', t_en:'Switch the boiler off and let it cool',
   d:'Η σωστή ένδειξη διαβάζεται μόνο σε κρύο σύστημα. Περίμενε τουλάχιστον μισή ώρα.',
   d_en:'The correct reading only exists on a cold system. Wait at least half an hour.'},
  {t:'Διάβασε το μανόμετρο', t_en:'Read the gauge',
   d:'Το στρογγυλό όργανο με τον δείκτη, συνήθως στην πρόσοψη ή κάτω από τον λέβητα. Σωστό εύρος σε κρύο: 1 έως 1,5 bar. Κάτω από 0,8 ο λέβητας συνήθως μπλοκάρει και δείχνει κωδικό σφάλματος.',
   d_en:'The round dial with a needle, usually on the front or underneath. Correct cold range: 1 to 1.5 bar. Below 0.8 the boiler usually locks out with an error code.'},
  {t:'Βρες τον κρουνό πλήρωσης', t_en:'Find the filling loop',

   d_en:'Under the boiler there is a silver braided hose with two small valves, or a lever/key. It is the connection to the mains water. Photograph it before touching it.'},

   d_en:'Turn the valve only slightly. You will hear water entering. Watch the gauge, not the valve.',
   tip:'Η πίεση ανεβαίνει πιο γρήγορα απ’ όσο περιμένεις. Δούλεψε με μικρές δόσεις των λίγων δευτερολέπτων.',

   d_en:'Leave the boxes closed and flat in the room for 48 hours first. Wood moves with temperature and humidity; laid cold, it will gap or buckle later.'},
  {t:'Έλεγξε την επιπεδότητα', t_en:'Check the subfloor is flat',
   d:'Πέρνα αλφάδι 2 m σε όλο το δάπεδο. Ανοχή 3 mm ανά 2 m. Κάθε κοιλιά ή καμπούρα θα ακούγεται σαν «κενό» κάτω από το πάτημα και θα σπάσει τα κουμπώματα. Διόρθωσε με αυτοεπιπεδούμενο.',
   d_en:'Run a 2 m level over the whole floor. Tolerance 3 mm per 2 m. Every dip or hump will feel hollow underfoot and will break the joints. Fix with self-levelling compound.'},
  {t:'Στρώσε το υπόστρωμα', t_en:'Lay the underlay',
   d:'Σε λωρίδες, χωρίς επικάλυψη, με τις ενώσεις κολλημένες με ταινία. Σε ισόγειο ή πάνω από μπετόν, το φράγμα υδρατμών είναι υποχρεωτικό — αλλιώς η υγρασία ανεβαίνει και φουσκώνει το δάπεδο.',
   d_en:'In strips, butted not overlapped, with the joints taped. On a ground floor or over concrete the vapour barrier is essential — otherwise moisture rises and swells the floor.'},
  {t:'Σχεδίασε τη διάταξη', t_en:'Plan the layout',
   d:'Οι σανίδες μπαίνουν παράλληλα στο μεγαλύτερο παράθυρο, ώστε οι αρμοί να μη «χτυπάνε» στο φως. Μέτρησε: αν η τελευταία σειρά βγαίνει κάτω από 5 cm, κόψε την πρώτη σειρά ώστε να μοιραστεί.',
   d_en:'Boards run parallel to the main window so the joints do not catch the light. Measure: if the last row works out under 5 cm wide, rip the first row so the two share the difference.'},
  {t:'Άφησε κενό διαστολής παντού', t_en:'Leave an expansion gap everywhere',
   d:'8–10 mm από κάθε τοίχο, κάσα, σωλήνα και σταθερό στοιχείο. Χρησιμοποίησε σφήνες. Αυτό είναι το πιο σημαντικό βήμα ολόκληρης της δουλειάς.',
   d_en:'8–10 mm from every wall, door casing, pipe and fixed object. Use wedges. This is the single most important step of the whole job.',
   warn:'Χωρίς κενό διαστολής, το δάπεδο θα «καμπουριάσει» στη μέση του δωματίου την πρώτη ζεστή περίοδο. Δεν διορθώνεται χωρίς να το ανοίξεις.',
   warn_en:'Without an expansion gap the floor will hump in the middle of the room in the first warm spell. It cannot be fixed without lifting it.'},
  {t:'Κούμπωσε με μετατοπισμένους αρμούς', t_en:'Click it together with staggered joints',
   d:'Κάθε σειρά ξεκινά με κομμάτι διαφορετικού μήκους, ώστε οι εγκάρσιοι αρμοί να απέχουν τουλάχιστον 30 cm από τη διπλανή σειρά. Χρησιμοποίησε το κομμένο κομμάτι της προηγούμενης σειράς.',
   d_en:'Each row starts with a different length so the end joints are at least 30 cm apart from the neighbouring row. Use the offcut from the previous row.'},
  {t:'Κόψε γύρω από σωλήνες και κάσες', t_en:'Cut around pipes and casings',
   d:'Για σωλήνα, τρύπησε 20 mm μεγαλύτερη τρύπα και κόψε το κομμάτι πίσω από αυτήν — μετά το κολλάς πίσω. Στις κάσες, πριόνισε την κάσα από κάτω κατά το πάχος του δαπέδου και πέρνα τη σανίδα από κάτω.',
   d_en:'For a pipe, drill a hole 20 mm oversize and cut the piece behind it out — then glue it back. At door casings, undercut the casing by the floor thickness and slide the board underneath.'},
  {t:'Βγάλε τις σφήνες και βάλε σοβατεπί', t_en:'Remove the wedges and fit the skirting',
   d:'Το σοβατεπί βιδώνεται ΣΤΟΝ ΤΟΙΧΟ, ποτέ στο δάπεδο — το δάπεδο πρέπει να μπορεί να κινείται από κάτω. Στις πόρτες, προφίλ μετάβασης.',
   d_en:'The skirting fixes TO THE WALL, never to the floor — the floor must be able to move underneath it. Threshold profiles at doorways.'}],
 tips:['Ανακάτεψε σανίδες από 3–4 κουτιά ταυτόχρονα, για να μη μαζευτούν οι πιο σκούρες σε ένα σημείο.',
       'Σε δωμάτια πάνω από 8 m μήκος ή σε συνεχόμενους χώρους, χρειάζεται ενδιάμεσο προφίλ διαστολής.',
       'Το laminate δεν πάει σε μπάνιο. Στην κουζίνα, σφράγισε τους αρμούς κοντά στο πλυντήριο με σιλικόνη.',
       'Κράτα 2–3 σανίδες για μελλοντική επισκευή — το ίδιο σχέδιο σε δύο χρόνια δεν θα υπάρχει.'],
 tips_en:['Mix boards from 3–4 boxes as you go so the darker ones do not bunch in one spot.',
          'In rooms over 8 m long, or through connected spaces, an intermediate expansion profile is needed.',
          'Laminate does not belong in a bathroom. In a kitchen, seal the joints near the washing machine with silicone.',
          'Keep 2–3 spare boards for future repairs — the same design will not exist in two years.'],
 errs:['Καθόλου ή πολύ μικρό κενό διαστολής.',
       'Σοβατεπί βιδωμένο στο δάπεδο, που το «κλειδώνει».',
       'Ανώμαλο υπόστρωμα που δεν διορθώθηκε.',
       'Αρμοί σε ευθεία γραμμή μεταξύ σειρών — αδύναμο και άσχημο.'],
 errs_en:['No expansion gap, or too small a one.',
          'Skirting screwed into the floor, locking it in place.',
          'An uneven subfloor left uncorrected.',
          'End joints lining up between rows — weak and ugly.'],
 faq:[{q:'Μπορώ να το στρώσω πάνω από πλακάκια;', q_en:'Can I lay it over tiles?',
       a:'Ναι, αν τα πλακάκια είναι σταθερά, επίπεδα και στεγνά. Έλεγξε τους αρμούς: αν είναι βαθιοί, χρειάζεται παχύτερο υπόστρωμα ή εξομάλυνση. Πρόσεξε το τελικό ύψος σε σχέση με τις πόρτες.',
       a_en:'Yes, if the tiles are sound, flat and dry. Check the grout lines: if they are deep you need a thicker underlay or levelling. Watch the final height against your doors.'}],
 vq:'τοποθέτηση laminate δαπέδου βήμα βήμα', vq_en:'how to install laminate flooring beginners'
},
{
 id:'floor-squeak', cat:'floor', ico:'🔇', diff:1, risk:false,
 n:'Πάτωμα που τρίζει', n_en:'A squeaky floor',
 d:'Το τρίξιμο είναι τριβή: δύο κομμάτια ξύλου που κινούνται μεταξύ τους. Βρίσκεις πού και το σταματάς.',
 d_en:'A squeak is friction: two pieces of wood moving against each other. You find where, and you stop it.',
 time:'1–3 ώρες', time_en:'1–3 hours', cost:'5–25 €', cost_en:'€5–25', ppl:'2 (ένας πατά, ένας ακούει)', ppl_en:'2 (one walks, one listens)',
 safety:['Πριν βιδώσεις σε δάπεδο, βεβαιώσου ότι από κάτω δεν περνούν σωλήνες ή καλώδια. Σε αμφιβολία, μη βιδώσεις.'],
 safety_en:['Before screwing into a floor, make sure no pipes or cables run beneath. If in doubt, do not screw.'],
 tools:['Δράπανο/κατσαβίδι','Ανιχνευτής δοκών','Κιμωλία ή χαρτάκια σήμανσης','Σπάτουλα λεπτή'],
 tools_en:['Drill/driver','Joist detector','Chalk or sticky notes','Thin putty knife'],
 mats:['Ξυλόβιδες κατάλληλου μήκους','Ταλκ ή γραφίτης σε σκόνη','Ξύλινες σφήνες','Ξυλόκολλα','Κερί'],
 mats_en:['Wood screws of the right length','Talc or powdered graphite','Wooden shims','Wood glue','Wax'],
 steps:[
  {t:'Χαρτογράφησε τα τριξίματα', t_en:'Map the squeaks',
   d:'Ένας περπατά αργά σε όλο το δωμάτιο, ο άλλος ακούει και σημαδεύει με χαρτάκια κάθε σημείο που τρίζει. Πάτα και με βάρος στη μία και στην άλλη πλευρά κάθε σημείου, για να βρεις ποια σανίδα κινείται.',
   d_en:'One person walks slowly over the whole room, the other listens and marks every squeaking spot with a sticky note. Press with weight either side of each spot to find which board moves.'},
  {t:'Ξεχώρισε το είδος του τριξίματος', t_en:'Identify the type of squeak',
   d:'Ψηλό «τσίριγμα» = δύο σανίδες τρίβονται μεταξύ τους. Βαθύ «γκρρ» με κίνηση = η σανίδα δεν πατά στη δοκό. Το πρώτο λύνεται με λίπανση, το δεύτερο με στερέωση.',
   d_en:'A high-pitched chirp means two boards rubbing together. A deep groan with movement means the board is not bearing on the joist. The first is a lubrication fix, the second a fastening fix.'},
  {t:'Λίπανση για τριβή σανίδα-με-σανίδα', t_en:'Lubricate for board-on-board friction',
   d:'Ρίξε ταλκ ή σκόνη γραφίτη στον αρμό και δούλεψέ την μέσα με λεπτή σπάτουλα ή πινέλο, πατώντας ταυτόχρονα τη σανίδα. Καθάρισε το περίσσιο. Απλό, αόρατο, και συχνά αρκεί.',
   d_en:'Work talc or powdered graphite into the joint with a thin knife or brush while flexing the board. Wipe off the excess. Simple, invisible, and often enough.'},
  {t:'Στερέωση σε δοκό (ξύλινο δάπεδο)', t_en:'Fix down to the joist (timber floor)',
   d:'Βρες τη δοκό με ανιχνευτή, τρύπησε οδηγό τρύπα και βίδωσε μέσα από τη σανίδα στη δοκό. Χώνεψε την κεφαλή και κάλυψέ την με ξυλόστοκο ή κερί στο χρώμα του ξύλου.',
   d_en:'Locate the joist with a detector, drill a pilot hole and screw through the board into the joist. Countersink the head and fill it with wood filler or colour-matched wax.'},
  {t:'Σφήνα από κάτω, αν υπάρχει πρόσβαση', t_en:'Shim from below, if you have access',
   d:'Αν από κάτω υπάρχει υπόγειο ή ψευδοροφή, η καλύτερη λύση: βάλε ξύλινη σφήνα με ξυλόκολλα στο κενό ανάμεσα σε δοκό και σανίδα. Χωρίς τρύπες στο εμφανές δάπεδο.',
   d_en:'If there is a basement or an accessible void below, that is the best fix: glue a wooden shim into the gap between joist and board. No holes in the visible floor.'},
  {t:'Laminate που τρίζει', t_en:'A squeaking laminate floor',
   d:'Εδώ σχεδόν πάντα φταίει η υποδομή: ανώμαλο δάπεδο ή απουσία κενού διαστολής. Έλεγξε πρώτα αν το δάπεδο πιέζει σε τοίχο ή σοβατεπί — κόψε το κενό και συχνά σταματά αμέσως.',
   d_en:'Here it is almost always the substrate: an uneven subfloor or no expansion gap. First check whether the floor is pressed against a wall or the skirting — cut the gap and it often stops immediately.'},
  {t:'Δοκίμασε ξανά', t_en:'Test again',
   d:'Ξαναπερπάτησε όλο το δωμάτιο. Τα τριξίματα συχνά μετακινούνται: διορθώνεις ένα και ακούς το επόμενο. Δούλεψε επαναληπτικά.',
   d_en:'Walk the whole room again. Squeaks often move: you fix one and hear the next. Work through it in rounds.'}],
 tips:['Τα δάπεδα τρίζουν περισσότερο τον χειμώνα, όταν η ξηρή ατμόσφαιρα συρρικνώνει το ξύλο. Ένας υγραντήρας μειώνει αισθητά το πρόβλημα.',
       'Μη βιδώσεις ποτέ σε δάπεδο πάνω από ενδοδαπέδια θέρμανση.',
       'Σε παρκέ κολλητό, το τρίξιμο σημαίνει ξεκόλλημα — εκεί θέλει ειδικό, όχι βίδα.'],
 tips_en:['Floors squeak more in winter, when dry air shrinks the timber. A humidifier noticeably reduces it.',
          'Never screw into a floor over underfloor heating.',
          'On glued parquet, a squeak means it has debonded — that needs a specialist, not a screw.'],
 errs:['Βίδωμα χωρίς να βρεθεί η δοκός — η βίδα δεν πιάνει και το τρίξιμο μένει.',
       'Πολύ μακριά βίδα που τρυπά σωλήνα ή καλώδιο.',
       'Λίπανση σε σημείο που το πρόβλημα είναι δομικό.'],
 errs_en:['Screwing without finding the joist — the screw grips nothing and the squeak stays.',
          'A screw so long it hits a pipe or cable.',
          'Lubricating where the problem is structural.'],
 faq:[{q:'Πρέπει να σηκώσω όλο το πάτωμα;', q_en:'Do I have to lift the whole floor?',
       a:'Σχεδόν ποτέ. Στη μεγάλη πλειοψηφία τα τριξίματα λύνονται τοπικά, από πάνω ή από κάτω. Σήκωμα χρειάζεται μόνο αν έχει υποχωρήσει η υποδομή ή υπάρχει υγρασία — και τότε το τρίξιμο είναι το μικρότερο πρόβλημα.',
       a_en:'Almost never. The vast majority of squeaks are fixed locally, from above or below. Lifting is only needed if the substructure has failed or there is damp — and then the squeak is the least of it.'}],
 vq:'πάτωμα που τρίζει πώς το φτιάχνω', vq_en:'how to fix a squeaky floor'
},

{
 id:'oven-clean', cat:'clean', ico:'🔥', diff:1, risk:false,
 n:'Καθαρισμός φούρνου χωρίς χημικά', n_en:'Cleaning the oven without harsh chemicals',
 d:'Καμένα λίπη που δεν φεύγουν με τίποτα. Φεύγουν — με σόδα και υπομονή μιας νύχτας, χωρίς τοξικά σπρέι.',
 d_en:'Baked-on grease that nothing shifts. It does shift — with baking soda and one night of patience, no toxic sprays.',
 time:'20 λεπτά + μία νύχτα', time_en:'20 minutes + overnight', cost:'2–5 €', cost_en:'€2–5', ppl:'1', ppl_en:'1',
 safety:['Ο φούρνος πρέπει να είναι κρύος και εκτός ρεύματος πριν βάλεις τα χέρια σου μέσα.',

 safety_en:['The oven must be cold and switched off before your hands go in.',

 tools:['Σφουγγάρι και σφουγγαράκι με σκληρή πλευρά','Πλαστική σπάτουλα ή ξύστρα κεραμικής εστίας','Πανιά μικροϊνών','Ψεκαστήρι','Παλιά οδοντόβουρτσα'],
 tools_en:['Sponge and a scouring pad','Plastic scraper or hob scraper','Microfibre cloths','Spray bottle','Old toothbrush'],

 mats_en:['Baking soda','Vinegar','Dish soap','Hot water','Lemon juice (optional)'],
 steps:[
  {t:'Άδειασε και βγάλε τα ράφια', t_en:'Empty it and take the shelves out',
   d:'Βγάλε σχάρες, ταψιά και, αν βγαίνουν εύκολα, τα πλαϊνά στηρίγματα. Θα τα μουλιάσεις ξεχωριστά.',

  {t:'Φτιάξε πάστα σόδας', t_en:'Make a soda paste',
   d:'Μισό φλιτζάνι μαγειρική σόδα με 2–3 κουταλιές νερό, μέχρι να γίνει σαν οδοντόκρεμα. Πρόσθεσε λίγο υγρό πιάτων για τα λίπη.',
   d_en:'Half a cup of baking soda with 2–3 spoons of water until it is like toothpaste. Add a little dish soap for the grease.'},
  {t:'Άπλωσε παντού εκτός από την αντίσταση', t_en:'Spread it everywhere except the element',
   d:'Με το χέρι (με γάντια) ή πινέλο, σε τοιχώματα, πάτο, οροφή και στο εσωτερικό της πόρτας. Πιο χοντρή στρώση στα καμένα σημεία. ΑΠΟΦΥΓΕ την αντίσταση και τον ανεμιστήρα.',
   d_en:'By hand (gloved) or with a brush, over the walls, base, roof and the inside of the door. A thicker layer on the burnt patches. AVOID the heating element and the fan.',
   warn:'Καθαριστικό πάνω στην αντίσταση καίγεται και βγάζει αναθυμιάσεις στο επόμενο ψήσιμο.',
   warn_en:'Cleaner on the element burns off and gives fumes the next time you cook.'},
  {t:'Άφησέ το όλη τη νύχτα', t_en:'Leave it overnight',
   d:'8–12 ώρες. Η σόδα διαλύει τα λίπη μόνη της. Αυτό είναι το βήμα που αντικαθιστά το δυνατό χημικό — και δεν παρακάμπτεται.',
   d_en:'8–12 hours. The soda breaks the grease down on its own. This is the step that replaces the harsh chemical — and it cannot be skipped.'},
  {t:'Μούλιασε παράλληλα τις σχάρες', t_en:'Soak the shelves at the same time',
   d:'Στη μπανιέρα ή σε μεγάλη λεκάνη: πολύ ζεστό νερό, μια χούφτα σόδα και υγρό πιάτων. Άσε το ίδιο διάστημα.',

  {t:'Ξύσε και σκούπισε', t_en:'Scrape and wipe',

   d_en:'In the morning, scrape with the plastic scraper — it lifts off in flakes. Wipe with a damp cloth, rinsing it often. Toothbrush in the corners.'},
  {t:'Ψέκασε ξύδι για το τελείωμα', t_en:'Spray vinegar to finish',
   d:'Ψέκασε ξύδι πάνω στα υπολείμματα σόδας. Θα αφρίσει — αυτό διαλύει την τελευταία λευκή σκόνη. Σκούπισε με καθαρό νωπό πανί μέχρι να μη μένει τίποτα.',
   d_en:'Spray vinegar over any soda residue. It fizzes — that lifts the last of the white powder. Wipe with a clean damp cloth until nothing is left.'},
  {t:'Το τζάμι της πόρτας', t_en:'The door glass',
   d:'Πάστα σόδας, 30 λεπτά, και τρίψιμο με σφουγγαράκι. Για τη βρωμιά ΑΝΑΜΕΣΑ στα τζάμια, τα περισσότερα μοντέλα λύνονται από πάνω με δύο βίδες — δες πρώτα το εγχειρίδιο.',
   d_en:'Soda paste, 30 minutes, then a scouring pad. For dirt BETWEEN the panes, most models come apart from the top with two screws — check the manual first.'},
  {t:'Πρώτο ψήσιμο με ανοιχτό παράθυρο', t_en:'First bake with a window open',
   d:'Άναψε στους 200 °C για 15 λεπτά άδειο, με αερισμό, ώστε να φύγει κάθε υπόλειμμα πριν ξαναμαγειρέψεις.',
   d_en:'Run it empty at 200 °C for 15 minutes with ventilation, so any residue burns off before you cook again.'}],
 tips:['Βάλε ένα φύλλο αλουμινόχαρτο ή ταψί στον πάτο, κάτω από ό,τι μπορεί να στάξει. Καθαρίζεις σε 10 δευτερόλεπτα αντί για μια νύχτα.',
       'Σκούπισε τις φρέσκιες στάλες όσο ο φούρνος είναι ακόμη χλιαρός. Το καμένο λίπος είναι απλώς λίπος που το αγνόησες.',
       'Η λειτουργία πυρόλυσης, αν υπάρχει, τα κάνει όλα αυτά μόνη της — αλλά καίει πολύ ρεύμα και θέλει καλό αερισμό.'],
 tips_en:['Put foil or a tray on the base under anything that might drip. Ten seconds of cleaning instead of a whole night.',

 errs:['Καθαριστικό στην αντίσταση ή στον ανεμιστήρα.',

},
{
 id:'limescale', cat:'clean', ico:'🚿', diff:1, risk:false,
 n:'Άλατα σε βρύσες, ντουζιέρα και συσκευές', n_en:'Limescale on taps, shower and appliances',

   d_en:'Pull out the fridge and the cooker, vacuum behind and underneath, degrease. That is where they live and lay. Take the vacuum bag straight outside.'},
  {t:'Σφράγισε τις εισόδους', t_en:'Seal the entry points',
   d:'Σιλικόνη σε χαραμάδες, γύρω από σωλήνες, στους αρμούς του πάγκου. Δικτυωτό σε γρίλιες. Τάπα στα σιφώνια που δεν χρησιμοποιείς. Χωρίς αυτό, όσα και να σκοτώσεις, θα έρχονται καινούρια.',
   d_en:'Silicone into cracks, around pipes, at worktop joints. Mesh on grilles. A plug in unused floor drains. Without this, however many you kill, new ones keep arriving.'},
  {t:'Τζελ, όχι σπρέι', t_en:'Gel, not spray',
   d:'Βάλε μικρές σταγόνες τζελ (σαν κεφάλι καρφίτσας) κάθε 20–30 cm σε γωνίες, πίσω από ντουλάπια, κοντά στα σημεία που είδες. Η κατσαρίδα τρώει, γυρίζει στη φωλιά και μεταφέρει τη δραστική ουσία στις υπόλοιπες.',
   d_en:'Place small dots of gel (pinhead sized) every 20–30 cm in corners, behind cupboards, near where you saw them. The cockroach eats, returns to the nest and carries the active ingredient to the rest.',
   tip:'Το σπρέι διώχνει τα έντομα από το σημείο και τα σκορπίζει στο υπόλοιπο σπίτι — και ακυρώνει το τζελ. Διάλεξε ένα από τα δύο, και το σωστό είναι το τζελ.',
   tip_en:'Spray drives them away from the spot and scatters them through the rest of the house — and it neutralises the gel. Pick one, and the right one is the gel.'},
  {t:'Μυρμήγκια: ακολούθησε τη γραμμή', t_en:'Ants: follow the trail',
   d:'Μην τα σκοτώσεις. Βρες πού μπαίνουν και πού πηγαίνουν, και βάλε δόλωμα ΠΑΝΩ στη γραμμή. Θα το μεταφέρουν στη φωλιά. Για μερικές μέρες θα δεις περισσότερα μυρμήγκια — αυτό σημαίνει ότι δουλεύει.',
   d_en:'Do not kill them. Find where they enter and where they go, and put bait ON the trail. They carry it back to the nest. For a few days you will see more ants — that means it is working.'},
  {t:'Βάλε παγίδες παρακολούθησης', t_en:'Put monitoring traps down',
   d:'Κολλητικές παγίδες σε 4–6 σημεία. Δεν λύνουν το πρόβλημα, αλλά σου λένε αν ο πληθυσμός πέφτει και πού βρίσκεται η εστία. Έλεγχε τες κάθε εβδομάδα.',
   d_en:'Sticky traps at 4–6 points. They do not solve the problem, but they tell you whether numbers are falling and where the focus is. Check them weekly.'},
  {t:'Επανάλαβε σε 2–3 εβδομάδες', t_en:'Repeat in 2–3 weeks',
   d:'Τα αυγά δεν επηρεάζονται από τα δολώματα. Ανανέωσε το τζελ όταν ξεραθεί ή καταναλωθεί, ώστε να πιάσεις και τη νέα γενιά.',
   d_en:'Eggs are unaffected by baits. Refresh the gel when it dries out or is eaten, so you catch the next generation too.'}],
 tips:['Σε πολυκατοικία, η προσβολή ταξιδεύει από διαμέρισμα σε διαμέρισμα μέσα από τις κατακόρυφες σωληνώσεις. Μια λύση μόνο στο δικό σου σπίτι σπάνια αρκεί — μίλα στη διαχείριση.',
       'Οι κατσαρίδες που βλέπεις είναι μικρό ποσοστό του πληθυσμού. Μία τη μέρα σημαίνει δεκάδες τη νύχτα.',
       'Το βορικό οξύ σε λεπτή σκόνη σε κρυφά σημεία δουλεύει, αλλά αργά και μόνο εκεί που μένει στεγνό.',
       'Δάφνη, ξύδι και άλλες «σπιτικές λύσεις» απωθούν προσωρινά· δεν εξοντώνουν φωλιά.'],
 tips_en:['In a block of flats the infestation travels between flats through the service risers. Treating only your flat is rarely enough — talk to the building management.',
          'The cockroaches you see are a small fraction of the population. One a day means dozens at night.',
          'Boric acid dusted thinly in hidden places works, but slowly and only where it stays dry.',
          'Bay leaves, vinegar and other home remedies repel temporarily; they do not destroy a nest.'],
 errs:['Σπρέι πάνω στο τζελ — το ακυρώνει εντελώς.',
       'Πολύ μεγάλες ποσότητες τζελ σε λίγα σημεία, αντί για πολλές μικρές σε πολλά.',
       'Καθάρισμα των μυρμηγκιών πριν προλάβουν να μεταφέρουν το δόλωμα.',
       'Καμία σφράγιση εισόδων — αέναη επανάληψη.'],
 errs_en:['Spraying over the gel — it cancels it completely.',
          'Big blobs of gel in a few places instead of many small dots in many places.',
          'Wiping the ants away before they carry the bait home.',
          'No sealing of entry points — an endless cycle.'],
 faq:[{q:'Είδα μία κατσαρίδα. Έχω πρόβλημα;', q_en:'I saw one cockroach. Do I have a problem?',
       a:'Μία περαστική από τον διάδρομο ή την αποχέτευση δεν σημαίνει προσβολή. Βάλε δύο κολλητικές παγίδες και παρακολούθησε δύο εβδομάδες. Αν πιαστούν κι άλλες, ή αν δεις μικρές (νεαρές), υπάρχει φωλιά μέσα στο σπίτι και πρέπει να δράσεις.',
       a_en:'One wandering in from the hallway or a drain does not mean an infestation. Put down two sticky traps and watch for two weeks. If more are caught, or you see small ones (nymphs), there is a nest inside and you need to act.'}],
 vq:'πώς ξεφορτώνομαι κατσαρίδες τζελ', vq_en:'how to get rid of cockroaches bait gel'
},

/* ---------------- ΔΙΑΚΟΣΜΗΣΗ ---------------- */
{
 id:'hang-pictures', cat:'deco', ico:'🖼️', diff:1, risk:false,
 n:'Κρέμασμα κάδρων και σύνθεση τοίχου', n_en:'Hanging pictures and arranging a wall',
 d:'Το σωστό ύψος δεν είναι θέμα γούστου — υπάρχει κανόνας. Και η σύνθεση σχεδιάζεται στο πάτωμα, όχι στον τοίχο.',
 d_en:'The right height is not a matter of taste — there is a rule. And the arrangement is planned on the floor, not on the wall.',
 time:'30 λεπτά έως 2 ώρες', time_en:'30 minutes to 2 hours', cost:'5–25 €', cost_en:'€5–25', ppl:'1–2', ppl_en:'1–2',
 safety:['Έλεγξε για καλώδια πριν τρυπήσεις, ειδικά πάνω από πρίζες και διακόπτες.',
         'Βαριά κάδρα πάνω από κρεβάτι ή καναπέ: χρησιμοποίησε διπλή στήριξη και έλεγξε το φορτίο.'],
 safety_en:['Check for cables before drilling, especially above sockets and switches.',
            'Heavy frames above a bed or sofa: use two fixings and check the load.'],
 tools:['Δράπανο','Αλφάδι','Μέτρο και μολύβι','Σφυρί','Χαρτί εφημερίδας ή χαρτί περιτυλίγματος','Χαρτοταινία'],
 tools_en:['Drill','Spirit level','Tape measure and pencil','Hammer','Newspaper or wrapping paper','Masking tape'],
 mats:['Γάντζοι κάδρων ή βύσματα και βίδες','Αυτοκόλλητα λαστιχάκια για τις κάτω γωνίες','Κορδόνι ή σύρμα ανάρτησης'],
 mats_en:['Picture hooks, or plugs and screws','Small adhesive bumpers for the bottom corners','Hanging cord or wire'],
 steps:[
  {t:'Το ύψος: κέντρο στα 145 cm', t_en:'The height: centre at 145 cm',
   d:'Το κέντρο του κάδρου μπαίνει στα 145–150 cm από το δάπεδο. Είναι το ύψος ματιού και ο κανόνας που χρησιμοποιούν τα μουσεία. Σχεδόν όλοι κρεμούν πολύ ψηλά.',
   d_en:'The centre of the picture goes 145–150 cm off the floor. That is eye level, and the rule museums use. Almost everyone hangs too high.'},
  {t:'Πάνω από έπιπλο: 15–20 cm', t_en:'Above furniture: 15–20 cm',
   d:'Όταν το κάδρο σχετίζεται με καναπέ, κονσόλα ή κρεβάτι, το κάτω άκρο μπαίνει 15–20 cm πάνω από το έπιπλο, ώστε να διαβάζονται ως μία ενότητα. Το πλάτος του κάδρου (ή της σύνθεσης) καλό είναι να είναι περίπου τα 2/3 του πλάτους του επίπλου.',
   d_en:'When the picture relates to a sofa, console or bed, its bottom edge goes 15–20 cm above the furniture so the two read as one unit. The picture (or the group) should be about two-thirds the width of the furniture.'},
  {t:'Σχεδίασε τη σύνθεση στο πάτωμα', t_en:'Lay the arrangement out on the floor',
   d:'Για ομάδα κάδρων, στρώσε τα στο πάτωμα και δοκίμασε διατάξεις μέχρι να σου αρέσει. Κράτα σταθερό κενό 5–8 cm ανάμεσά τους. Το μάτι διαβάζει την ομάδα ως ένα σχήμα.',
   d_en:'For a group, lay them on the floor and try arrangements until one works. Keep a constant 5–8 cm gap between them. The eye reads the group as a single shape.'},
  {t:'Φτιάξε χάρτινα πατρόν', t_en:'Make paper templates',
   d:'Αποτύπωσε κάθε κάδρο σε χαρτί, κόψε το, και κόλλησε τα χαρτιά στον τοίχο με χαρτοταινία. Δες τα για μια μέρα, μετακίνησέ τα ελεύθερα. Μηδέν τρύπες μέχρι να αποφασίσεις.',
   d_en:'Trace each frame onto paper, cut it out, and tape the shapes to the wall. Live with them for a day and move them freely. No holes until you have decided.'},
  {t:'Σημάδεψε το σημείο του γάντζου, όχι του κάδρου', t_en:'Mark the hook, not the frame',
   d:'Το σημείο του καρφιού δεν είναι η κορυφή του κάδρου. Μέτρησε πόσο «κατεβαίνει» το κορδόνι όταν το τραβήξεις τεντωμένο, και αφαίρεσέ το από το ύψος της κορυφής. Σημάδεψε πάνω στο χάρτινο πατρόν.',
   d_en:'The nail position is not the top of the frame. Measure how far the cord drops when pulled taut, and subtract that from the top edge height. Mark it on the paper template.'},
  {t:'Τρύπησε και στερέωσε σωστά', t_en:'Drill and fix properly',
   d:'Ελαφρύ κάδρο σε συμπαγή τοίχο: ειδικό καρφάκι κάδρου. Πάνω από 5 kg ή σε γυψοσανίδα: βύσμα κατάλληλο για τον τοίχο. Πολύ βαρύ ή μεγάλο: δύο σημεία στήριξης, που το κρατούν και ίσιο.',
   d_en:'A light frame on a solid wall: a picture pin. Over 5 kg or on plasterboard: a fixing suited to that wall. Very heavy or wide: two fixings, which also keep it straight.'},
  {t:'Αλφάδιασε και σταθεροποίησε', t_en:'Level it and stop it moving',
   d:'Βάλε το αλφάδι πάνω στο κάδρο και ρύθμισε. Κόλλησε δύο μικρά λαστιχάκια στις κάτω γωνίες: κρατούν το κάδρο ίσιο, το εμποδίζουν να στραβώνει και αφήνουν τον τοίχο να αναπνέει.',
   d_en:'Put the level on the frame and adjust. Stick two small bumpers on the bottom corners: they keep it straight, stop it drifting, and let the wall breathe.'}],
 tips:['Σε ομάδα διαφορετικών μεγεθών, ευθυγράμμισε είτε τον οριζόντιο άξονα του κέντρου, είτε μία άκρη. Τυχαία διάταξη χωρίς κανέναν κοινό άξονα φαίνεται πάντα ακατάστατη.',
       'Σε σκάλα, ακολούθησε την κλίση: το κέντρο κάθε κάδρου στα 145 cm από το σκαλοπάτι που του αντιστοιχεί.',
       'Μεγάλο κάδρο σε μικρό τοίχο δείχνει καλύτερα από μικρό σε μεγάλο. Στην αμφιβολία, διάλεξε το μεγαλύτερο.',
       'Απόφυγε άμεσο ηλιακό φως σε φωτογραφίες και έργα — ξεθωριάζουν μόνιμα.'],
 tips_en:['In a mixed-size group, align either the horizontal centre line or one edge. A random arrangement with no shared axis always looks messy.',
          'On a staircase, follow the slope: each picture centred 145 cm above its own step.',
          'A large picture on a small wall looks better than a small one on a big wall. When in doubt, go bigger.',
          'Keep photographs and artwork out of direct sunlight — they fade permanently.'],
 errs:['Κρέμασμα πολύ ψηλά — το πιο συχνό λάθος διακόσμησης.',
       'Τρύπες πριν δοκιμαστεί η θέση με χαρτί.',
       'Μέτρηση από την κορυφή του κάδρου αντί από το σημείο του κορδονιού.',
       'Ένα σημείο στήριξης σε φαρδύ κάδρο, που στραβώνει κάθε φορά που κλείνει η πόρτα.'],
 errs_en:['Hanging too high — the single most common decorating mistake.',
          'Drilling before testing the position with paper.',
          'Measuring from the top of the frame instead of the cord point.',
          'One fixing on a wide frame, which tilts every time a door closes.'],
 faq:[{q:'Πώς κρεμάω χωρίς να τρυπήσω τον τοίχο;', q_en:'How do I hang without drilling?',
       a:'Αυτοκόλλητοι γάντζοι βαρέως τύπου κρατούν 2–5 kg σε λεία, καθαρή, βαμμένη επιφάνεια — όχι σε ταπετσαρία, σε σοβά που ξεφλουδίζει ή σε φρέσκια μπογιά κάτω των 4 εβδομάδων. Καθάρισε πρώτα με οινόπνευμα και περίμενε μία ώρα πριν φορτώσεις.',
       a_en:'Heavy-duty adhesive strips hold 2–5 kg on a smooth, clean, painted surface — not on wallpaper, flaking plaster, or paint less than four weeks old. Clean with alcohol first and wait an hour before loading.'}],
 vq:'σε τι ύψος κρεμάω κάδρα σύνθεση τοίχου', vq_en:'how high to hang pictures gallery wall'
},

/* ---------------- ΚΙΝΗΤΟ & ΤΗΛΕΟΡΑΣΗ ---------------- */
{
 id:'phone-battery', cat:'phone', ico:'🔋', diff:1, risk:false,
 n:'Κινητό που ξεφορτίζει γρήγορα ή πάει αργά', n_en:'A phone that drains fast or runs slow',
 d:'Πριν αγοράσεις καινούριο, δες τι πραγματικά συμβαίνει. Τις μισές φορές φταίει η μπαταρία και όχι το τηλέφωνο.',
 d_en:'Before buying a new one, find out what is actually happening. Half the time it is the battery, not the phone.',
 time:'30 λεπτά', time_en:'30 minutes', cost:'0–70 €', cost_en:'€0–70', ppl:'1', ppl_en:'1',
 pro:'Η αντικατάσταση μπαταρίας σε σύγχρονο κινητό απαιτεί θέρμανση της κόλλας, αποσύνδεση εύθραυστων καλωδιοταινιών και επαναστεγανοποίηση. Οι μπαταρίες λιθίου παίρνουν φωτιά αν τρυπηθούν ή λυγίσουν. Αν δεν έχεις τα εργαλεία και την εμπειρία, δώσ’ το σε επισκευαστή — κοστίζει λίγα δεκάδες ευρώ.',
 pro_en:'Replacing a battery in a modern phone needs heat to soften adhesive, disconnecting fragile ribbon cables, and resealing. Lithium batteries catch fire if punctured or bent. Without the tools and experience, take it to a repair shop — it costs a few tens of euros.',
 safety:['Ποτέ μη λυγίσεις, τρυπήσεις ή ζορίσεις μπαταρία λιθίου.',
         'Φουσκωμένη μπαταρία (η οθόνη σηκώνεται, το πίσω καπάκι ανοίγει) είναι άμεσος κίνδυνος: σταμάτα τη φόρτιση, μην πιέσεις, και πήγαινέ το σε επισκευαστή σήμερα.',
         'Μη φορτίζεις πάνω σε κρεβάτι, καναπέ ή κάτω από μαξιλάρι.'],
 safety_en:['Never bend, puncture or force a lithium battery.',
            'A swollen battery (the screen lifts, the back panel gapes) is an immediate hazard: stop charging, do not press it, and take it to a repair shop today.',
            'Do not charge on a bed, a sofa or under a pillow.'],
 tools:['Οι ρυθμίσεις του κινητού','Φορτιστής του κατασκευαστή','Πανί μικροϊνών','Οδοντογλυφίδα ή μαλακή βούρτσα'],
 tools_en:['The phone’s own settings','The maker’s charger','Microfibre cloth','Toothpick or soft brush'],
 mats:['—'], mats_en:['—'],
 steps:[
  {t:'Δες την υγεία της μπαταρίας', t_en:'Check the battery health',
   d:'Σε iPhone: Ρυθμίσεις → Μπαταρία → Υγεία μπαταρίας. Σε Android: Ρυθμίσεις → Μπαταρία (ή εφαρμογή του κατασκευαστή). Κάτω από 80% μέγιστη χωρητικότητα σημαίνει ότι η μπαταρία είναι στο τέλος της — αυτό εξηγεί τα πάντα.',
   d_en:'On iPhone: Settings → Battery → Battery Health. On Android: Settings → Battery (or the maker’s app). Below 80% maximum capacity means the battery is worn out — that explains everything.'},
  {t:'Βρες ποια εφαρμογή τρώει τη μπαταρία', t_en:'Find which app eats the battery',
   d:'Στην ίδια οθόνη υπάρχει λίστα κατανάλωσης ανά εφαρμογή. Συνήθεις ένοχοι: κοινωνικά δίκτυα, χάρτες που μένουν ανοιχτοί, εφαρμογές με συνεχή τοποθεσία. Περιόρισε την τοποθεσία σε «κατά τη χρήση» και κλείσε την ανανέωση στο παρασκήνιο όπου δεν τη χρειάζεσαι.',
   d_en:'The same screen lists consumption per app. Usual suspects: social apps, maps left running, anything using constant location. Set location to “while using” and turn off background refresh where you do not need it.'},
  {t:'Οθόνη: η μεγαλύτερη κατανάλωση', t_en:'The screen: the biggest drain',
   d:'Χαμήλωσε τη φωτεινότητα, βάλε αυτόματη, μείωσε τον χρόνο μέχρι το κλείδωμα σε 30 δευτερόλεπτα. Σε οθόνη OLED, το σκούρο θέμα εξοικονομεί πραγματικά ενέργεια.',
   d_en:'Lower the brightness, use auto, and cut the auto-lock to 30 seconds. On an OLED screen, dark mode genuinely saves power.'},
  {t:'Ελευθέρωσε χώρο', t_en:'Free up storage',
   d:'Κινητό με λιγότερο από 10% ελεύθερο χώρο γίνεται αισθητά πιο αργό. Σβήσε εφαρμογές που δεν χρησιμοποιείς, καθάρισε τη μνήμη του browser, και ανέβασε φωτογραφίες σε cloud πριν τις διαγράψεις τοπικά.',
   d_en:'A phone with under 10% free storage becomes noticeably slower. Delete unused apps, clear the browser cache, and back photos up to the cloud before deleting them locally.'},
  {t:'Ενημέρωσε και επανεκκίνησε', t_en:'Update and restart',
   d:'Ενημερώσεις συστήματος και εφαρμογών διορθώνουν συχνά προβλήματα κατανάλωσης. Και μια απλή επανεκκίνηση μία φορά την εβδομάδα λύνει περισσότερα απ’ όσο φαντάζεσαι.',
   d_en:'System and app updates often fix consumption bugs. And a simple restart once a week solves more than you would think.'},
  {t:'Καθάρισε τη θύρα φόρτισης', t_en:'Clean the charging port',
   d:'Χνούδι από την τσέπη συσσωρεύεται στη θύρα και εμποδίζει την πλήρη επαφή. Με σβηστό κινητό, καθάρισε προσεκτικά με οδοντογλυφίδα ή μαλακή βούρτσα. Ποτέ μεταλλικό αντικείμενο.',
   d_en:'Pocket lint packs into the port and stops full contact. With the phone off, clear it carefully with a toothpick or soft brush. Never anything metal.'},
  {t:'Συνήθειες φόρτισης που παρατείνουν τη ζωή', t_en:'Charging habits that extend life',
   d:'Κράτα το ανάμεσα σε 20% και 80% όποτε γίνεται. Απόφυγε τη ζέστη — φόρτιση στον ήλιο ή μέσα σε χοντρή θήκη φθείρει τη μπαταρία γρηγορότερα από οτιδήποτε άλλο. Ενεργοποίησε την «βελτιστοποιημένη φόρτιση» αν υπάρχει.',
   d_en:'Keep it between 20% and 80% where you can. Avoid heat — charging in the sun or inside a thick case wears a battery faster than anything else. Turn on optimised charging if your phone offers it.'},
  {t:'Αποφάσισε: μπαταρία ή νέο κινητό', t_en:'Decide: battery or new phone',
   d:'Αν η υγεία είναι κάτω από 80% και το κινητό κατά τα άλλα δουλεύει, η αλλαγή μπαταρίας κοστίζει ένα κλάσμα του νέου και το επαναφέρει σχεδόν πλήρως. Αν δεν παίρνει πια ενημερώσεις ασφαλείας, τότε είναι ώρα για αντικατάσταση.',
   d_en:'If health is below 80% and the phone is otherwise fine, a battery replacement costs a fraction of a new phone and restores it almost fully. If it no longer receives security updates, then it is time to replace it.'}],
 tips:['Κράτα αντίγραφο ασφαλείας πριν από κάθε επισκευή ή ενημέρωση. Είναι το μόνο βήμα που δεν αναιρείται.',
       'Οι φθηνοί φορτιστές χωρίς πιστοποίηση φορτίζουν πιο αργά, ζεσταίνονται και φθείρουν τη μπαταρία. Δεν αξίζει η οικονομία.',
       'Η μπαταρία χάνει περίπου 20% της χωρητικότητάς της στα 2–3 χρόνια κανονικής χρήσης. Είναι φυσιολογικό, όχι βλάβη.',
       'Πριν πουλήσεις ή δώσεις κινητό: αποσύνδεση λογαριασμού, εργοστασιακή επαναφορά, και επιβεβαίωση ότι έχεις τα αρχεία σου.'],
 tips_en:['Back up before any repair or update. It is the one step that cannot be undone.',
          'Cheap uncertified chargers charge slower, run hot and wear the battery. The saving is not worth it.',
          'A battery loses roughly 20% of its capacity over 2–3 years of normal use. That is normal, not a fault.',
          'Before selling or passing a phone on: sign out of the account, factory reset, and confirm you have your files.'],
 errs:['Αγορά νέου κινητού ενώ έφταιγε μόνο η μπαταρία.',
       'Φόρτιση σε πολύ ζεστό περιβάλλον.',
       'Καθάρισμα θύρας με μεταλλικό αντικείμενο — καταστρέφει τις επαφές.',
       'Αγνόηση φουσκωμένης μπαταρίας.'],
 errs_en:['Buying a new phone when only the battery was worn.',
          'Charging in a hot place.',

const S = { cat:'all', filt:'', q:'', open:null, tab:'over' };

function lsGet(k, d){ try { const v = localStorage.getItem(k); return v===null?d:v; } catch(e){ return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

let FAVS = [];
try { FAVS = JSON.parse(lsGet('diy_fav','[]')) || []; } catch(e){ FAVS = []; }
function isFav(id){ return FAVS.indexOf(id) !== -1; }
function toggleFav(id){
  const i = FAVS.indexOf(id);
  if (i === -1) { FAVS.push(id); toast(t('addFav')); } else { FAVS.splice(i,1); toast(t('remFav')); }
  lsSet('diy_fav', JSON.stringify(FAVS));
}
function getProg(id){
  try { const v = JSON.parse(lsGet('diy_p_'+id,'[]')); return Array.isArray(v)?v:[]; } catch(e){ return []; }
}
function setProg(id, arr){ lsSet('diy_p_'+id, JSON.stringify(arr)); }
function progPct(task){
  const done = getProg(task.id).length, tot = task.steps.length;
  return tot ? Math.round(done*100/tot) : 0;
}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

let toastT = null;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('on'), 2200);
}

function applyTheme(){
  const th = lsGet('diy_theme','auto');
  if (th === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', th);
}
$('#themeBtn').addEventListener('click', () => {
  const order = ['auto','light','dark'];
  const cur = lsGet('diy_theme','auto');
  const next = order[(order.indexOf(cur)+1) % 3];
  lsSet('diy_theme', next);
  applyTheme();
  toast(next === 'auto' ? (curLang==='en'?'Theme: automatic':'Θέμα: αυτόματο')
      : next === 'light' ? (curLang==='en'?'Theme: light':'Θέμα: φωτεινό')
                         : (curLang==='en'?'Theme: dark':'Θέμα: σκοτεινό'));
});

$('#langBtn').addEventListener('click', () => {
  curLang = (curLang === 'en') ? 'el' : 'en';
  lsSet('diy_lang', curLang);
  renderAll();
  if (S.open) openTask(S.open, true);
});

function catCount(id){
  if (id === 'all') return TASKS.length;
  return TASKS.filter(x => x.cat === id).length;
}
function renderCats(){
  $('#catbar').innerHTML = CATS.map(c =>

     </button>`).join('');

    b.addEventListener('click', () => { S.cat = b.dataset.cat; renderCats(); renderGrid(); window.scrollTo({top:0,behavior:'smooth'}); }));

/* =====================================================================

   ===================================================================== */
function catOf(id){ const c = CATS.find(x => x.id === id); return c ? c : {ico:'🔧', n:'', n_en:''}; }

function matches(x, q){
  if (!q) return true;
  const bag = [L(x,'n'), L(x,'d'), L(catOf(x.cat),'n'),
               (L(x,'tools')||[]).join(' '), (L(x,'mats')||[]).join(' '),
               (x.steps||[]).map(s => L(s,'t')).join(' ')].join(' ').toLowerCase();
  return q.split(/\s+/).every(w => bag.indexOf(w) !== -1);
}

function filtered(){
  const q = S.q.trim().toLowerCase();
  return TASKS.filter(x => {
    if (S.cat !== 'all' && x.cat !== S.cat) return false;
    if (S.filt === 'd1' && x.diff !== 1) return false;
    if (S.filt === 'd2' && x.diff !== 2) return false;
    if (S.filt === 'd3' && x.diff !== 3) return false;
    if (S.filt === 'fav' && !isFav(x.id)) return false;
    if (S.filt === 'started' && progPct(x) === 0) return false;
    return matches(x, q);
  });
}

function diffLabel(d){ return d===1 ? t('easy') : d===2 ? t('medium') : t('hard'); }

function renderGrid(){
  const list = filtered();
  $('#resline').textContent = list.length === 1 ? t('result1') : t('results', {N:list.length});
  const empty = $('#empty');
  if (!list.length){
    $('#grid').innerHTML = '';
    empty.hidden = false;
    $('#emptyTxt').textContent = S.filt==='fav' ? t('noFav') : S.filt==='started' ? t('noStarted') : t('noRes');
    return;
  }
  empty.hidden = true;
  $('#grid').innerHTML = list.map(x => {
    const pct = progPct(x);
    return `<button class="card" data-id="${x.id}">
      <div class="c-top">
        <div class="c-ico">${x.ico}</div>
        <div class="c-hd">
          <div class="c-name">${esc(L(x,'n'))}</div>
          <div class="c-cat">${catOf(x.cat).ico} ${esc(L(catOf(x.cat),'n'))}</div>
        </div>
        <span class="c-fav${isFav(x.id)?' on':''}" data-fav="${x.id}" role="button" aria-label="fav">${isFav(x.id)?'★':'☆'}</span>
      </div>
      <div class="c-desc">${esc(L(x,'d'))}</div>
      <div class="c-meta">
        <span class="tag d${x.diff}">${esc(diffLabel(x.diff))}</span>
        <span class="tag">⏱ ${esc(L(x,'time'))}</span>
        <span class="tag">💶 ${esc(L(x,'cost'))}</span>
        ${x.risk ? `<span class="tag risk">⚠ ${esc(t('risk'))}</span>` : ''}
      </div>
      ${pct ? `<div class="prog"><i style="width:${pct}%"></i></div>` : ''}
    </button>`;
  }).join('');

  $('#grid').querySelectorAll('.card').forEach(c => c.addEventListener('click', e => {
    const fav = e.target.closest('[data-fav]');
    if (fav){ e.stopPropagation(); toggleFav(fav.dataset.fav); renderGrid(); return; }
    openTask(c.dataset.id);
  }));
}
