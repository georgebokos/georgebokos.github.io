<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#8B1515">
<meta name="description" content="Μάθε ελληνικούς παραδοσιακούς χορούς βήμα-βήμα, με αναλυτικές οδηγίες ποδιών και ρυθμού.">
<title>Ελληνικοί Παραδοσιακοί Χοροί</title>
<style>
:root{
  --bg:#F4EDE4;--card:#FFFAF5;--pri:#8B1515;--pri2:#6B1010;
  --acc:#C8941A;--acc2:#A07010;
  --tx:#1C0A06;--tx2:#5C3D2E;--tx3:#9B7B6A;
  --brd:#E0D0C0;--brd2:#C8B09A;
  --foot-r:#C0392B;--foot-b:#1A4F8A;--foot-p:#6B2F8A;
  --sh:0 2px 12px rgba(28,10,6,.08);--shl:0 8px 40px rgba(28,10,6,.18);
  --r:16px;--rs:10px;
  --beat-quick:#E8C870;--beat-slow:#8B1515;
}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--tx);max-width:680px;margin:0 auto;
  min-height:100vh;overflow-x:hidden;
}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:3px}

/* ── HEADER ── */
.site-header{
  padding:24px 20px 12px;
  display:flex;flex-direction:column;gap:4px;
}
.back-link{
  font-size:13px;color:var(--pri);text-decoration:none;
  display:inline-flex;align-items:center;gap:4px;
  opacity:.8;
}
.back-link:hover{opacity:1}
.header-content{margin-top:8px}
.header-eyebrow{
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--acc2);font-weight:600;
}
.header-title{
  font-size:clamp(26px,6vw,34px);font-weight:800;color:var(--tx);
  font-family:Georgia,'Times New Roman',serif;
  line-height:1.1;margin-top:4px;
}
.header-sub{
  font-size:14px;color:var(--tx2);margin-top:6px;line-height:1.5;
}
.header-divider{
  height:1px;background:var(--brd);margin:16px 20px 0;
}

/* ── FILTERS ── */
.filters{
  display:flex;gap:8px;padding:16px 20px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:7px 16px;border-radius:100px;
  border:1.5px solid var(--brd2);background:var(--card);
  color:var(--tx2);font-size:13px;font-weight:500;cursor:pointer;
  transition:all .2s;
}
.chip:hover{border-color:var(--pri);color:var(--pri)}
.chip.active{background:var(--pri);border-color:var(--pri);color:#fff}

/* ── DANCE CARDS ── */
.grid{
  display:flex;flex-direction:column;gap:20px;
  padding:4px 16px 100px;
}
.card{
  background:var(--card);border-radius:var(--r);
  box-shadow:var(--sh);overflow:hidden;cursor:pointer;
  border:1px solid var(--brd);
  transition:transform .2s,box-shadow .2s;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shl)}
.card:active{transform:translateY(0)}

.card-img{
  height:240px;position:relative;overflow:hidden;
}
.card-img img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block;
  transition:transform .4s;
}
.card:hover .card-img img{transform:scale(1.03)}
.card-img-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to bottom, transparent 30%, rgba(10,4,2,.72) 100%);
  z-index:1;
}
.card-img-text{
  position:absolute;bottom:0;left:0;right:0;
  padding:20px 18px 16px;z-index:2;
}
.card-name{
  font-size:22px;font-weight:800;color:#fff;
  font-family:Georgia,serif;line-height:1.1;
  text-shadow:0 2px 8px rgba(0,0,0,.4);
}
.card-region{
  font-size:12px;color:rgba(255,255,255,.8);
  margin-top:4px;letter-spacing:.05em;
}

.card-info{padding:14px 18px 16px}
.card-meta{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  margin-bottom:10px;
}
.badge{
  font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px;
  letter-spacing:.04em;
}
.badge-rhythm{
  background:rgba(139,21,21,.1);color:var(--pri);
  border:1px solid rgba(139,21,21,.2);
}
.badge-diff{
  background:rgba(200,148,26,.12);color:var(--acc2);
  border:1px solid rgba(200,148,26,.25);
}
.difficulty-dots{display:flex;gap:3px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%}
.dot.on{background:var(--acc)}
.dot.off{background:var(--brd2)}

.card-desc{
  font-size:13.5px;color:var(--tx2);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
}
.card-btn{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:14px;padding:10px 18px;border-radius:var(--rs);
  background:var(--pri);color:#fff;
  font-size:13.5px;font-weight:600;
  border:none;cursor:pointer;
  transition:background .2s;
}
.card-btn:hover{background:var(--pri2)}
.card-btn svg{width:14px;height:14px;opacity:.9}

/* ── DETAIL SHEET ── */
.backdrop{
  position:fixed;inset:0;background:rgba(10,4,2,.6);
  z-index:100;opacity:0;pointer-events:none;
  transition:opacity .3s;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
.backdrop.open{opacity:1;pointer-events:auto}

.sheet{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);
  width:100%;max-width:680px;
  background:var(--card);border-radius:24px 24px 0 0;
  box-shadow:0 -8px 60px rgba(10,4,2,.25);
  z-index:101;max-height:92dvh;
  display:flex;flex-direction:column;
  transition:transform .35s cubic-bezier(.34,1.2,.64,1);
}
.sheet.open{transform:translateX(-50%) translateY(0)}

.sheet-handle{
  width:40px;height:4px;border-radius:2px;
  background:var(--brd2);margin:12px auto 0;flex-shrink:0;
}
.sheet-head{
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:14px 20px 0;flex-shrink:0;
}
.sheet-head h2{
  font-size:24px;font-weight:800;
  font-family:Georgia,serif;color:var(--tx);
}
.sheet-head p{font-size:13px;color:var(--tx3);margin-top:2px}
.close-btn{
  width:32px;height:32px;border-radius:50%;
  background:var(--bg);border:1px solid var(--brd);
  color:var(--tx2);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-left:12px;
  transition:background .15s;
}
.close-btn:hover{background:var(--brd)}

/* ── TABS ── */
.tabs{
  display:flex;gap:0;padding:14px 20px 0;
  border-bottom:2px solid var(--brd);flex-shrink:0;
}
.tab{
  flex:1;padding:8px 4px;
  font-size:13px;font-weight:600;
  color:var(--tx3);background:none;border:none;
  border-bottom:2px solid transparent;
  margin-bottom:-2px;cursor:pointer;
  transition:color .2s,border-color .2s;
}
.tab.active{color:var(--pri);border-bottom-color:var(--pri)}

/* ── SHEET BODY ── */
.sheet-body{
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:20px 20px 40px;flex:1;
  overscroll-behavior:contain;
}

/* ── DESCRIPTION TAB ── */
.desc-section{margin-bottom:20px}
.desc-section h4{
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tx3);font-weight:600;margin-bottom:8px;
}
.desc-text{font-size:14.5px;line-height:1.75;color:var(--tx2)}
.meta-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  margin-top:4px;
}
.meta-item{
  background:var(--bg);border-radius:var(--rs);
  padding:12px 14px;border:1px solid var(--brd);
}
.meta-item label{
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tx3);display:block;margin-bottom:4px;
}
.meta-item span{font-size:13px;font-weight:600;color:var(--tx)}

/* ── STEPS TAB ── */
.steps-intro{
  font-size:13px;color:var(--tx3);
  margin-bottom:16px;line-height:1.6;
  padding:10px 14px;background:rgba(139,21,21,.05);
  border-left:3px solid var(--pri);border-radius:0 var(--rs) var(--rs) 0;
}
.step-item{
  display:grid;grid-template-columns:28px 40px 1fr auto;
  gap:10px;align-items:start;
  padding:14px 0;border-bottom:1px solid var(--brd);
}
.step-item:last-child{border-bottom:none}
.step-n{
  font-size:13px;font-weight:700;color:var(--tx3);
  padding-top:1px;
}
.foot-badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:8px;
  font-size:12px;font-weight:800;letter-spacing:-.01em;
  flex-shrink:0;
}
.foot-D{background:rgba(26,79,138,.12);color:var(--foot-b);border:1.5px solid rgba(26,79,138,.25)}
.foot-A{background:rgba(192,57,43,.1);color:var(--foot-r);border:1.5px solid rgba(192,57,43,.2)}
.foot-AD{background:rgba(107,47,138,.1);color:var(--foot-p);border:1.5px solid rgba(107,47,138,.2)}
.step-content{}
.step-move{font-size:14px;font-weight:700;color:var(--tx);margin-bottom:4px}
.step-detail{font-size:13px;color:var(--tx2);line-height:1.6}
.beat-chip{
  font-size:10px;font-weight:700;padding:3px 7px;
  border-radius:6px;white-space:nowrap;flex-shrink:0;
  margin-top:2px;
}
.beat-quick{background:var(--beat-quick);color:#5C3D00}
.beat-slow{background:var(--beat-slow);color:#fff}
.beat-neutral{background:var(--bg);color:var(--tx3);border:1px solid var(--brd2)}

/* foot legend */
.foot-legend{
  display:flex;gap:12px;margin-bottom:14px;
  font-size:12px;color:var(--tx2);flex-wrap:wrap;
}
.foot-legend-item{display:flex;align-items:center;gap:5px}
.foot-legend-item .foot-badge{width:26px;height:26px;font-size:11px;border-radius:6px}

/* ── RHYTHM TAB ── */
.rhythm-section{margin-bottom:24px}
.rhythm-section h4{
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tx3);margin-bottom:12px;
}
.beat-display{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:18px;background:var(--bg);border-radius:var(--r);
  border:1px solid var(--brd);margin-bottom:12px;
}
.beat-dot{
  width:18px;height:18px;border-radius:50%;
  transition:transform .15s,opacity .15s;
}
.beat-dot.accent{
  width:24px;height:24px;
  background:var(--pri);
  box-shadow:0 0 0 3px rgba(139,21,21,.2);
}
.beat-dot.light{background:var(--acc);width:14px;height:14px}
.beat-dot.rest{background:var(--brd2)}
.beat-separator{width:2px;height:20px;background:var(--brd2);border-radius:1px}
.beat-label{
  font-size:22px;font-weight:800;color:var(--tx);
  font-family:Georgia,serif;
  line-height:1.2;
}
.beat-count-display{
  font-size:15px;color:var(--tx2);
  font-style:italic;
  padding:10px 14px;background:var(--bg);
  border-radius:var(--rs);border:1px solid var(--brd);
  line-height:1.6;
}
.beat-count-display strong{color:var(--pri);font-style:normal}

.tips-list{list-style:none;display:flex;flex-direction:column;gap:10px}
.tips-list li{
  display:flex;gap:10px;align-items:flex-start;
  font-size:13.5px;color:var(--tx2);line-height:1.6;
}
.tips-list li::before{
  content:'→';color:var(--acc2);font-weight:700;
  flex-shrink:0;margin-top:1px;
}
.mistakes-list{list-style:none;display:flex;flex-direction:column;gap:10px}
.mistakes-list li{
  display:flex;gap:10px;align-items:flex-start;
  font-size:13px;color:var(--tx2);line-height:1.6;
  padding:10px 12px;background:rgba(192,57,43,.05);
  border-radius:var(--rs);border:1px solid rgba(192,57,43,.12);
}
.mistakes-list li::before{
  content:'⚠';font-size:14px;
  flex-shrink:0;
}

/* ── BEAT ANIMATION ── */
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.beat-dot.playing{animation:pulse .3s ease}

/* ── EMPTY STATE ── */
.empty{
  text-align:center;padding:60px 20px;color:var(--tx3);
}
.empty p{font-size:16px;margin-top:8px}
</style>
</head>
<body>

<div id="app">
  <header class="site-header">
    <a href="index.html" class="back-link">← Αρχική</a>
    <div class="header-content">
      <div class="header-eyebrow">Παραδοσιακοί Χοροί</div>
      <h1 class="header-title">Μάθε να χορεύεις</h1>
      <p class="header-sub">Αναλυτικά βήματα για κάθε χορό — τα πόδια, ο ρυθμός, τα μυστικά.</p>
    </div>
  </header>
  <div class="header-divider"></div>

  <div class="filters" id="filters">
    <button class="chip active" data-diff="0">Όλοι</button>
    <button class="chip" data-diff="1">Εύκολοι</button>
    <button class="chip" data-diff="2">Μέτριοι</button>
    <button class="chip" data-diff="3">Δύσκολοι</button>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="backdrop" id="backdrop" onclick="closeDetail()"></div>

<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <div>
      <h2 id="sh-name"></h2>
      <p id="sh-region"></p>
    </div>
    <button class="close-btn" onclick="closeDetail()">✕</button>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="desc" onclick="switchTab('desc')">Περιγραφή</button>
    <button class="tab" data-tab="steps" onclick="switchTab('steps')">Βήματα</button>
    <button class="tab" data-tab="rhythm" onclick="switchTab('rhythm')">Ρυθμός</button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<script>
const DANCES = [
  {
    id: 'kalamatianos',
    name: 'Καλαματιανός',
    region: 'Πελοπόννησος · Πανελλήνιος',
    difficulty: 1,
    diffLabel: 'Εύκολος',
    rhythm: '7/8',
    rhythmGroups: [2,2,3],
    rhythmCount: '<strong>ΈΝΑ</strong>-δύο, <strong>ΈΝΑ</strong>-δύο, <strong>ΈΝΑ</strong>-δύο-τρία',
    rhythmFeel: 'γρήγ. – γρήγ. – αρ-γό',
    tempo: 'Μέτριο προς γρήγορο',
    hold: 'V-πιασιά — χέρια τεντωμένα προς τα κάτω, αγκαλιά από τα χέρια με τους διπλανούς',
    direction: 'Αριστερόστροφα — ο κύκλος κινείται πάντα προς τα δεξιά (δεξί πόδι ηγείται)',
    image: 'photo-1504609813442-a8924e83f76e',
    gradient: 'linear-gradient(160deg,#7A5010 0%,#C8941A 55%,#8B4500 100%)',
    description: 'Ο Καλαματιανός είναι ο εθνικός χορός της Ελλάδας και ο πιο γνωστός σε όλο τον κόσμο. Το όνομά του προέρχεται από την Καλαμάτα Μεσσηνίας, αν και χορεύεται από τη Μακεδονία μέχρι την Κρήτη. Ο ρυθμός 7/8 ομαδοποιείται σε δύο «γρήγορα» (2+2 οκτάβες) και ένα «αργό» (3 οκτάβες), δίνοντας μια ζωντανή «αναπνοή» που τον κάνει αμέσως αναγνωρίσιμο. Χορεύεται σε ανοιχτό κύκλο: ο πρώτος κρατά μαντήλι και αυτοσχεδιάζει, ενώ οι υπόλοιποι κάνουν το βασικό βήμα.',
    steps: [
      { n:1, foot:'Δ', count:'ΈΝΑ', tempo:'γρ.', move:'Βήμα πλαγίως δεξιά', detail:'Άνοιξε το δεξί πόδι πλαγίως δεξιά σε πλάτος ώμων. Μεταφέρεις το βάρος σου εξολοκλήρου στο δεξί πόδι. Τα γόνατα παραμένουν ελαφρά λυγισμένα — ποτέ τεντωμένα.' },
      { n:2, foot:'Α', count:'δύο', tempo:'γρ.', move:'Σταύρωμα μπρος', detail:'Φέρε το αριστερό πόδι μπροστά από το δεξί, σταυρώνοντάς το. Βάρος στο αριστερό. Το σώμα στρέφεται ελαφρά αριστερά.' },
      { n:3, foot:'Δ', count:'ΈΝΑ', tempo:'γρ.', move:'Βήμα πλαγίως δεξιά', detail:'Ξαναανοίγεις το δεξί πόδι πλαγίως. Βάρος στο δεξί. Αυτό είναι ακριβώς ίδιο με το βήμα 1 — ο κύκλος έχει κινηθεί λίγο δεξιά.' },
      { n:4, foot:'Α', count:'δύο', tempo:'γρ.', move:'Σταύρωμα πίσω', detail:'Φέρε το αριστερό πόδι πίσω από το δεξί (σταύρωμα πίσω). Βάρος στο αριστερό. Πρόσεξε: το βήμα 2 ήταν σταύρωμα ΜΠΡΟΣ — αυτό είναι σταύρωμα ΠΙΣΩ. Εναλλάσσονται.' },
      { n:5, foot:'Δ', count:'ΈΝΑ', tempo:'αργ.', move:'Βήμα πλαγίως δεξιά', detail:'Ξαναανοίγεις το δεξί πόδι. Ξεκινά το «αργό» μέρος — νιώσε ότι ο χρόνος «τεντώνεται». Μην βιαστείς.' },
      { n:6, foot:'Α', count:'δύο', tempo:'αργ.', move:'Ανασήκωση αριστερού', detail:'Σήκωσε ελαφρά το αριστερό πόδι (γόνατο σε γωνία ~45°). Ισορροπία στο δεξί πόδι. Αυτή η ανασήκωση δίνει την «αναπνοή» και την ομορφιά του χορού — μην την παραλείπεις.' },
      { n:7, foot:'Α', count:'τρία', tempo:'αργ.', move:'Κατέβασμα — κλείσιμο', detail:'Κατέβασε το αριστερό δίπλα στο δεξί ή ελαφρά πίσω-δίπλα. Είσαι έτοιμος να επαναλάβεις από το βήμα 1.' },
    ],
    tips: [
      'Μέτρα πρώτα μόνο τον ρυθμό: χτύπα τα χέρια σου ΓΡΗΓ-ΓΡΗΓ-ΑΑΑΡΓΟ πριν προσθέσεις τα πόδια.',
      'Τα χέρια κρατούνται χαλαρά — φαντάσου ότι κρατάς ένα ποτήρι νερό χωρίς να το χύσεις.',
      'Μην κοιτάς κάτω στα πόδια. Αν χαθείς, κοίτα τον διπλανό σου.',
      'Το «αργό» (βήματα 5-6-7) ΔΕΝ είναι τρία γρήγορα βήματα — είναι ένα βήμα + ανασήκωση + κατέβασμα.',
      'Κινείσαι ΠΑΝΤΑ προς τα δεξιά — αντίθετα από τους δείκτες ρολογιού.',
    ],
    mistakes: [
      'Λάθος: Σταύρωμα πάντα μπρος. Σωστό: Βήμα 2 = μπρος, Βήμα 4 = πίσω. Εναλλάσσονται.',
      'Λάθος: Βιάζεσαι στο αργό μέρος. Σωστό: Το αργό είναι 3 χτύποι — νιώσε κάθε έναν.',
      'Λάθος: Τεντωμένα γόνατα. Σωστό: Ελαφρά λύγισμα πάντα — ο χορός ζωντανεύει.',
    ],
  },
  {
    id: 'syrtos',
    name: 'Συρτός',
    region: 'Πανελλήνιος',
    difficulty: 1,
    diffLabel: 'Εύκολος',
    rhythm: '2/4',
    rhythmGroups: [2,2],
    rhythmCount: '<strong>ΈΝΑ</strong>-και, <strong>ΔΎΟ</strong>-και',
    rhythmFeel: 'ομαλό – κυματιστό',
    tempo: 'Μέτριο',
    hold: 'V-πιασιά (χαμηλά) ή W-πιασιά (ώμοι) ανάλογα με την περιοχή',
    direction: 'Αριστερόστροφα — το δεξί πόδι ανοίγει πρώτο',

      { n:2, foot:'Δ', count:'2', tempo:'ελαφ.', move:'Κύμα ισχίου δεξιά', detail:'Με το βάρος στο δεξί, το δεξί ισχίο ανεβαίνει ελαφρά. Αυτό είναι το «κύμα» — αργό, ρέον.' },

      { n:5, foot:'Δ', count:'1', tempo:'βαρύ', move:'Βήμα δεξιά + κύμα', detail:'Μικρό βήμα πλαγίως δεξιά, βάρος στο δεξί, κύμα ισχίου. Συνδυάζεις κίνηση με κύμα.' },

      'Λάθος: Σφιχτό σώμα. Σωστό: Όλες οι αρθρώσεις χαλαρές — ρευστότητα.',

let activeDiff = 0;
let currentDance = null;
let currentTab = 'desc';

function difficultyLabel(d){return d===1?'Εύκολος':d===2?'Μέτριος':'Δύσκολος'}

function renderCards(){
  const grid = document.getElementById('grid');
  const filtered = activeDiff === 0 ? DANCES : DANCES.filter(d => d.difficulty === activeDiff);
  if(!filtered.length){
    grid.innerHTML = '<div class="empty"><div style="font-size:40px">🕺</div><p>Δεν βρέθηκαν χοροί.</p></div>';
    return;
  }
  grid.innerHTML = filtered.map(d => `
    <div class="card" onclick="openDetail('${d.id}')">
      <div class="card-img" style="background:${d.gradient}">
        <img src="https://images.unsplash.com/${d.image}?w=800&q=75&auto=format&fit=crop"
             onerror="this.style.display='none'" alt="${d.name}" loading="lazy">
        <div class="card-img-overlay"></div>
        <div class="card-img-text">
          <div class="card-name">${d.name}</div>
          <div class="card-region">📍 ${d.region}</div>
        </div>
      </div>
      <div class="card-info">
        <div class="card-meta">
          <span class="badge badge-rhythm">${d.rhythm}</span>
          <span class="badge badge-diff">${difficultyLabel(d.difficulty)}</span>
          <div class="difficulty-dots">
            ${[1,2,3].map(i=>`<div class="dot ${i<=d.difficulty?'on':'off'}"></div>`).join('')}
          </div>
        </div>
        <p class="card-desc">${d.description}</p>
        <button class="card-btn">
          Μάθε τα βήματα
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M6 3l5 5-5 5"/></svg>
        </button>
      </div>
    </div>
  `).join('');
}

function openDetail(id){
  currentDance = DANCES.find(d => d.id === id);
  if(!currentDance) return;
  currentTab = 'desc';
  document.getElementById('sh-name').textContent = currentDance.name;
  document.getElementById('sh-region').textContent = `${currentDance.region} · ${currentDance.rhythm}`;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'desc'));
  renderTabContent();
  document.getElementById('backdrop').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDetail(){
  document.getElementById('backdrop').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
  document.body.style.overflow = '';
  setTimeout(() => { currentDance = null; }, 350);
}

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  renderTabContent();
  document.getElementById('sheet-body').scrollTop = 0;
}

function footClass(f){ return f==='Δ'?'foot-D':f==='Α'?'foot-A':'foot-AD'; }
function footLabel(f){ return f==='Δ'?'Δ':f==='Α'?'Α':'ΑΔ'; }
function beatClass(t){ return t==='γρ.'?'beat-quick':t==='αργ.'?'beat-slow':'beat-neutral'; }

function renderTabContent(){
  const d = currentDance;
  if(!d) return;
  const body = document.getElementById('sheet-body');

  if(currentTab === 'desc'){
    body.innerHTML = `
      <div class="desc-section">
        <h4>Ιστορία & Περιγραφή</h4>
        <p class="desc-text">${d.description}</p>
      </div>
      <div class="desc-section">
        <h4>Πληροφορίες χορού</h4>
        <div class="meta-grid">
          <div class="meta-item"><label>Περιοχή</label><span>${d.region}</span></div>
          <div class="meta-item"><label>Ρυθμός</label><span>${d.rhythm}</span></div>
          <div class="meta-item"><label>Τέμπο</label><span>${d.tempo}</span></div>
          <div class="meta-item"><label>Δυσκολία</label><span>${difficultyLabel(d.difficulty)}</span></div>
        </div>
      </div>
      <div class="desc-section">
        <h4>Πιασιά & Κατεύθυνση</h4>
        <div class="meta-item" style="margin-bottom:8px"><label>Πιασιά</label><span>${d.hold}</span></div>
        <div class="meta-item"><label>Κατεύθυνση</label><span>${d.direction}</span></div>
      </div>
    `;
  } else if(currentTab === 'steps'){
    const legend = `<div class="foot-legend">
      <span class="foot-legend-item"><div class="foot-badge foot-D">Δ</div> Δεξί πόδι</span>
      <span class="foot-legend-item"><div class="foot-badge foot-A">Α</div> Αριστερό πόδι</span>
      <span class="foot-legend-item"><div class="foot-badge foot-AD">ΑΔ</div> Αμφότερα</span>
    </div>`;
    const stepsHtml = d.steps.map(s => `
      <div class="step-item">
        <div class="step-n">${s.n}.</div>
        <div class="foot-badge ${footClass(s.foot)}">${footLabel(s.foot)}</div>
        <div class="step-content">
          <div class="step-move">${s.move}</div>
          <div class="step-detail">${s.detail}</div>
        </div>
        <div><span class="beat-chip ${beatClass(s.tempo)}">${s.count}</span></div>
      </div>
    `).join('');
    const intro = `<div class="steps-intro">
      Μέτρα: <strong>${d.rhythmFeel}</strong> — Ξεκίνα αργά, μέτρα δυνατά, μετά ανέβασε ταχύτητα.
    </div>`;
    body.innerHTML = legend + intro + stepsHtml;
  } else {
    // rhythm tab
    const groups = d.rhythmGroups;
    const dotsHtml = groups.map((g, gi) => {
      const dots = Array.from({length:g}, (_, i) => {
        const isAccent = i === 0;
        return `<div class="beat-dot ${isAccent?'accent':'light'}"></div>`;
      }).join('');
      return dots + (gi < groups.length-1 ? '<div class="beat-separator"></div>' : '');
    }).join('');

    const tipsHtml = d.tips.map(t=>`<li>${t}</li>`).join('');
    const mistakesHtml = d.mistakes.map(m=>`<li>${m}</li>`).join('');

    body.innerHTML = `
      <div class="rhythm-section">
        <h4>Μέτρημα ρυθμού</h4>
        <div class="beat-display">
          <div class="beat-label">${d.rhythm}</div>
          ${dotsHtml}
        </div>
        <div class="beat-count-display">${d.rhythmCount}</div>
      </div>
      <div class="rhythm-section">
        <h4>Αίσθηση ρυθμού</h4>
        <div class="meta-item">
          <label>Χαρακτήρας</label>
          <span>${d.rhythmFeel} — Τέμπο: ${d.tempo}</span>
        </div>
      </div>
      <div class="rhythm-section">
        <h4>Συμβουλές επαγγελματία</h4>
        <ul class="tips-list">${tipsHtml}</ul>
      </div>
      <div class="rhythm-section">
        <h4>Συχνά λάθη αρχαρίων</h4>
        <ul class="mistakes-list">${mistakesHtml}</ul>
      </div>
    `;
  }
}

// Filters
document.getElementById('filters').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if(!chip) return;
  activeDiff = parseInt(chip.dataset.diff);
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
  renderCards();
});

// Close on backdrop click or ESC
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeDetail(); });

// Touch swipe-down to close sheet
let touchStartY = 0;
document.getElementById('sheet').addEventListener('touchstart', e => {
  touchStartY = e.touches[0].clientY;
}, {passive:true});
document.getElementById('sheet').addEventListener('touchend', e => {
  const dy = e.changedTouches[0].clientY - touchStartY;
  if(dy > 80 && document.getElementById('sheet-body').scrollTop < 10) closeDetail();
}, {passive:true});

// Init
renderCards();
</script>
</body>
</html>
