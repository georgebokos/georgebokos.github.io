<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#8B1515">
<title>Ελληνικοί Παραδοσιακοί Χοροί</title>
<style>
:root{
  --bg:#F4EDE4;--card:#FFFAF5;--pri:#8B1515;--pri2:#6B1010;
  --acc:#C8941A;--acc2:#A07010;
  --tx:#1C0A06;--tx2:#5C3D2E;--tx3:#9B7B6A;
  --brd:#E0D0C0;--brd2:#C8B09A;
  --fr:#C0392B;--fb:#1A4F8A;--fp:#6B2F8A;
  --sh:0 2px 12px rgba(28,10,6,.08);--shl:0 8px 40px rgba(28,10,6,.18);
  --r:16px;--rs:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);max-width:680px;margin:0 auto;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:3px}

.site-header{padding:22px 20px 10px;display:flex;flex-direction:column;gap:4px}
.back-link{font-size:13px;color:var(--pri);text-decoration:none;opacity:.8}
.back-link:hover{opacity:1}
.header-eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc2);font-weight:600;margin-top:8px}
.header-title{font-size:clamp(26px,6vw,34px);font-weight:800;color:var(--tx);font-family:Georgia,serif;line-height:1.1;margin-top:4px}
.header-sub{font-size:14px;color:var(--tx2);margin-top:6px}
.header-divider{height:1px;background:var(--brd);margin:14px 20px 0}

.filters{display:flex;gap:8px;padding:14px 20px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 16px;border-radius:100px;border:1.5px solid var(--brd2);background:var(--card);color:var(--tx2);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.chip:hover{border-color:var(--pri);color:var(--pri)}
.chip.active{background:var(--pri);border-color:var(--pri);color:#fff}

.grid{display:flex;flex-direction:column;gap:20px;padding:4px 16px 100px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;cursor:pointer;border:1px solid var(--brd);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shl)}
.card:active{transform:translateY(0)}

.card-img{height:240px;position:relative;overflow:hidden}
.card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .6s,transform .4s}
.card-img img.loaded{opacity:1}
.card:hover .card-img img{transform:scale(1.04)}
.card-img-ov{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 30%,rgba(10,4,2,.76) 100%);z-index:1}
.card-img-txt{position:absolute;bottom:0;left:0;right:0;padding:20px 18px 16px;z-index:2}
.card-name{font-size:22px;font-weight:800;color:#fff;font-family:Georgia,serif;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.card-region{font-size:12px;color:rgba(255,255,255,.8);margin-top:4px}

.card-info{padding:14px 18px 16px}
.card-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px;letter-spacing:.04em}
.badge-r{background:rgba(139,21,21,.1);color:var(--pri);border:1px solid rgba(139,21,21,.2)}
.badge-d{background:rgba(200,148,26,.12);color:var(--acc2);border:1px solid rgba(200,148,26,.25)}
.dots{display:flex;gap:3px}
.dot{width:7px;height:7px;border-radius:50%}
.dot.on{background:var(--acc)}.dot.off{background:var(--brd2)}
.card-desc{font-size:13.5px;color:var(--tx2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-btn{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:10px 18px;border-radius:var(--rs);background:var(--pri);color:#fff;font-size:13.5px;font-weight:600;border:none;cursor:pointer;transition:background .2s}
.card-btn:hover{background:var(--pri2)}

/* SHEET */
.backdrop{position:fixed;inset:0;background:rgba(10,4,2,.6);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:680px;background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -8px 60px rgba(10,4,2,.25);z-index:101;max-height:92dvh;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.34,1.2,.64,1)}
.sheet.open{transform:translateX(-50%) translateY(0)}
.sheet-handle{width:40px;height:4px;border-radius:2px;background:var(--brd2);margin:12px auto 0;flex-shrink:0}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 20px 0;flex-shrink:0}
.sheet-head h2{font-size:24px;font-weight:800;font-family:Georgia,serif;color:var(--tx)}
.sheet-head p{font-size:13px;color:var(--tx3);margin-top:2px}
.close-btn{width:32px;height:32px;border-radius:50%;background:var(--bg);border:1px solid var(--brd);color:var(--tx2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:12px;transition:background .15s}
.close-btn:hover{background:var(--brd)}
.tabs{display:flex;padding:14px 20px 0;border-bottom:2px solid var(--brd);flex-shrink:0}
.tab{flex:1;padding:8px 4px;font-size:13px;font-weight:600;color:var(--tx3);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;transition:color .2s,border-color .2s}
.tab.active{color:var(--pri);border-bottom-color:var(--pri)}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 20px 40px;flex:1;overscroll-behavior:contain}

/* DESC TAB */
.sec{margin-bottom:20px}
.sec h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);font-weight:600;margin-bottom:8px}
.desc-text{font-size:14.5px;line-height:1.8;color:var(--tx2)}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meta-item{background:var(--bg);border-radius:var(--rs);padding:12px 14px;border:1px solid var(--brd)}
.meta-item label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);display:block;margin-bottom:4px}
.meta-item span{font-size:13px;font-weight:600;color:var(--tx)}
.meta-full{grid-column:1/-1}

/* STEP NAVIGATOR */
.step-nav{background:linear-gradient(135deg,rgba(139,21,21,.04),rgba(200,148,26,.07));border-radius:var(--r);border:1.5px solid rgba(139,21,21,.15);padding:18px;margin-bottom:20px}
.sn-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);font-weight:600;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.sn-dots-row{display:flex;gap:4px}
.sn-d{width:8px;height:8px;border-radius:50%;background:var(--brd2);transition:background .2s,transform .2s}
.sn-d.done{background:var(--acc)}.sn-d.now{background:var(--pri);transform:scale(1.3)}
.sn-main{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:start;margin-bottom:14px}
.sn-foot{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;flex-shrink:0}
.sn-foot.D{background:rgba(26,79,138,.12);color:var(--fb);border:2px solid rgba(26,79,138,.3)}
.sn-foot.A{background:rgba(192,57,43,.1);color:var(--fr);border:2px solid rgba(192,57,43,.25)}
.sn-foot.AD{background:rgba(107,47,138,.1);color:var(--fp);border:2px solid rgba(107,47,138,.25)}
.sn-dir{font-size:22px;line-height:1;margin-bottom:3px}
.sn-move{font-size:16px;font-weight:800;color:var(--tx);margin-bottom:5px}
.sn-beat-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.sn-detail{font-size:13px;color:var(--tx2);line-height:1.65}
.sn-btns{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:14px}
.sn-btn{padding:9px 16px;border-radius:var(--rs);font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .2s}
.sn-prev{background:var(--bg);color:var(--tx2);border:1.5px solid var(--brd2)}.sn-prev:hover:not(:disabled){background:var(--brd)}
.sn-next{background:var(--pri);color:#fff}.sn-next:hover:not(:disabled){background:var(--pri2)}
.sn-btn:disabled{opacity:.35;cursor:not-allowed}
.sn-counter{font-size:12px;font-weight:700;color:var(--tx3);text-align:center}

/* STEPS LIST */
.steps-intro{font-size:13px;color:var(--tx2);margin-bottom:16px;padding:10px 14px;background:rgba(139,21,21,.05);border-left:3px solid var(--pri);border-radius:0 var(--rs) var(--rs) 0;line-height:1.6}
.foot-legend{display:flex;gap:12px;margin-bottom:14px;font-size:12px;color:var(--tx2);flex-wrap:wrap}
.fl-item{display:flex;align-items:center;gap:5px}
.foot-badge{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;font-size:12px;font-weight:800;flex-shrink:0}
.fD{background:rgba(26,79,138,.12);color:var(--fb);border:1.5px solid rgba(26,79,138,.25)}
.fA{background:rgba(192,57,43,.1);color:var(--fr);border:1.5px solid rgba(192,57,43,.2)}
.fAD{background:rgba(107,47,138,.1);color:var(--fp);border:1.5px solid rgba(107,47,138,.2)}
.step-item{display:grid;grid-template-columns:22px 34px 22px 1fr;gap:8px;align-items:start;padding:13px 0;border-bottom:1px solid var(--brd);transition:background .25s,padding .25s}
.step-item:last-child{border-bottom:none}
.step-item.active{background:rgba(139,21,21,.05);border-radius:var(--rs);padding:13px 10px;margin:0 -10px;border-color:transparent}
.step-n{font-size:12px;font-weight:700;color:var(--tx3);padding-top:3px}
.step-dir{font-size:18px;padding-top:1px;text-align:center;line-height:1}
.step-move{font-size:14px;font-weight:700;color:var(--tx);margin-bottom:3px}
.step-detail{font-size:13px;color:var(--tx2);line-height:1.6}
.beat-chip{font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap;display:inline-block;margin-top:4px}
.bq{background:#E8C870;color:#5C3D00}.bs{background:var(--pri);color:#fff}.bn{background:var(--bg);color:var(--tx3);border:1px solid var(--brd2)}

/* METRONOME */
.metro-box{background:var(--bg);border-radius:var(--r);border:1px solid var(--brd);padding:18px;margin-bottom:16px}
.metro-beats{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;min-height:36px}
.mbd{border-radius:50%;transition:background .08s,transform .08s,box-shadow .08s;flex-shrink:0}
.mbd.acc{width:26px;height:26px;background:rgba(139,21,21,.2);border:2px solid rgba(139,21,21,.4)}
.mbd.light{width:18px;height:18px;background:rgba(200,148,26,.2);border:1.5px solid rgba(200,148,26,.4)}
.mbd.sep{width:2px;height:26px;background:var(--brd2);border-radius:1px}
.mbd.acc.lit{background:var(--pri);border-color:var(--pri);transform:scale(1.3);box-shadow:0 0 0 4px rgba(139,21,21,.2)}
.mbd.light.lit{background:var(--acc);border-color:var(--acc);transform:scale(1.25)}
.metro-controls{display:flex;gap:10px;align-items:center}
.metro-btn{padding:9px 18px;border-radius:var(--rs);background:var(--pri);color:#fff;font-size:13px;font-weight:700;border:none;cursor:pointer;transition:background .2s}
.metro-btn:hover{background:var(--pri2)}.metro-btn.playing{background:#444}
.metro-tempo{font-size:12px;color:var(--tx3)}
.metro-cd{font-size:18px;font-weight:900;color:var(--pri);margin-left:auto;min-width:50px;text-align:right;font-family:Georgia,serif;transition:opacity .1s}

.beat-count-display{font-size:15px;color:var(--tx2);font-style:italic;padding:10px 14px;background:var(--bg);border-radius:var(--rs);border:1px solid var(--brd);line-height:1.7;margin-bottom:16px}
.beat-count-display strong{color:var(--pri);font-style:normal}

.mnemonic-box{padding:16px 18px;background:rgba(200,148,26,.08);border-radius:var(--r);border:1px solid rgba(200,148,26,.22);margin-bottom:16px}
.mnemonic-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc2);font-weight:600;margin-bottom:6px}
.mnemonic-phrase{font-size:24px;font-weight:900;color:var(--pri);font-family:Georgia,serif;letter-spacing:.04em;line-height:1.2}
.mnemonic-hint{font-size:12px;color:var(--tx3);margin-top:5px}

.tips-list{list-style:none;display:flex;flex-direction:column;gap:10px}
.tips-list li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--tx2);line-height:1.6}
.tips-list li::before{content:'→';color:var(--acc2);font-weight:700;flex-shrink:0;margin-top:1px}
.mistakes-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.mistakes-list li{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--tx2);line-height:1.6;padding:10px 12px;background:rgba(192,57,43,.05);border-radius:var(--rs);border:1px solid rgba(192,57,43,.12)}
.mistakes-list li::before{content:'⚠';flex-shrink:0}
</style>
</head>
<body>
<div id="app">
  <header class="site-header">
    <a href="index.html" class="back-link">← Αρχική</a>
    <div class="header-eyebrow">Παραδοσιακοί Χοροί</div>
    <h1 class="header-title">Μάθε να χορεύεις</h1>
    <p class="header-sub">Αναλυτικά βήματα · Ρυθμός με ήχο · Εξάσκηση βήμα-βήμα</p>
  </header>
  <div class="header-divider"></div>
  <div class="filters" id="filters">
    <button class="chip active" data-diff="0">Όλοι</button>
    <button class="chip" data-diff="1">Εύκολοι</button>
    <button class="chip" data-diff="2">Μέτριοι</button>
    <button class="chip" data-diff="3">Δύσκολοι</button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<div class="backdrop" id="backdrop" onclick="closeDetail()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <div><h2 id="sh-name"></h2><p id="sh-region"></p></div>
    <button class="close-btn" onclick="closeDetail()">✕</button>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="desc" onclick="switchTab('desc')">Περιγραφή</button>
    <button class="tab" data-tab="steps" onclick="switchTab('steps')">Βήματα</button>
    <button class="tab" data-tab="rhythm" onclick="switchTab('rhythm')">Ρυθμός</button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<script>
const DANCES = [
  {
    id:'kalamatianos',name:'Καλαματιανός',region:'Πελοπόννησος · Πανελλήνιος',
    difficulty:1,rhythm:'7/8',rhythmGroups:[2,2,3],
    rhythmCount:'<strong>ΈΝΑ</strong>-δύο, <strong>ΈΝΑ</strong>-δύο, <strong>ΈΝΑ</strong>-δύο-τρία',
    rhythmFeel:'ΓΡΗΓ – ΓΡΗΓ – ΑΑΑΡΓΟ',
    mnemonic:'ΑΣ · ΠΑ-Ω · ΚΙ · Ε-ΓΩ',mnemonicHint:'7 συλλαβές = 7 χτύποι (2+2+3)',
    tempo:'Μέτριο – Γρήγορο',eighthMs:230,
    wikiTitle:'Kalamatianos',wikiTitleEl:'Καλαματιανός',
    hold:'V-πιασιά — χέρια τεντωμένα κάτω, αγκαλιά από τα χέρια',
    direction:'Αριστερόστροφα — δεξί πόδι ηγείται, κύκλος κινείται προς τα δεξιά',
    gradient:'linear-gradient(160deg,#7A5010 0%,#C8941A 55%,#8B4500 100%)',
    description:'Ο Καλαματιανός είναι ο εθνικός χορός της Ελλάδας και ο πιο γνωστός σε όλο τον κόσμο. Το όνομά του προέρχεται από την Καλαμάτα Μεσσηνίας. Ο ρυθμός 7/8 ομαδοποιείται σε δύο «γρήγορα» (2+2 οκτόλεπτα) και ένα «αργό» (3 οκτόλεπτα), δίνοντας μια ζωντανή «αναπνοή». Χορεύεται σε ανοιχτό κύκλο: ο πρώτος κρατά μαντήλι και αυτοσχεδιάζει, οι υπόλοιποι ακολουθούν.',
    steps:[
      {n:1,foot:'Δ',count:'ΈΝΑ',tempo:'γρ.',dir:'→',move:'Βήμα πλαγίως δεξιά',detail:'Άνοιξε το δεξί πόδι πλαγίως δεξιά σε πλάτος ώμων. Βάρος εξολοκλήρου στο δεξί. Γόνατα ελαφρά λυγισμένα — ποτέ τεντωμένα.'},
      {n:2,foot:'Α',count:'δύο',tempo:'γρ.',dir:'↗',move:'Σταύρωμα μπρος',detail:'Φέρε το αριστερό μπροστά από το δεξί, σταυρώνοντάς το. Βάρος στο αριστερό. Σώμα στρέφεται ελαφρά αριστερά.'},
      {n:3,foot:'Δ',count:'ΈΝΑ',tempo:'γρ.',dir:'→',move:'Βήμα πλαγίως δεξιά',detail:'Ξαναανοίγεις το δεξί. Βάρος στο δεξί. Ίδιο με βήμα 1 — ο κύκλος έχει προχωρήσει.'},
      {n:4,foot:'Α',count:'δύο',tempo:'γρ.',dir:'↙',move:'Σταύρωμα πίσω',detail:'Φέρε το αριστερό πίσω από το δεξί. Βάρος στο αριστερό. Βήμα 2 = μπρος, βήμα 4 = πίσω — εναλλάσσονται.'},
      {n:5,foot:'Δ',count:'ΈΝΑ',tempo:'αργ.',dir:'→',move:'Βήμα δεξιά — αρχή «αργού»',detail:'Ξαναανοίγεις το δεξί. Αρχίζει το αργό μέρος — νιώσε ότι ο χρόνος «τεντώνεται». Μην βιαστείς.'},
      {n:6,foot:'Α',count:'δύο',tempo:'αργ.',dir:'↑',move:'Ανασήκωση αριστερού',detail:'Σήκωσε ελαφρά το αριστερό (γόνατο ~45°). Ισορροπία στο δεξί. Αυτή η ανασήκωση δίνει την «αναπνοή» και την ομορφιά του χορού.'},
      {n:7,foot:'Α',count:'τρία',tempo:'αργ.',dir:'↓',move:'Κατέβασμα — κλείσιμο',detail:'Κατέβασε το αριστερό δίπλα ή ελαφρά πίσω-δίπλα. Έτοιμος για επανάληψη από βήμα 1.'},
    ],
    tips:['Χτύπα πρώτα τον ρυθμό με τα χέρια: ΓΡΗΓ-ΓΡΗΓ-ΑΑΑΡΓΟ πριν προσθέσεις τα πόδια.','Τα χέρια κρατούνται χαλαρά — σαν να κρατάς ένα ποτήρι νερό χωρίς να το χύσεις.','Μην κοιτάς κάτω στα πόδια. Αν χαθείς, κοίτα τον διπλανό.','Κινείσαι ΠΑΝΤΑ προς τα δεξιά — αντίθετα από τους δείκτες ρολογιού.'],
    mistakes:['Λάθος: Σταύρωμα πάντα μπρος. Σωστό: Βήμα 2 = μπρος, Βήμα 4 = πίσω.','Λάθος: Βιάζεσαι στο αργό. Σωστό: 3 χτύποι — νιώσε κάθε έναν.','Λάθος: Τεντωμένα γόνατα. Σωστό: Ελαφρά λύγισμα πάντα.'],
  },
  {
    id:'syrtos',name:'Συρτός',region:'Πανελλήνιος',
    difficulty:1,rhythm:'2/4',rhythmGroups:[2,2],
    rhythmCount:'<strong>ΈΝΑ</strong>-και, <strong>ΔΎΟ</strong>-και',
    rhythmFeel:'ομαλό – κυματιστό',
    mnemonic:'ΠΆΜΕ · ΕΛΑ',mnemonicHint:'Απλό, ρέον — η βάση όλων των χορών',
    tempo:'Μέτριο',eighthMs:260,
    wikiTitle:'Syrtos',wikiTitleEl:'Συρτός',
    hold:'V-πιασιά ή W-πιασιά ανάλογα με την περιοχή',

// ── STATE ─────────────────────────────────────────
let activeDiff=0,currentDance=null,currentTab='desc',practiceStep=0;
let metroActive=false,metroTimeout=null,metroBeat=0,audioCtx=null;
const $=id=>document.getElementById(id);
const diffLabel=d=>d===1?'Εύκολος':d===2?'Μέτριος':'Δύσκολος';
const footCls=f=>f==='Δ'?'fD':f==='Α'?'fA':'fAD';
const footTxt=f=>f==='Δ'?'Δ':f==='Α'?'Α':'ΑΔ';
const beatCls=t=>t==='γρ.'?'bq':t==='αργ.'?'bs':'bn';
const snFC=f=>f==='Δ'?'D':f==='Α'?'A':'AD';

// ── WIKIPEDIA IMAGES ──────────────────────────────
async function loadWikiImage(dance){
  for(const [lang,title] of [['el',dance.wikiTitleEl],['en',dance.wikiTitle]]){
    if(!title) continue;
    try{
      const r=await fetch(`https://${lang}.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(title)}&prop=pageimages&format=json&pithumbsize=700&origin=*`);
      const j=await r.json();
      const src=Object.values(j.query.pages)[0]?.thumbnail?.source;
      if(src){const img=$('img-'+dance.id);if(img){img.src=src;img.onload=()=>img.classList.add('loaded');}return;}
    }catch(e){}
  }
}

// ── AUDIO ─────────────────────────────────────────
function getCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function playBeat(accent){
  try{
    const ctx=getCtx(),osc=ctx.createOscillator(),g=ctx.createGain();
    osc.connect(g);g.connect(ctx.destination);osc.type='triangle';
    osc.frequency.value=accent?900:540;
    const t=ctx.currentTime;
    g.gain.setValueAtTime(accent?.45:.25,t);g.gain.exponentialRampToValueAtTime(.001,t+(accent?.09:.06));
    osc.start(t);osc.stop(t+.12);
  }catch(e){}
}

// ── METRONOME ─────────────────────────────────────
function startMetro(){
  if(!currentDance)return;
  if(metroActive){stopMetro();return;}
  metroActive=true;metroBeat=0;
  const btn=$('metro-btn');if(btn){btn.classList.add('playing');btn.textContent='⏹ Σταμάτα';}
  tickMetro();
}
function stopMetro(){
  metroActive=false;clearTimeout(metroTimeout);
  document.querySelectorAll('.mbd').forEach(d=>d.classList.remove('lit'));
  const btn=$('metro-btn');if(btn){btn.classList.remove('playing');btn.textContent='▶ Άκου τον ρυθμό';}
  const cd=$('metro-cd');if(cd)cd.textContent='';
}
function tickMetro(){
  if(!metroActive||!currentDance)return;
  const d=currentDance,groups=d.rhythmGroups,total=groups.reduce((a,b)=>a+b,0);
  let pos=0,isAccent=false;
  for(const g of groups){if(metroBeat===pos){isAccent=true;break;}pos+=g;}
  playBeat(isAccent);
  document.querySelectorAll('.mbd[data-i]').forEach(dot=>{
    dot.classList.remove('lit');
    if(parseInt(dot.dataset.i)===metroBeat)dot.classList.add('lit');
  });
  const cd=$('metro-cd');if(cd){
    let label='',idx=0;
    outer:for(const g of groups){for(let b=0;b<g;b++){if(idx===metroBeat){label=b===0?'ΈΝΑ':String(b+1);break outer;}idx++;}}
    cd.textContent=label;
  }
  metroBeat=(metroBeat+1)%total;
  metroTimeout=setTimeout(tickMetro,d.eighthMs);
}
function buildDots(dance){
  let h='',i=0;
  dance.rhythmGroups.forEach((g,gi)=>{
    for(let b=0;b<g;b++){h+=`<div class="mbd ${b===0?'acc':'light'}" data-i="${i++}"></div>`;}
    if(gi<dance.rhythmGroups.length-1)h+=`<div class="mbd sep"></div>`;
  });
  return h;
}

// ── STEP NAVIGATOR ────────────────────────────────
function renderNav(dance){
  const s=dance.steps[practiceStep];
  const dots=dance.steps.map((_,i)=>`<div class="sn-d${i<practiceStep?' done':i===practiceStep?' now':''}"></div>`).join('');
  return `<div class="step-nav">
    <div class="sn-label"><span>ΕΞΑΣΚΗΣΗ ΒΗΜΑΤΙΣΜΟΥ</span><div class="sn-dots-row">${dots}</div></div>
    <div class="sn-main">
      <div class="sn-foot ${snFC(s.foot)}">${footTxt(s.foot)}</div>
      <div>
        <div class="sn-dir">${s.dir||''}</div>
        <div class="sn-move">${s.move}</div>
        <div class="sn-beat-row"><span class="beat-chip ${beatCls(s.tempo)}">${s.count}</span><span style="font-size:11px;color:var(--tx3);margin-left:4px">${s.tempo}</span></div>
        <div class="sn-detail">${s.detail}</div>
      </div>
    </div>
    <div class="sn-btns">
      <button class="sn-btn sn-prev" onclick="prevStep()" ${practiceStep===0?'disabled':''}>← Πίσω</button>
      <span class="sn-counter">${practiceStep+1} / ${dance.steps.length}</span>
      <button class="sn-btn sn-next" onclick="nextStep()" ${practiceStep===dance.steps.length-1?'disabled':''}>Επόμενο →</button>
    </div>
  </div>`;
}
function prevStep(){if(practiceStep>0){practiceStep--;reSteps();}}
function nextStep(){if(currentDance&&practiceStep<currentDance.steps.length-1){practiceStep++;reSteps();}}
function reSteps(){if(currentTab!=='steps'||!currentDance)return;const b=$('sheet-body'),y=b.scrollTop;renderTab();b.scrollTop=y;}

// ── RENDER ────────────────────────────────────────
function renderCards(){
  const g=$('grid'),list=activeDiff===0?DANCES:DANCES.filter(d=>d.difficulty===activeDiff);
  if(!list.length){g.innerHTML='<div style="padding:60px 20px;text-align:center;color:var(--tx3)">Δεν βρέθηκαν χοροί.</div>';return;}
  g.innerHTML=list.map(d=>`
    <div class="card" onclick="openDetail('${d.id}')">
      <div class="card-img" style="background:${d.gradient}">
        <img id="img-${d.id}" src="" alt="${d.name}" onerror="this.style.display='none'">
        <div class="card-img-ov"></div>
        <div class="card-img-txt"><div class="card-name">${d.name}</div><div class="card-region">📍 ${d.region}</div></div>
      </div>
      <div class="card-info">
        <div class="card-meta">
          <span class="badge badge-r">${d.rhythm}</span>
          <span class="badge badge-d">${diffLabel(d.difficulty)}</span>
          <div class="dots">${[1,2,3].map(i=>`<div class="dot ${i<=d.difficulty?'on':'off'}"></div>`).join('')}</div>
        </div>
        <p class="card-desc">${d.description}</p>
        <button class="card-btn">Μάθε τα βήματα →</button>
      </div>
    </div>`).join('');
  list.forEach(d=>loadWikiImage(d));
}

function openDetail(id){
  currentDance=DANCES.find(d=>d.id===id);if(!currentDance)return;
  practiceStep=0;currentTab='desc';
  $('sh-name').textContent=currentDance.name;
  $('sh-region').textContent=`${currentDance.region} · ${currentDance.rhythm}`;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab==='desc'));
  renderTab();
  $('backdrop').classList.add('open');$('sheet').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeDetail(){
  stopMetro();
  $('backdrop').classList.remove('open');$('sheet').classList.remove('open');
  document.body.style.overflow='';
  setTimeout(()=>{currentDance=null;},350);
}
function switchTab(tab){
  if(tab!=='rhythm')stopMetro();
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  renderTab();$('sheet-body').scrollTop=0;
}

function renderTab(){
  const d=currentDance;if(!d)return;
  const body=$('sheet-body');
  if(currentTab==='desc'){
    body.innerHTML=`
      <div class="sec"><h4>Ιστορία & Περιγραφή</h4><p class="desc-text">${d.description}</p></div>
      <div class="sec"><h4>Στοιχεία Χορού</h4>
        <div class="meta-grid">
          <div class="meta-item"><label>Περιοχή</label><span>${d.region}</span></div>
          <div class="meta-item"><label>Ρυθμός</label><span>${d.rhythm}</span></div>
          <div class="meta-item"><label>Τέμπο</label><span>${d.tempo}</span></div>
          <div class="meta-item"><label>Δυσκολία</label><span>${diffLabel(d.difficulty)}</span></div>
          <div class="meta-item meta-full"><label>Πιασιά</label><span>${d.hold}</span></div>
          <div class="meta-item meta-full"><label>Κατεύθυνση</label><span>${d.direction}</span></div>
        </div>
      </div>`;
  } else if(currentTab==='steps'){
    const legend=`<div class="foot-legend">
      <span class="fl-item"><div class="foot-badge fD" style="width:26px;height:26px;font-size:11px">Δ</div>Δεξί πόδι</span>
      <span class="fl-item"><div class="foot-badge fA" style="width:26px;height:26px;font-size:11px">Α</div>Αριστερό</span>
      <span class="fl-item"><div class="foot-badge fAD" style="width:26px;height:26px;font-size:11px">ΑΔ</div>Αμφότερα</span>
    </div>`;
    const intro=`<div class="steps-intro">Αίσθηση: <strong>${d.rhythmFeel}</strong> — Ξεκίνα αργά, μέτρα δυνατά, μετά ανέβασε ταχύτητα.</div>`;
    const steps=d.steps.map(s=>`
      <div class="step-item${s.n===d.steps[practiceStep].n?' active':''}">
        <div class="step-n">${s.n}.</div>
        <div class="foot-badge ${footCls(s.foot)}">${footTxt(s.foot)}</div>
        <div class="step-dir">${s.dir||''}</div>
        <div>
          <div class="step-move">${s.move}</div>
          <div class="step-detail">${s.detail}</div>
          <span class="beat-chip ${beatCls(s.tempo)}">${s.count} · ${s.tempo}</span>
        </div>
      </div>`).join('');
    body.innerHTML=legend+renderNav(d)+intro+steps;
  } else {
    body.innerHTML=`
      <div class="sec"><h4>Άκου τον Ρυθμό — Μετρονόμος</h4>
        <div class="metro-box">
          <div class="metro-beats">${buildDots(d)}</div>
          <div class="metro-controls">
            <button class="metro-btn" id="metro-btn" onclick="startMetro()">▶ Άκου τον ρυθμό</button>
            <span class="metro-tempo">${Math.round(60000/d.eighthMs/2)} BPM</span>
            <span class="metro-cd" id="metro-cd"></span>
          </div>
        </div>
        <div class="beat-count-display">${d.rhythmCount}</div>
      </div>
      <div class="sec"><h4>Μνημονικό — Θυμήσου τον Ρυθμό</h4>
        <div class="mnemonic-box">
          <div class="mnemonic-label">Φώναζε αυτό ενώ χορεύεις</div>
          <div class="mnemonic-phrase">${d.mnemonic}</div>
          <div class="mnemonic-hint">${d.mnemonicHint}</div>
        </div>
      </div>
      <div class="sec"><h4>Συμβουλές Επαγγελματία</h4>
        <ul class="tips-list">${d.tips.map(t=>`<li>${t}</li>`).join('')}</ul>
      </div>
      <div class="sec"><h4>Συχνά Λάθη Αρχαρίων</h4>
        <ul class="mistakes-list">${d.mistakes.map(m=>`<li>${m}</li>`).join('')}</ul>
      </div>`;
  }
}

$('filters').addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  activeDiff=parseInt(c.dataset.diff);
  document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===c));
  renderCards();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});
let ty=0;
$('sheet').addEventListener('touchstart',e=>{ty=e.touches[0].clientY;},{passive:true});
$('sheet').addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-ty>80&&$('sheet-body').scrollTop<10)closeDetail();},{passive:true});
renderCards();
</script>
</body>
</html>
